<meta name="description" content="Analyze ServiceNow incident exports, find repeat work, and prioritize automation. All analysis happens locally in your browser.">

<style>

/* ToilLens · Ally Financial visual theme.
   Logo geometry and brand palette sourced from https://www.ally.com/ (September 2026).
   Core colors: plum 500 #852EF2, plum 900 #16052B, highlighter 500 #C6FF3A.
   Lighter plum and highlighter variants preserve contrast in dark and light themes.
   Logo is embedded; the file has no external asset dependencies. */
:root{
  color-scheme:dark;
  --ally-plum:#852EF2;--ally-deep:#16052B;--ally-lime:#C6FF3A;
  --bg:#100818;--panel:#21142F;--panel2:#16052B;--raise:#2B114B;
  --line:#3D2B4C;--line2:#715B83;--ink:#FCFBFD;--muted:#CBC0D8;--dim:#B09CC4;
  --accent:#C5AEFE;--accent-ink:#16052B;--primary:var(--ally-plum);--primary-ink:#FFFFFF;--logo-ink:#FFFFFF;
  --toil:#EFC073;--auto:#C5AEFE;--prob:#FFADFD;--bad:#FF939B;--good:#C6FF3A;--info:#8DD3F3;--biz:var(--ally-lime);
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --r:16px;--shadow:0 14px 36px #00000020;--shadow-sm:0 3px 14px #00000015;
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#F6F6F6;--panel:#FFFFFF;--panel2:#FCFBFD;--raise:#EFE9F8;
  --line:#E3DBEA;--line2:#B7A5C8;--ink:#16052B;--muted:#62526F;--dim:#766280;
  --accent:#852EF2;--accent-ink:#FFFFFF;--primary:var(--ally-plum);--primary-ink:#FFFFFF;--logo-ink:var(--ally-deep);
  --toil:#996315;--auto:#661EAD;--prob:#954293;--bad:#C42116;--good:#5A7E00;--info:#1C6385;--biz:#5A7E00;
  --shadow:0 14px 36px #16052B09;--shadow-sm:0 3px 14px #16052B05;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-size:16px}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
button:not(:disabled){cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
input:focus-visible,select:focus-visible{outline-offset:2px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border:2px solid var(--panel2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
[hidden]{display:none!important}
.icon{display:inline-block;width:20px;height:20px;flex:0 0 20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;overflow:visible}
.skip-link{position:fixed;top:10px;left:10px;z-index:500;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:8px;transform:translateY(-200%)}
.skip-link:focus{transform:translateY(0)}
/* Shell */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);height:100vh;height:100dvh;overflow:hidden}
.side{background:var(--panel2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:30}
.brand{padding:27px 22px 25px;display:flex;gap:11px;align-items:center}
.brand svg.ally-logo{display:block;width:60px;height:auto;aspect-ratio:1818.4/1037.4;flex:0 0 60px;fill:var(--logo-ink);stroke:none;overflow:visible}
.brand-product{min-width:0;border-left:1px solid var(--line2);padding-left:13px}
.brand .brand-product b{font-size:1.13rem;letter-spacing:-.04em}
.brand .brand-product small{font-size:.75rem;line-height:1.4}
.brand b{display:block;font-size:1.28rem;letter-spacing:-.055em;font-weight:700;line-height:1.2}
.brand small{display:block;margin-top:4px;font-size:.75rem;color:var(--dim);letter-spacing:.03em}
nav{padding:0 12px 16px;overflow:auto;flex:1;min-height:0}
.nav-section{padding:22px 13px 9px;color:var(--dim);font-size:.75rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.nav-section:first-child{padding-top:9px}
.navbtn{display:flex;width:100%;align-items:center;gap:11px;padding:12px;margin:3px 0;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--muted);font-size:.875rem;text-align:left;line-height:1.4;transition:background .18s,color .18s,border-color .18s}
.navbtn:hover{background:var(--raise);color:var(--ink)}
.navbtn[aria-current="true"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel2));border-color:color-mix(in srgb,var(--accent) 19%,var(--line));font-weight:600}
.navbtn .ico{display:grid;place-items:center;flex-shrink:0}
.navbtn .icon{width:18px;height:18px;flex-basis:18px}
.navbtn .tag{margin-left:auto;color:var(--dim);font-size:.75rem;font-variant-numeric:tabular-nums}
.navbtn .tag:not(:empty){padding:1px 6px;background:var(--raise);border-radius:5px}
.navbtn[aria-current="true"] .tag{color:var(--accent)}
.side-foot{margin:0 16px;padding:17px 0 20px;border-top:1px solid var(--line);display:grid;gap:9px}
.status{padding:4px 0 13px;color:var(--dim);font-size:.75rem;line-height:1.8;overflow-wrap:anywhere}
.status b{font-weight:600;color:var(--muted)}
.status-title{display:flex;align-items:center;gap:7px;font-size:.875rem;color:var(--ink);margin-bottom:7px}
.status-title .icon{width:16px;height:16px;flex-basis:16px}
.dataset-line{display:flex;justify-content:space-between;gap:8px}
.main{min-width:0;min-height:0;display:flex;flex-direction:column;background:radial-gradient(ellipse at 100% 0%,color-mix(in srgb,var(--accent) 3%,transparent),transparent 48%),var(--bg)}
.workspace-header{min-height:82px;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:17px 32px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel2) 75%,transparent)}
.breadcrumb{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:.875rem;min-width:0}
.breadcrumb strong{color:var(--ink);font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.breadcrumb>.icon{width:14px;height:14px;flex-basis:14px}
.header-actions{display:flex;align-items:center;gap:16px;flex-shrink:0}
.privacy-tag{display:flex;align-items:center;gap:7px;font-size:.75rem;color:var(--muted)}
.privacy-tag .icon{color:var(--accent);width:15px;height:15px;flex-basis:15px}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:10px;color:var(--muted);background:var(--panel);transition:color .15s,background .15s}
.icon-btn:hover{color:var(--accent);background:var(--raise)}
.menu-toggle{display:none;margin-left:auto}
.views{padding:30px 32px 40px;min-height:0;overflow:auto;flex:1;scroll-behavior:smooth;scrollbar-gutter:stable}
.view{max-width:1580px;margin:0 auto;display:none;min-width:0}
.view.on{display:block;animation:enter .24s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.view>h2{font-size:1.9rem;letter-spacing:-.035em;font-weight:650;line-height:1.2;margin:0 0 10px}
.view>p.lede{font-size:1rem;line-height:1.65;max-width:88ch;color:var(--muted);margin:0 0 26px}
.view-kicker{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:.75rem;letter-spacing:.11em;font-weight:600;text-transform:uppercase;color:var(--accent)}
.view-kicker .icon{width:15px;height:15px;flex-basis:15px}
/* Controls and filters */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;max-width:100%;padding:9px 14px;background:var(--panel);border:1px solid var(--line2);border-radius:9px;color:var(--ink);font-size:.875rem;font-weight:550;line-height:1.35;text-decoration:none;transition:background .16s,border-color .16s,box-shadow .16s}
.btn:hover{background:var(--raise);border-color:var(--muted)}
.btn .icon{width:17px;height:17px;flex-basis:17px}
.btn.primary{background:var(--primary);border-color:var(--primary);border-radius:24px;color:var(--primary-ink);box-shadow:0 4px 16px color-mix(in srgb,var(--primary) 20%,transparent);font-weight:650}
.btn.primary:hover{background:#661EAD;border-color:#661EAD;box-shadow:0 6px 20px color-mix(in srgb,var(--primary) 26%,transparent)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--raise)}
.btn.sm{min-height:34px;font-size:.875rem;padding:6px 10px;border-radius:7px}
select,input[type=text],input[type=number],input[type=date],input[type=search]{min-height:41px;width:auto;max-width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:9px 11px;font-size:.875rem;line-height:1.4;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:var(--dim);opacity:1}
input:hover,select:hover{border-color:var(--muted)}
input:focus,select:focus{border-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px;flex:0 0 17px}
label.fld{display:grid;align-content:start;gap:7px;font-size:.875rem;color:var(--muted);min-width:0}
label.fld input,label.fld select{width:100%;min-width:0}
.topbar{padding:16px 32px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel2) 65%,transparent);position:relative;z-index:25}
.topbar:empty{display:none}
.filter-primary{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.filter-search{position:relative;flex:1;min-width:190px}
.filter-search>.icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--dim);pointer-events:none}
.filter-search input{width:100%;padding-left:38px}
.date-range{display:flex;align-items:center;gap:8px;min-width:0}
.date-range>.icon{width:16px;height:16px;flex-basis:16px;color:var(--dim)}
.filter-date{display:flex;align-items:center;gap:7px;min-width:0}
.filter-date span{font-size:.75rem;color:var(--dim)}
.filter-date input{width:149px;font-size:.8125rem;padding:8px}
.filter-secondary{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.filter-label{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:.75rem;margin-right:4px}
.filter-label .icon{width:16px;height:16px;flex-basis:16px}
.filter-secondary>select{max-width:210px;min-height:36px;padding:6px 10px}
.filter-secondary>.btn{min-height:36px;padding:6px 10px}
#scope{margin-left:auto;text-transform:none;letter-spacing:0;font-family:var(--sans);border:0;font-size:.8125rem;background:transparent;padding-right:0}
.ms{position:relative;min-width:0}
.ms>button{display:flex;gap:7px;align-items:center;min-height:36px;max-width:230px;border:1px solid var(--line);border-radius:7px;padding:6px 10px;background:var(--panel);font-size:.875rem;line-height:1.4}
.ms>button:hover,.ms.open>button{border-color:var(--accent)}
.ms:has(input:checked)>button{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 6%,var(--panel))}
.ms:has(input:checked)>button .n{color:var(--accent)}
.ms>button .n{font-size:.75rem;color:var(--dim)}
.ms>button .n.selected{color:var(--accent)}
.ms>button .cv{display:flex;color:var(--dim)}
.cv .icon{width:13px;height:13px;flex-basis:13px}
.ms-menu{display:none;position:absolute;z-index:60;left:0;top:calc(100% + 8px);width:284px;background:var(--panel);border:1px solid var(--line2);border-radius:13px;padding:12px;box-shadow:0 20px 60px #00000040}
.ms.open .ms-menu{display:block}
.ms-list{max-height:250px;overflow:auto;display:grid;gap:2px;margin-top:8px}
.ms-list label{display:flex;align-items:center;gap:9px;font-size:.875rem;padding:8px 6px;border-radius:5px;cursor:pointer;overflow-wrap:anywhere}
.ms-list label:hover{background:var(--raise)}
.ms-list .ct{margin-left:auto;color:var(--dim);font-size:.75rem}
.ms-menu .row{display:flex;gap:8px;padding-top:10px;margin-top:6px;border-top:1px solid var(--line)}
.ms-menu input[type=search]{width:100%}
/* Analysis surfaces */
.grid{display:grid;gap:18px;min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-sm)}
.card>header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;flex-wrap:wrap;gap:5px 12px}
.card>header h3{margin:0;font-size:1rem;line-height:1.4;font-weight:600;letter-spacing:-.015em}
.card>header .sub{color:var(--dim);font-size:.75rem;line-height:1.5}
.card>header .right{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.card .body{padding:22px}
.eyebrow{color:var(--dim);font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.kpi{padding:20px;position:relative;min-width:0;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm)}
.kpi .lbl{color:var(--muted);font-size:.875rem;font-weight:500;line-height:1.5}
.kpi .val{margin-top:12px;color:var(--k,var(--ink));font-size:2.15rem;line-height:1.15;font-weight:600;letter-spacing:-.055em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .val small{font-size:.875rem;font-weight:400;letter-spacing:0;color:var(--muted)}
.kpi .note{margin-top:10px;font-size:.75rem;line-height:1.6;color:var(--dim)}
.kpi.featured{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,var(--panel)),var(--panel));border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.kpi.featured:after{content:"";width:130px;height:130px;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 14%,transparent);position:absolute;right:-55px;top:-70px;box-shadow:0 0 0 18px color-mix(in srgb,var(--accent) 3%,transparent);pointer-events:none}
.kpi.featured .lbl{color:var(--accent)}
html[data-theme="dark"] .kpi.featured .val{color:var(--ally-lime)}
.kpi-label{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi-label>.icon{color:var(--k,var(--dim));opacity:.8;width:19px;height:19px;flex-basis:19px}
.kpi-strip{gap:0;background:var(--panel2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kpi-strip .kpi{border:0;border-right:1px solid var(--line);border-radius:0;background:transparent;box-shadow:none;padding:17px 20px}
.kpi-strip .kpi:last-child{border-right:0}
.kpi-strip .val{font-size:1.6rem;margin-top:8px;letter-spacing:-.035em}
.kpi-strip .note{margin-top:6px}
/* Tables */
.tw{max-width:100%;overflow:auto;scrollbar-gutter:stable}
table{width:100%;border-collapse:collapse;font-size:.875rem;line-height:1.6}
th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{position:sticky;top:0;z-index:2;background:var(--panel2);color:var(--dim);font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.045em;white-space:nowrap;border-bottom:1px solid var(--line2);cursor:pointer}
thead th:hover{color:var(--accent)}
thead th .ar{color:var(--accent)}
tbody tr:last-child>td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover{background:color-mix(in srgb,var(--accent) 4%,var(--panel))}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.mono{font-family:var(--mono);font-size:.8125rem}
td.wrap{min-width:240px}
.rank{font-family:var(--mono);color:var(--dim);font-size:.8125rem}
.expander{width:34px;font-size:1rem!important;padding:4px!important}
.sub-row td{background:var(--panel2);padding:0}
.sub-inner{padding:20px;border-left:3px solid var(--accent)}
.sig{font-family:var(--mono);font-size:.8125rem;color:var(--muted);word-break:break-word;line-height:1.75}
.sig .ph{color:var(--auto);background:color-mix(in srgb,var(--auto) 10%,transparent);padding:2px 4px;border-radius:4px}
.sigbox{border:1px solid var(--line2);border-left:3px solid var(--auto);border-radius:8px;padding:12px 14px;background:var(--panel2)}
.bar{height:8px;border-radius:10px;background:var(--line);overflow:hidden;min-width:36px}
.bar>i{display:block;height:100%;border-radius:10px;background:var(--toil);transition:width .5s ease-out}
.bar.dual{height:auto;background:transparent;overflow:visible;display:grid;gap:3px}
.bar.dual>span{display:block;height:6px;border-radius:10px;background:var(--line);overflow:hidden}
.bar.dual>span>i{display:block;height:100%;border-radius:10px;transition:width .5s ease-out}
.barlist-value.dual{display:grid;gap:2px;line-height:1.25}
.barlist-value.dual>i{font-style:normal}
.barlist{gap:15px}
.barlist-row{display:grid;grid-template-columns:minmax(80px,1fr) 1.35fr auto;gap:12px;align-items:center}
.barlist-label{font-size:.875rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barlist-value{font-size:.8125rem;font-variant-numeric:tabular-nums;color:var(--muted);min-width:54px;text-align:right}
.ledger{display:flex;height:8px;border-radius:10px;overflow:hidden;background:var(--line);min-width:90px}
.ledger i{display:block;height:100%}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;border:1px solid var(--line2);font-size:.75rem;line-height:1.5;color:var(--muted);white-space:nowrap}
.pill.toil{color:var(--toil);background:color-mix(in srgb,var(--toil) 7%,transparent);border-color:color-mix(in srgb,var(--toil) 25%,var(--line))}
.pill.auto{color:var(--auto);background:color-mix(in srgb,var(--auto) 7%,transparent);border-color:color-mix(in srgb,var(--auto) 25%,var(--line))}
.pill.prob{color:var(--prob);background:color-mix(in srgb,var(--prob) 7%,transparent);border-color:color-mix(in srgb,var(--prob) 25%,var(--line))}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,transparent);border-color:color-mix(in srgb,var(--bad) 25%,var(--line))}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 7%,transparent);border-color:color-mix(in srgb,var(--good) 25%,var(--line))}
.score{font-variant-numeric:tabular-nums;font-weight:600}
.dot{display:inline-block;width:7px;height:7px;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:10px 15px;font-size:.75rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
svg:not(.icon){display:block;width:100%;height:auto;overflow:visible}
.ax{stroke:var(--line2);stroke-width:1}
.axtxt{fill:var(--dim);font-family:var(--sans);font-size:1rem}
.gl{stroke:var(--line);stroke-dasharray:3 5;stroke-width:1}
.blab{fill:var(--muted);font-family:var(--sans);font-size:1rem}
.chart-scroll{overflow:auto;min-width:0;max-width:100%;padding:1px}
.chart-scroll>svg{min-width:550px}
/* Import workspace */
.empty{max-width:1170px;margin:4px auto 0}
.empty-heading{margin-bottom:30px}
.empty-heading h2{font-size:clamp(1.85rem,2.5vw,2.6rem);letter-spacing:-.045em;line-height:1.18;font-weight:600;margin:0 0 12px;max-width:760px}
.empty-heading p{font-size:1rem;color:var(--muted);margin:0;max-width:720px;line-height:1.7}
.import-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(250px,1fr);gap:20px}

<script>
/* ============================================================
   ToilLens — ServiceNow incident → toil & automation console
   Single file, no dependencies. All processing stays in-browser.
   ============================================================ */
'use strict';

/* ---------- tiny utils ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uniq = a => Array.from(new Set(a));
const num = n => (n == null || !isFinite(n)) ? '—' : Math.round(n).toLocaleString();
const dec = (n, d) => (n == null || !isFinite(n)) ? '—' : (Math.round(n * Math.pow(10, d || 1)) / Math.pow(10, d || 1)).toLocaleString();
const money = n => (n == null || !isFinite(n)) ? '—' : (Math.abs(n) >= 1000 ? '$' + Math.round(n).toLocaleString() : '$' + Math.round(n));
const pct = n => (n == null || !isFinite(n)) ? '—' : (Math.round(n * 1000) / 10) + '%';
const hrs = h => (h == null || !isFinite(h)) ? '—' : h < 1 ? Math.round(h * 60) + 'm' : h < 72 ? (Math.round(h * 10) / 10) + 'h' : (Math.round(h / 24 * 10) / 10) + 'd';
const median = a => { if (!a.length) return NaN; const b = a.slice().sort((x, y) => x - y); const m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };
const quant = (a, q) => { if (!a.length) return NaN; const b = a.slice().sort((x, y) => x - y); const p = (b.length - 1) * q, lo = Math.floor(p), hi = Math.ceil(p); return b[lo] + (b[hi] - b[lo]) * (p - lo); };
const sum = a => a.reduce((x, y) => x + (isFinite(y) ? y : 0), 0);
const mean = a => a.length ? sum(a) / a.length : NaN;
const topN = (map, n) => Array.from(map.entries()).sort((a, b) => b[1] - a[1]).slice(0, n);
const bump = (map, k, by) => map.set(k, (map.get(k) || 0) + (by == null ? 1 : by));
const top1 = m => { const t = topN(m, 1)[0]; return t ? t[0] : ''; };
const topStr = (m, n) => topN(m, n).map(x => x[0] + ' (' + x[1] + ')').join(' | ');
const DAYNAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2600);
}

/* ---------- CSV ---------- */
function sniffDelim(text) {
  const line = text.slice(0, 8000).split(/\r?\n/)[0] || '';
  let best = ',', bestN = -1;
  [',', ';', '\t', '|'].forEach(d => {
    let n = 0, q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') q = !q; else if (c === d && !q) n++;
    }
    if (n > bestN) { bestN = n; best = d; }
  });
  return best;
}

function parseCSV(text, delim) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const d = delim || sniffDelim(text);
  const rows = []; let row = [], field = '', inQ = false, i = 0;
  const n = text.length;
  while (i < n) {
    const c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if (c === '"') { inQ = true; i++; continue; }
    if (c === d) { row.push(field); field = ''; i++; continue; }
    if (c === '\r') { i++; continue; }
    if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
    field += c; i++;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  // drop fully blank rows
  return rows.filter(r => r.some(v => String(v).trim() !== ''));
}

/* ---------- dates ---------- */
function detectDateOrder(vals) {
  let dmy = 0, mdy = 0;
  for (const v of vals) {
    const m = String(v).match(/^\s*(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
    if (!m) continue;
    if (+m[1] > 12) dmy++; else if (+m[2] > 12) mdy++;
  }
  return dmy > mdy ? 'DMY' : 'MDY';
}

function parseDate(v) {
  if (!v) return null;
  if (v instanceof Date) return isNaN(v) ? null : v;
  const s = String(v).trim();
  if (!s || /^(null|n\/a|na|-|--)$/i.test(s)) return null;
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:[ ,]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?\s*(AM|PM)?/i);
  if (m) {
    let a = +m[1], b = +m[2], y = +m[3]; if (y < 100) y += 2000;
    let day, mon;
    const order = S.cfg.dateOrder === 'auto' ? (a > 12 ? 'DMY' : S.cfg._auto || 'MDY') : S.cfg.dateOrder;
    if (order === 'DMY' || a > 12) { day = a; mon = b; } else { mon = a; day = b; }
    let H = +(m[4] || 0); const ap = (m[7] || '').toUpperCase();
    if (ap === 'PM' && H < 12) H += 12; if (ap === 'AM' && H === 12) H = 0;
    return new Date(y, mon - 1, day, H, +(m[5] || 0), +(m[6] || 0));
  }
  const t = Date.parse(s);
  return isNaN(t) ? null : new Date(t);
}

const normHdr = h => String(h || '').toLowerCase().replace(/[_\-.]+/g, ' ').replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();

function autoMap(headers) {
  const map = {}; const used = new Set();
  const norm = headers.map(normHdr);
  FIELDS.forEach(f => {
    let best = -1, bestScore = 0;
    norm.forEach((h, i) => {
      if (used.has(i) || !h) return;
      let sc = 0;
      if (f.alias.indexOf(h) >= 0) sc = 100 - f.alias.indexOf(h);
      else if (f.alias.some(a => h === a + 's')) sc = 70;
      else if (f.alias.some(a => a.length > 4 && h.indexOf(a) >= 0)) sc = 45 - h.length * 0.1;
      else if (f.alias.some(a => a.length > 5 && a.indexOf(h) >= 0 && h.length > 4)) sc = 30;
      if (sc > bestScore) { bestScore = sc; best = i; }
    });
    if (best >= 0) { map[f.k] = headers[best]; used.add(best); }
  });
  return map;
}

/* ---------- priority ---------- */
function priorityRank(v) {
  const s = String(v || '').toLowerCase();
  const m = s.match(/(\d)/);
  if (m) { const n = +m[1]; if (n >= 1 && n <= 5) return n; }
  if (/critical|sev\s*1|p1|highest|emergency/.test(s)) return 1;
  if (/high|sev\s*2|p2|major/.test(s)) return 2;
  if (/moderate|medium|sev\s*3|p3|normal/.test(s)) return 3;
  if (/low|sev\s*4|p4|minor/.test(s)) return 4;
  if (/planning|sev\s*5|p5/.test(s)) return 5;
  return 3;
}

const isResolvedState = v => /resolv|clos|complete|done|cancel/i.test(String(v || ''));

/* ---------- working-day overlap: hours of an interval that fall inside the working day ---------- */
function workingOverlap(a, b, bh0, bh1) {
  if (!a || !b || b <= a) return 0;
  let total = 0, guard = 0;
  const day = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  while (day < b && guard++ < 400) {
    const dow = day.getDay();
    if (dow !== 0 && dow !== 6) {
      const ws = new Date(day.getFullYear(), day.getMonth(), day.getDate(), bh0, 0, 0);
      const we = new Date(day.getFullYear(), day.getMonth(), day.getDate(), bh1, 0, 0);
      const st = Math.max(ws, a), en = Math.min(we, b);
      if (en > st) total += (en - st) / 36e5;
    }
    day.setDate(day.getDate() + 1);
  }
  return total;
}

/* ---------- build incident objects ---------- */
function buildIncidents() {
  const m = S.map, H = S.headers;
  const idx = {}; Object.keys(m).forEach(k => { const i = H.indexOf(m[k]); if (i >= 0) idx[k] = i; });
  const get = (r, k) => idx[k] == null ? '' : (r[idx[k]] == null ? '' : String(r[idx[k]]).trim());

  // auto-detect date order once from the opened column
  if (idx.opened != null) {
    S.cfg._auto = detectDateOrder(S.rows.slice(0, 400).map(r => r[idx.opened]));
  }

  const out = [];
  const bh0 = S.cfg.bhStart, bh1 = S.cfg.bhEnd;
  S.rows.forEach((r, i) => {
    const opened = parseDate(get(r, 'opened'));
    const resolved = parseDate(get(r, 'resolved')) || parseDate(get(r, 'closed'));
    const short = get(r, 'shortDesc') || get(r, 'desc').slice(0, 160) || get(r, 'category') || '(no description)';
    const st = get(r, 'state');
    let mttr = (opened && resolved && resolved > opened) ? (resolved - opened) / 36e5 : null;
    if (mttr != null && mttr > 24 * 400) mttr = null; // junk guard
    const slaRaw = get(r, 'sla');
    let breached = null;
    if (slaRaw !== '') {
      if (/^(true|yes|y|1|met)$/i.test(slaRaw)) breached = /breach/i.test(String(m.sla || '')) ? true : false;
      else if (/^(false|no|n|0|missed|breached)$/i.test(slaRaw)) breached = /breach/i.test(String(m.sla || '')) ? false : true;
    }
    const dow = opened ? opened.getDay() : null;
    const hour = opened ? opened.getHours() : null;
    const after = opened ? (dow === 0 || dow === 6 || hour < bh0 || hour >= bh1) : false;
    // working-day hours the ticket sat open — the raw material for business wait
    const waitH = mttr != null ? workingOverlap(opened, resolved, bh0, bh1) : null;
    const usersRaw = parseFloat(get(r, 'users')), effortRaw = parseFloat(get(r, 'bizEffort'));
    out.push({
      i, raw: r,
      id: get(r, 'id') || ('ROW-' + (i + 1)),
      opened, resolved, mttr,
      short, desc: get(r, 'desc'),
      prio: priorityRank(get(r, 'priority') || get(r, 'impact')),
      prioRaw: get(r, 'priority'),
      state: st || (resolved ? 'Resolved' : 'Open'),
      done: st ? isResolvedState(st) : !!resolved,
      category: get(r, 'category') || '(none)',
      subcat: get(r, 'subcategory'),
      group: get(r, 'group') || '(unassigned)',
      assignee: get(r, 'assignee'),
      ci: get(r, 'ci') || '(none)',
      closeCode: get(r, 'closeCode'),
      closeNotes: get(r, 'closeNotes'),
      reassign: parseFloat(get(r, 'reassign')) || 0,
      reopen: parseFloat(get(r, 'reopen')) || 0,
      breached,
      caller: get(r, 'caller'),
      channel: get(r, 'channel'),
      location: get(r, 'location'),
      month: ym(opened), dow, hour, after,
      waitH,
      users: isFinite(usersRaw) && usersRaw > 0 ? usersRaw : null,
      bizEffort: isFinite(effortRaw) && effortRaw >= 0 ? effortRaw : null,
      cid: -1
    });
  });
  S.incidents = out;
}

const STOP = new Set(('the a an of on in at for to and or is are was were be been being with from by as it its this that these those ' +
  'please kindly hi hello team dear thanks thank regards not no yes we you i has have had do does did will would can could should ' +
  'need needs required requesting requested issue issues problem incident ticket case new open close closed user users ' +
  'unable able getting getting seeing see also same again due there their they').split(/\s+/));

/* Turn a free-text description into a stable signature by masking the volatile parts. */
function normText(s) {
  return String(s || '').toLowerCase()
    .replace(/https?:\/\/\S+/g, ' <url> ')
    .replace(/[\w.+-]+@[\w-]+\.[\w.]+/g, ' <email> ')
    .replace(/\b\d{1,3}(\.\d{1,3}){3}\b/g, ' <ip> ')
    .replace(/\b[0-9a-f]{8}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{12}\b/g, ' <id> ')
    .replace(/\b[0-9a-f]{12,}\b/g, ' <hash> ')
    .replace(/\b(inc|chg|req|ritm|prb|task|rtsk|sctask)[0-9]{4,}\b/g, ' <ref> ')
    .replace(/\b\d{4}-\d{2}-\d{2}([t ]\d{2}:\d{2}(:\d{2})?)?\b/g, ' <date> ')
    .replace(/\b\d{1,2}:\d{2}(:\d{2})?\s*(am|pm)?\b/g, ' <time> ')
    .replace(/\b(?=[a-z0-9-]*\d)[a-z][a-z0-9]*(?:[-_.][a-z0-9]+)+\b/g, ' <host> ')
    .replace(/\b[a-z]:\\[^\s]+|\/(?:[\w.-]+\/){1,}[\w.-]*/g, ' <path> ')
    .replace(/\b\d+(\.\d+)?\s*(%|gb|mb|tb|kb|ms|sec|secs|s|min|mins|hrs|hours)\b/g, ' <qty> ')
    .replace(/\b\d+(\.\d+)?\b/g, ' <n> ')
    .replace(/[^a-z0-9<>_ ]+/g, ' ')
    .replace(/\s+/g, ' ').trim();
}

function tokenize(nt) {
  const seen = new Set(), out = [];
  nt.split(' ').forEach(t => {
    if (t.length < 3 || t[0] === '<' || STOP.has(t)) return;
    if (seen.has(t)) return; seen.add(t); out.push(t);
  });
  return out.slice(0, 14);
}

function jaccard(a, b) {
  if (!a.length || !b.length) return 0;
  const sa = new Set(a); let inter = 0;
  for (const t of b) if (sa.has(t)) inter++;
  return inter / (a.length + b.length - inter);
}

/* The description decides the work type; category and close code only break ties.
   Scoring beats first-match-wins — a close code of "Code Fix Deployed" should not
   turn an application defect into change fallout. */
function familyOf(primary, secondary) {
  const a = String(primary || '').toLowerCase(), b = String(secondary || '').toLowerCase();
  let best = null, bs = 0;
  for (const f of FAMILIES) {
    let sc = 0;
    if (f.re.test(a)) sc += 2;
    if (b && f.re.test(b)) sc += 1;
    if (sc > bs) { bs = sc; best = f; }
  }
  return best || FAM_OTHER;
}

/* ---------- clustering: exact signature, then fuzzy merge of near-duplicates ---------- */
function clusterIncidents() {
  const inc = S.incidents;
  const groups = new Map();
  inc.forEach(x => {
    x.nt = normText(x.short);
    x.tok = tokenize(x.nt + ' ' + normText(x.category === '(none)' ? '' : x.category));
    const key = x.nt || ('cat:' + x.category);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(x.i);
  });

  let keys = Array.from(groups.keys());
  const reps = keys.map(k => {
    const first = inc[groups.get(k)[0]];
    return { key: k, tok: first.tok, n: groups.get(k).length };
  });

  // union-find over signature groups
  const parent = reps.map((_, i) => i);
  const find = a => { while (parent[a] !== a) { parent[a] = parent[parent[a]]; a = parent[a]; } return a; };
  const union = (a, b) => { a = find(a); b = find(b); if (a !== b) parent[b > a ? b : a] = b > a ? a : b; };

  // only fuzzy-merge the busiest signatures; bounds the work on very large dumps
  const order = reps.map((r, i) => i).sort((a, b) => reps[b].n - reps[a].n).slice(0, 2500);
  const index = new Map();
  const df = new Map();
  order.forEach(i => reps[i].tok.forEach(t => bump(df, t)));
  const rare = t => (df.get(t) || 0) <= Math.max(40, order.length * 0.2);
  order.forEach(i => reps[i].tok.forEach(t => { if (!rare(t)) return; if (!index.has(t)) index.set(t, []); index.get(t).push(i); }));

  const th = S.cfg.sim;
  order.forEach(i => {
    const cand = new Map();
    reps[i].tok.forEach(t => {
      const lst = index.get(t); if (!lst || lst.length > 600) return;
      lst.forEach(j => { if (j !== i) bump(cand, j); });
    });
    cand.forEach((shared, j) => {
      if (shared < 2) return;
      if (find(i) === find(j)) return;
      if (jaccard(reps[i].tok, reps[j].tok) >= th) union(i, j);
    });
  });

  const rootToCid = new Map(); const clusters = [];
  reps.forEach((r, i) => {
    const root = find(i);
    let cid = rootToCid.get(root);
    if (cid == null) { cid = clusters.length; rootToCid.set(root, cid); clusters.push({ id: cid, members: [], sigs: [] }); }
    clusters[cid].sigs.push(r.key);
    groups.get(r.key).forEach(ix => { clusters[cid].members.push(ix); inc[ix].cid = cid; });
  });
  S.clusters = clusters;
}

/* ---------- per-view cluster statistics + scoring ---------- */
function analyze(list) {
  const cfg = S.cfg;
  const byC = new Map();
  list.forEach(x => { if (!byC.has(x.cid)) byC.set(x.cid, []); byC.get(x.cid).push(x); });

  const dates = list.map(x => x.opened).filter(Boolean).sort((a, b) => a - b);
  const spanDays = dates.length > 1 ? Math.max(1, (dates[dates.length - 1] - dates[0]) / 864e5) : 1;
  const annualise = n => spanDays >= 25 ? n * 365 / spanDays : n;
  const lastDate = dates.length ? dates[dates.length - 1] : null;
  let maxN = 1; byC.forEach(v => { if (v.length > maxN) maxN = v.length; });

  const out = [];
  byC.forEach((mem, cid) => {
    const mttrs = mem.map(x => x.mttr).filter(v => v != null && isFinite(v));
    const p50 = median(mttrs), p90 = quant(mttrs, 0.9), avg = mean(mttrs);
    const sd = mttrs.length > 1 ? Math.sqrt(mean(mttrs.map(v => (v - avg) * (v - avg)))) : 0;
    const cv = avg > 0 ? sd / avg : 0;
    const gm = new Map(), cm = new Map(), pm = new Map(), mm = new Map(), cc = new Map();
    mem.forEach(x => { bump(gm, x.group); bump(cm, x.ci); bump(pm, x.prio); if (x.month) bump(mm, x.month); if (x.closeCode) bump(cc, x.closeCode); });
    const label = (() => {
      const c = new Map(); mem.forEach(x => bump(c, x.short));
      return topN(c, 1)[0][0];
    })();
    const sigText = mem[0].nt || '(no signature)';
    const fam = familyOf(label + ' ' + sigText, (mem[0].category || '') + ' ' + topStr(cc, 2));
    const n = mem.length;
    const opens = mem.map(x => x.opened).filter(Boolean).sort((a, b) => a - b);
    const first = opens[0] || null, last = opens[opens.length - 1] || null;
    const staleDays = (last && lastDate) ? (lastDate - last) / 864e5 : 0;

    const touchH = clamp((p50 != null && isFinite(p50) ? p50 : 1) * cfg.handsOn, cfg.minTouch / 60, cfg.capTouch);
    const annualN = annualise(n);
    const annualH = annualN * touchH;
    const reassignAvg = mean(mem.map(x => x.reassign)) || 0;
    const reopenRate = mem.filter(x => x.reopen > 0).length / n;
    const afterPct = mem.filter(x => x.after).length / n;
    const p1p2 = mem.filter(x => x.prio <= 2).length / n;
    const monthsActive = mm.size;

    // --- toil score -------------------------------------------------
    const rep = clamp(Math.log(n + 1) / Math.log(maxN + 1), 0, 1);
    const persist = clamp(monthsActive / clamp(spanDays / 30, 1, 12), 0, 1);
    const quick = !isFinite(p50) ? 0.5 : p50 <= 0.5 ? 1 : p50 <= 2 ? 0.85 : p50 <= 8 ? 0.55 : p50 <= 24 ? 0.3 : 0.12;
    const predict = !isFinite(cv) ? 0.5 : cv <= 0.4 ? 1 : cv <= 0.8 ? 0.7 : cv <= 1.5 ? 0.4 : 0.2;
    const lowChurn = clamp(1 - reassignAvg / 3, 0, 1) * 0.6 + clamp(1 - reopenRate * 4, 0, 1) * 0.4;
    let toil = 100 * (0.30 * rep + 0.14 * persist + 0.18 * quick + 0.10 * predict + 0.18 * fam.auto + 0.10 * lowChurn);
    if (n < 2) toil *= 0.3; else if (n < 4) toil *= 0.72;
    if (staleDays > 90) toil *= 0.6;

    // --- automation fit ---------------------------------------------
    const oneOwner = gm.size === 1 ? 1 : gm.size <= 3 ? 0.6 : 0.3;
    const fit = 100 * (0.42 * fam.auto + 0.22 * predict + 0.18 * quick + 0.10 * oneOwner + 0.08 * clamp(monthsActive / 6, 0, 1));

    // --- effort & payback -------------------------------------------
    let tier = fam.tier;
    if (gm.size > 4 || cm.size > 14 || cv > 1.5) tier = tier === 'S' ? 'M' : 'L';
    if (n >= 10 && fam.tier === 'S' && gm.size === 1) tier = 'S';
    const buildH = cfg.build[tier];
    const recoverH = annualH * fam.auto * cfg.autoEff;
    const saving = recoverH * cfg.rate;
    const payback = recoverH > 0 ? (buildH / (recoverH / 12)) : Infinity;

    // --- business impact: working-day time the business waits, plus manual effort ---
    const waits = mem.map(x => x.waitH).filter(v => v != null && isFinite(v));
    const waitP50 = waits.length ? median(waits) : 1;
    const userVals = mem.map(x => x.users).filter(v => v != null);
    const users = userVals.length ? median(userVals) : cfg.bizUsers;
    const bizWaitH = clamp(waitP50 * fam.wait, 0, cfg.capWait) * users;
    const effortVals = mem.map(x => x.bizEffort).filter(v => v != null);
    const bizManualH = effortVals.length ? median(effortVals) : fam.manual;
    const bizH = bizWaitH + bizManualH;
    const annualBizH = annualN * bizH;
    const recoverBizH = annualBizH * fam.auto * cfg.autoEff;
    const bizSaving = recoverBizH * cfg.bizRate;
    const paybackAll = (saving + bizSaving) > 0 ? (buildH * cfg.rate) / ((saving + bizSaving) / 12) : Infinity;

    // --- what to actually do ----------------------------------------
    const severe = (p1p2 > 0.4 && isFinite(p50) && p50 > 8) || reopenRate > 0.25;
    let action, cls;
    if (staleDays > 120 && n < 10) { action = 'Watch — stopped recurring'; cls = ''; }
    else if (fam.id === 'noise' || (isFinite(p50) && p50 < 0.17 && n >= 8)) { action = 'Tune the alert'; cls = 'bad'; }
    else if (fam.id === 'app' && n >= 3) { action = 'Engineering fix'; cls = 'prob'; }
    else if (severe && fam.auto < 0.85) { action = 'Problem record — eliminate'; cls = 'prob'; }
    else if (reassignAvg >= 2 && n >= 5) { action = 'Fix routing first'; cls = 'prob'; }
    else if (fit >= 55 && n >= 4) { action = 'Automate'; cls = 'auto'; }
    else if (severe) { action = 'Problem record — eliminate'; cls = 'prob'; }
    else if (n >= 4 && toil >= 45) { action = 'Standardise runbook'; cls = 'toil'; }
    else { action = 'Monitor'; cls = ''; }

    out.push({
      cid, label, sig: sigText, family: fam, n, annualN, members: mem,
      p50, p90, cv, touchH, annualH, recoverH, saving, buildH, tier, payback,
      waitP50, users, bizWaitH, bizManualH, bizH, annualBizH, recoverBizH, bizSaving, paybackAll,
      groups: gm, cis: cm, prios: pm, months: mm, closeCodes: cc,
      reassignAvg, reopenRate, afterPct, p1p2, monthsActive, first, last, staleDays,
      toil: Math.round(toil), fit: Math.round(fit), action, cls
    });
  });

  out.sort((a, b) => b.annualH - a.annualH);
  return { clusters: out, spanDays, annualise, lastDate };
}

/* labelled horizontal bar list — used for top groups / CIs / families */
function barList(items, opt) {
  opt = opt || {};
  if (!items.length) return '<p class="hint">Nothing to show for the current filters.</p>';
  const dual = items.some(d => d.v2 != null);
  const max = Math.max(1, ...items.map(d => Math.max(d.v, d.v2 || 0)));
  const w = v => ((v / max) * 100).toFixed(1) + '%';
  return '<div class="grid barlist">' + items.map(d => {
    const bar = dual
      ? '<div class="bar dual"><span><i style="width:' + w(d.v) + ';background:' + (d.c || 'var(--toil)') + '"></i></span>' +
        '<span><i style="width:' + w(d.v2 || 0) + ';background:' + (d.c2 || 'var(--biz)') + '"></i></span></div>'
      : '<div class="bar"><i style="width:' + w(d.v) + ';background:' + (d.c || 'var(--toil)') + '"></i></div>';
    const val = dual
      ? '<div class="barlist-value dual"><i>' + esc(d.t != null ? d.t : num(d.v)) + '</i><i style="color:var(--biz)">' + esc(d.t2 != null ? d.t2 : num(d.v2 || 0)) + '</i></div>'
      : '<div class="barlist-value">' + esc(d.t != null ? d.t : num(d.v)) + '</div>';
    return '<div class="barlist-row"><div class="barlist-label" title="' + esc(d.k) + '">' + esc(d.k) + '</div>' + bar + val + '</div>';
  }).join('') + '</div>';
}

function svgLine(labels, series, opt) {
  opt = opt || {};
  const W = 720, H = opt.h || 200, pl = 56, pr = 18, pt = 12, pb = 26;
  const iw = W - pl - pr, ih = H - pt - pb;
  let max = 0; series.forEach(s => s.values.forEach(v => { if (isFinite(v) && v > max) max = v; }));
  max = max || 1;
  const nice = Math.pow(10, Math.floor(Math.log10(max)));
  const step = Math.ceil(max / nice / 4) * nice;
  const top = Math.max(step * 4, max);
  const x = i => pl + (labels.length <= 1 ? iw / 2 : (i / (labels.length - 1)) * iw);
  const y = v => pt + ih - (v / top) * ih;
  let s = '<div class="chart-scroll"><svg role="img" aria-label="' + (opt && opt.label ? esc(opt.label) : 'Incident analysis chart') + '" viewBox="0 0 ' + W + ' ' + H + '">';
  for (let g = 0; g <= 4; g++) {
    const v = top * g / 4;
    s += '<line class="gl" x1="' + pl + '" y1="' + y(v).toFixed(1) + '" x2="' + (W - pr) + '" y2="' + y(v).toFixed(1) + '"/>';
    s += '<text class="axtxt" x="' + (pl - 6) + '" y="' + (y(v) + 3).toFixed(1) + '" text-anchor="end">' + num(v) + '</text>';
  }
  const every = Math.ceil(labels.length / 12);
  labels.forEach((l, i) => { if (i % every) return; s += '<text class="axtxt" x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(l) + '</text>'; });
  series.forEach(se => {
    const pts = se.values.map((v, i) => x(i).toFixed(1) + ',' + y(isFinite(v) ? v : 0).toFixed(1));
    if (se.area) s += '<polygon points="' + (pl + ',' + (pt + ih)) + ' ' + pts.join(' ') + ' ' + ((W - pr) + ',' + (pt + ih)) + '" fill="' + se.color + '" opacity=".10"/>';
    s += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + se.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    se.values.forEach((v, i) => {
      s += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(isFinite(v) ? v : 0).toFixed(1) + '" r="2.6" fill="' + se.color + '"><title>' + esc(labels[i]) + ' — ' + esc(se.name) + ': ' + dec(v, 1) + '</title></circle>';
    });
  });
  s += '</svg></div>';
  return s;
}

function svgHeat(matrix, opt) {
  opt = opt || {};
  const W = 720, cell = 25, gap = 2, left = 40, top = 24;
  const H = top + 7 * (cell * 0.72 + gap) + 8;
  const ch = cell * 0.72;
  const cw = (W - left - 6) / 24 - gap;
  let max = 0; matrix.forEach(r => r.forEach(v => { if (v > max) max = v; })); max = max || 1;
  let s = '<div class="chart-scroll"><svg role="img" aria-label="' + (opt && opt.label ? esc(opt.label) : 'Incident analysis chart') + '" viewBox="0 0 ' + W + ' ' + H + '">';
  for (let h = 0; h < 24; h += 3) s += '<text class="axtxt" x="' + (left + h * (cw + gap) + cw / 2) + '" y="15" text-anchor="middle">' + h + '</text>';
  for (let d = 0; d < 7; d++) {

    for (let h = 0; h < 24; h++) {

      s += '<rect x="' + (left + h * (cw + gap)).toFixed(1) + '" y="' + (top + d * (ch + gap)).toFixed(1) + '" width="' + cw.toFixed(1) + '" height="' + ch.toFixed(1) + '" rx="2" fill="' + (off ? 'var(--toil)' : 'var(--auto)') + '" opacity="' + a.toFixed(3) + '" stroke="var(--line)" stroke-width=".5"><title>' + DAYNAMES[d] + ' ' + h + ':00 — ' + v + ' incidents' + (off ? ' (outside working hours)' : '') + '</title></rect>';
    }
  }
  s += '</svg></div>';
  return s;
}

/* decision quadrant: how often vs how long, bubble = hours a year */
function svgQuad(points) {
  const W = 720, H = 340, pl = 52, pr = 14, pt = 14, pb = 40;
  const iw = W - pl - pr, ih = H - pt - pb;
  const maxN = Math.max(2, ...points.map(p => p.n));
  const maxT = Math.max(0.5, ...points.map(p => isFinite(p.p50) ? p.p50 : 0.5));
  const maxR = Math.max(1, ...points.map(p => p.annualH));
  const lx = v => pl + (Math.log(v + 1) / Math.log(maxN + 1)) * iw;
  const ly = v => pt + ih - (Math.log((isFinite(v) ? v : 0.1) + 0.2) / Math.log(maxT + 0.2)) * ih;
  const midX = pl + iw * 0.42, midY = pt + ih * 0.5;
  let s = '<div class="chart-scroll"><svg role="img" aria-label="Decision quadrant: incident frequency, resolution time, and annual effort" viewBox="0 0 ' + W + ' ' + H + '">';
  s += '<line class="gl" x1="' + midX + '" y1="' + pt + '" x2="' + midX + '" y2="' + (pt + ih) + '"/>';
  s += '<line class="gl" x1="' + pl + '" y1="' + midY + '" x2="' + (W - pr) + '" y2="' + midY + '"/>';
  const q = (x, y, t, anchor) => '<text class="axtxt" x="' + x + '" y="' + y + '" text-anchor="' + anchor + '" opacity=".75" style="font-size:1rem;letter-spacing:.02em">' + t + '</text>';
  s += q(W - pr - 4, pt + 12, 'ELIMINATE / ENGINEER', 'end');
  s += q(pl + 4, pt + 12, 'WATCH', 'start');
  s += q(W - pr - 4, pt + ih - 6, 'AUTOMATE FIRST', 'end');
  s += q(pl + 4, pt + ih - 6, 'ACCEPT', 'start');
  points.forEach(p => {
    const r = 3 + 13 * Math.sqrt(p.annualH / maxR);
    s += '<circle cx="' + lx(p.n).toFixed(1) + '" cy="' + ly(p.p50).toFixed(1) + '" r="' + r.toFixed(1) + '" fill="' + p.color + '" opacity=".55" stroke="' + p.color + '" stroke-width="1"><title>' + esc(p.label) + '\n' + p.n + ' incidents · median ' + hrs(p.p50) + ' · ' + num(p.annualH) + ' h/yr</title></circle>';
  });
  s += '<text class="axtxt" x="' + (pl + iw / 2) + '" y="' + (H - 8) + '" text-anchor="middle">how often it happens →</text>';
  s += '<text class="axtxt" transform="translate(14,' + (pt + ih / 2) + ') rotate(-90)" text-anchor="middle">how long it takes →</text>';
  s += '</svg></div>';
  return s;
}

/* ---------- generic sortable table ---------- */
function table(id, cols, rows, opt) {
  opt = opt || {};
  const st = S.sort[id] || (opt.sort ? { key: opt.sort, dir: -1 } : null);
  let data = rows.slice();
  if (st) {
    const col = cols.find(c => c.k === st.key);
    if (col) {
      const val = col.sv || (r => r[st.key]);
      data.sort((a, b) => {
        const x = val(a), y = val(b);
        if (!col.n && (typeof x === 'string' || typeof y === 'string')) return String(x).localeCompare(String(y)) * st.dir;
        return ((isFinite(x) ? x : -Infinity) - (isFinite(y) ? y : -Infinity)) * st.dir;
      });
    }
  }
  const lim = S.limit[id] || opt.limit || 150;
  const shown = data.slice(0, lim);
  let h = '<div class="tw"><table data-table="' + id + '"><thead><tr>';
  cols.forEach(c => {
    const ar = st && st.key === c.k ? '<span class="ar">' + (st.dir === -1 ? '↓' : '↑') + '</span>' : '';
    h += '<th class="' + (c.n ? 'num' : '') + '" tabindex="0" role="columnheader" aria-sort="' + (st && st.key === c.k ? (st.dir === 1 ? 'ascending' : 'descending') : 'none') + '" data-k="' + c.k + '"' + (c.n ? ' data-num="1"' : '') + '>' + esc(c.label) + ' ' + ar + '</th>';
  });
  h += '</tr></thead><tbody>';
  if (!shown.length) h += '<tr><td colspan="' + cols.length + '" style="color:var(--dim);padding:18px">No rows match the current filters.</td></tr>';
  shown.forEach((r, i) => {
    h += '<tr' + (opt.rowAttr ? ' ' + opt.rowAttr(r, i) : '') + '>';
    cols.forEach(c => { h += '<td class="' + (c.cls || (c.n ? 'num' : '')) + '">' + (c.r ? c.r(r, i) : esc(r[c.k])) + '</td>'; });
    h += '</tr>';
    if (opt.sub && opt.sub(r)) h += '<tr class="sub-row"><td colspan="' + cols.length + '"><div class="sub-inner">' + opt.sub(r) + '</div></td></tr>';
  });
  h += '</tbody></table></div>';
  if (data.length > shown.length) h += '<div style="padding:9px 12px;border-top:1px solid var(--line)"><button class="btn sm" data-more="' + id + '">Show 150 more (' + num(data.length - shown.length) + ' hidden)</button></div>';
  return h;
}

const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

/* store-only zip so a team can grab every report in one click */
function makeZip(files) {
  const enc = new TextEncoder(); const parts = []; const central = []; let off = 0;
  files.forEach(f => {
    const nb = enc.encode(f.name);
    const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
    const crc = crc32(data);
    const lh = new Uint8Array(30 + nb.length); const dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, 0, true); dv.setUint16(10, 0, true); dv.setUint16(12, 0x2821, true);
    dv.setUint32(14, crc, true); dv.setUint32(18, data.length, true); dv.setUint32(22, data.length, true);
    dv.setUint16(26, nb.length, true); dv.setUint16(28, 0, true);
    lh.set(nb, 30);
    parts.push(lh, data);
    const cd = new Uint8Array(46 + nb.length); const cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true); cv.setUint16(12, 0, true); cv.setUint16(14, 0x2821, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true);
    cv.setUint16(28, nb.length, true); cv.setUint32(42, off, true);
    cd.set(nb, 46);
    central.push(cd);
    off += lh.length + data.length;
  });
  const cdSize = central.reduce((a, b) => a + b.length, 0);
  const end = new Uint8Array(22); const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, off, true);
  return new Blob(parts.concat(central, [end]), { type: 'application/zip' });
}

/* ---------- filtering ---------- */
function applyFilters() {
  const f = S.filters;
  const from = f.from ? parseDate(f.from) : null;
  const to = f.to ? new Date(parseDate(f.to).getTime() + 864e5 - 1) : null;
  const q = f.q.trim().toLowerCase();
  const G = new Set(f.group), P = new Set(f.priority.map(Number)), C = new Set(f.category), ST = new Set(f.state);
  return S.incidents.filter(x => {
    if (from && (!x.opened || x.opened < from)) return false;
    if (to && (!x.opened || x.opened > to)) return false;
    if (G.size && !G.has(x.group)) return false;
    if (P.size && !P.has(x.prio)) return false;
    if (C.size && !C.has(x.category)) return false;
    if (ST.size && !ST.has(x.state)) return false;
    if (f.flag === 'after' && !x.after) return false;
    if (f.flag === 'reopen' && !(x.reopen > 0)) return false;
    if (f.flag === 'breach' && x.breached !== true) return false;
    if (f.flag === 'open' && x.done) return false;
    if (f.flag === 'p12' && x.prio > 2) return false;
    if (q && !(x.short + ' ' + x.ci + ' ' + x.group + ' ' + x.id + ' ' + x.category + ' ' + x.closeCode).toLowerCase().includes(q)) return false;
    return true;
  });
}

function compute() {
  const list = applyFilters();
  const res = analyze(list);
  const factor = res.spanDays >= 25 ? 365 / res.spanDays : 1;
  const byCid = new Map();
  res.clusters.forEach(c => {
    byCid.set(c.cid, c);
    c.members.forEach(x => { x.touchH = c.touchH; x.bizH = c.bizH; x.fam = c.family; x.toil = c.toil; x.fit = c.fit; x.action = c.action; x.clabel = c.label; });
  });
  A = { list, clusters: res.clusters, byCid, spanDays: res.spanDays, factor, lastDate: res.lastDate };
  A.kpi = kpis();
  return A;
}

function kpis() {
  const L = A ? A.list : [];
  const list = L.length ? L : [];
  const mttrs = list.map(x => x.mttr).filter(v => v != null);
  const touch = sum(list.map(x => x.touchH || 0));
  const autoH = sum(list.map(x => (x.touchH || 0) * (x.fam ? x.fam.auto : 0.35) * S.cfg.autoEff));
  const biz = sum(list.map(x => x.bizH || 0));
  const bizAutoH = sum(list.map(x => (x.bizH || 0) * (x.fam ? x.fam.auto : 0.35) * S.cfg.autoEff));
  const waits = list.map(x => x.waitH).filter(v => v != null);
  const toilInc = list.filter(x => (x.toil || 0) >= 55).length;
  return {
    n: list.length,
    resolved: list.filter(x => x.done).length,
    p50: median(mttrs), p90: quant(mttrs, 0.9),
    touchYr: touch * A.factor,
    autoYr: autoH * A.factor,
    savings: autoH * A.factor * S.cfg.rate,
    bizYr: biz * A.factor,
    bizAutoYr: bizAutoH * A.factor,
    bizSavings: bizAutoH * A.factor * S.cfg.bizRate,
    waitP50: median(waits), waitP90: quant(waits, 0.9),
    toilShare: list.length ? toilInc / list.length : 0,
    after: list.length ? list.filter(x => x.after).length / list.length : 0,
    reopen: list.length ? list.filter(x => x.reopen > 0).length / list.length : 0,
    breach: (() => { const k = list.filter(x => x.breached != null); return k.length ? k.filter(x => x.breached).length / k.length : null; })(),
    repeat: (() => { const big = A.clusters.filter(c => c.n >= 4); return list.length ? sum(big.map(c => c.n)) / list.length : 0; })(),
    sigs: A.clusters.length
  };
}

/* ---------- aggregation helper ---------- */
function aggBy(list, keyFn) {
  const m = new Map();
  list.forEach(x => {
    const k = keyFn(x) || '(none)';
    let o = m.get(k);
    if (!o) { o = { k, n: 0, mttrs: [], touch: 0, auto: 0, biz: 0, bizAuto: 0, after: 0, reopen: 0, breachN: 0, breachD: 0, reassign: 0, p12: 0, fams: new Map(), sigs: new Set() }; m.set(k, o); }
    o.n++;
    if (x.mttr != null) o.mttrs.push(x.mttr);
    o.touch += x.touchH || 0;
    o.auto += (x.touchH || 0) * (x.fam ? x.fam.auto : .35) * S.cfg.autoEff;
    o.biz += x.bizH || 0;
    o.bizAuto += (x.bizH || 0) * (x.fam ? x.fam.auto : .35) * S.cfg.autoEff;
    if (x.after) o.after++;
    if (x.reopen > 0) o.reopen++;
    if (x.breached != null) { o.breachD++; if (x.breached) o.breachN++; }
    o.reassign += x.reassign || 0;
    if (x.prio <= 2) o.p12++;
    if (x.fam) bump(o.fams, x.fam.label);
    o.sigs.add(x.cid);
  });
  const out = Array.from(m.values());
  out.forEach(o => {
    o.p50 = median(o.mttrs); o.p90 = quant(o.mttrs, 0.9);
    o.touchYr = o.touch * A.factor; o.autoYr = o.auto * A.factor;
    o.bizYr = o.biz * A.factor; o.bizAutoYr = o.bizAuto * A.factor;
    o.afterPct = o.after / o.n; o.reopenPct = o.reopen / o.n;
    o.breachPct = o.breachD ? o.breachN / o.breachD : null;
    o.reassignAvg = o.reassign / o.n;
    o.topFam = topN(o.fams, 1)[0] ? topN(o.fams, 1)[0][0] : '—';
    o.sigN = o.sigs.size;
    o.repeatRatio = o.n / Math.max(1, o.sigN);
  });
  return out;
}

      '<dt>Effort estimate</dt><dd>' + r.tier + ' · ~' + r.buildH + ' h build · payback ' + (isFinite(r.payback) ? dec(r.payback, 1) + ' months' : '—') + ' on technical hours' + (isFinite(r.paybackAll) ? ', ' + dec(r.paybackAll, 1) + ' with business value' : '') + '</dd>' +
      '</dl>' +
      '<div class="split" style="margin-top:12px">' +
      '<button class="btn sm" data-brief="' + r.cid + '">Download automation brief</button>' +

      '</div>' +

      '</div>';
  };

    '<p class="lede">Descriptions are normalised — hostnames, IDs, numbers and timestamps are masked — so tickets that describe the same work land in the same row even when the wording differs. Expand a row to see the signature, the sample tickets and a downloadable brief.</p>' +
    '<div class="warn" style="margin-bottom:12px"><b>Toil score</b> rises with repetition, persistence across months, short and predictable handling time, and low reassignment. <b>Auto fit</b> is how mechanical the work is. High on both means build it this quarter.</div>' +
    cardFlush('All signatures', num(rows.length) + ' groups', table('cl', cols, rows, { sort: 'annualH', sub: sub }), dlBtn('clusters') + dlBtn('briefs', 'Download all briefs (.zip)'));
}

    { k: 'totalSaving', label: 'Value/yr', n: true, r: r => '<span title="' + money(r.saving) + ' technical + ' + money(r.bizSaving) + ' business">' + money(r.saving + r.bizSaving) + '</span>', sv: r => r.saving + r.bizSaving },

/* ============================================================
   VIEW: problems & noise
   ============================================================ */
function vProblem() {
  const prob = A.clusters.filter(c => c.n >= 2 && (c.action.indexOf('Problem') === 0 || c.action === 'Engineering fix' || (c.p1p2 > 0.3 && c.annualH > 20)))
    .sort((a, b) => b.annualH - a.annualH);
  const noise = A.clusters.filter(c => c.family.id === 'noise' || (isFinite(c.p50) && c.p50 < 0.25 && c.n >= 5)).sort((a, b) => b.n - a.n);
  const churn = A.clusters.filter(c => c.reassignAvg >= 1.5 && c.n >= 3).sort((a, b) => b.reassignAvg * b.n - a.reassignAvg * a.n);
  const reop = A.clusters.filter(c => c.reopenRate > 0.1 && c.n >= 3).sort((a, b) => b.reopenRate * b.n - a.reopenRate * a.n);

  const base = [
    { k: 'label', label: 'Signature', cls: 'wrap', r: r => esc(r.label) },
    { k: 'n', label: 'Count', n: true, r: r => num(r.n) },
    { k: 'p50', label: 'Median', n: true, r: r => hrs(r.p50) },
    { k: 'annualH', label: 'Tech h/yr', n: true, r: r => num(r.annualH) },
    { k: 'annualBizH', label: 'Biz h/yr', n: true, r: r => '<span style="color:var(--biz)">' + num(r.annualBizH) + '</span>' }
  ];
  const probCols = base.concat([
    { k: 'p1p2', label: 'P1/P2', n: true, r: r => pct(r.p1p2) },
    { k: 'reopenRate', label: 'Reopened', n: true, r: r => pct(r.reopenRate) },
    { k: 'owner', label: 'Owner', r: r => esc(topN(r.groups, 1)[0][0]), sv: r => topN(r.groups, 1)[0][0] }
  ]);
  const noiseCols = base.concat([
    { k: 'ci', label: 'Top system', r: r => esc(topN(r.cis, 1)[0][0]), sv: r => topN(r.cis, 1)[0][0] },
    { k: 'afterPct', label: 'Off-hrs', n: true, r: r => pct(r.afterPct) }
  ]);
  const churnCols = base.concat([
    { k: 'reassignAvg', label: 'Hops', n: true, r: r => dec(r.reassignAvg, 1) },
    { k: 'teams', label: 'Teams touched', n: true, r: r => r.groups.size, sv: r => r.groups.size }
  ]);
  const reopCols = base.concat([
    { k: 'reopenRate', label: 'Reopened', n: true, r: r => pct(r.reopenRate) },
    { k: 'owner', label: 'Owner', r: r => esc(topN(r.groups, 1)[0][0]), sv: r => topN(r.groups, 1)[0][0] }
  ]);

  const noiseInc = sum(noise.map(c => c.n));
  const offNoise = sum(noise.map(c => c.n * c.afterPct));

  return '<h2>Problems, noise and churn</h2>' +
    '<p class="lede">Not everything repetitive should be automated. Some of it should stop happening. These four lists separate work that needs a permanent fix from work that is just interruption, and from tickets that bounce between teams before anyone starts.</p>' +
    '<div class="grid g3" style="margin-bottom:12px">' +
    kpi('Problem candidates', num(prob.length), 'recurring, severe or reopening — needs root cause', 'var(--prob)') +
    kpi('Likely alert noise', num(noiseInc) + ' <small>tickets</small>', num(offNoise) + ' of them raised outside hours', 'var(--bad)') +
    kpi('Signatures that bounce', num(churn.length), 'routing or ownership is wrong', 'var(--toil)') +
    '</div>' +
    cardFlush('Problem records to raise', 'high impact, repeating — automating around these hides the cause', table('pr', probCols, prob, { sort: 'annualH' }), dlBtn('problem')) +
    '<div style="height:12px"></div>' +
    cardFlush('Alert noise to tune out', 'closed almost immediately or explicitly no-action', table('nz', noiseCols, noise, { sort: 'n' }), dlBtn('noise')) +
    '<div style="height:12px"></div>' +
    '<div class="grid g2">' +
    cardFlush('Routing churn', 'average hops before resolution', table('ch', churnCols, churn, { sort: 'reassignAvg', limit: 25 }), dlBtn('churn')) +
    cardFlush('Fixes that did not hold', 'reopen rate above 10%', table('ro', reopCols, reop, { sort: 'reopenRate', limit: 25 }), dlBtn('reopen')) +
    '</div>';
}

/* ============================================================
   VIEW: trends
   ============================================================ */
function vTrends() {
  const months = uniq(A.list.map(x => x.month).filter(Boolean)).sort();
  const byM = m => A.list.filter(x => x.month === m);
  const vol = months.map(m => byM(m).length);
  const mtt = months.map(m => { const v = byM(m).map(x => x.mttr).filter(x => x != null); return v.length ? median(v) : 0; });
  const aft = months.map(m => { const l = byM(m); return l.length ? l.filter(x => x.after).length / l.length * 100 : 0; });
  const p12 = months.map(m => byM(m).filter(x => x.prio <= 2).length);

  const heat = Array.from({ length: 7 }, () => new Array(24).fill(0));
  A.list.forEach(x => { if (x.dow != null && x.hour != null) heat[x.dow][x.hour]++; });

  // month over month movers by signature
  const movers = [];
  if (months.length >= 2) {
    const last = months[months.length - 1], prev = months[months.length - 2];
    A.clusters.forEach(c => {
      const a = c.months.get(last) || 0, b = c.months.get(prev) || 0;
      if (a + b >= 4) movers.push({ label: c.label, prev: b, last: a, delta: a - b, cid: c.cid, fam: c.family.label });
    });
    movers.sort((x, y) => Math.abs(y.delta) - Math.abs(x.delta));
  }
  const moverCols = [
    { k: 'label', label: 'Signature', cls: 'wrap', r: r => esc(r.label) },
    { k: 'fam', label: 'Type', r: r => '<span class="pill">' + esc(r.fam) + '</span>' },
    { k: 'prev', label: months[months.length - 2] || 'prev', n: true },
    { k: 'last', label: months[months.length - 1] || 'last', n: true },
    { k: 'delta', label: 'Change', n: true, r: r => '<span style="color:' + (r.delta > 0 ? 'var(--bad)' : 'var(--good)') + '">' + (r.delta > 0 ? '+' : '') + r.delta + '</span>' }
  ];

  const offCount = A.list.filter(x => x.after).length;
  const weekend = A.list.filter(x => x.dow === 0 || x.dow === 6).length;

  return '<h2>Trends</h2>' +
    '<p class="lede">Volume tells you whether the work is growing. The clock heatmap tells you what it costs people to be on call for it.</p>' +
    '<div class="grid g4" style="margin-bottom:12px">' +
    kpi('Months covered', months.length, (months[0] || '—') + ' → ' + (months[months.length - 1] || '—')) +
    kpi('Outside working hours', num(offCount), pct(offCount / Math.max(1, A.list.length)) + ' of all tickets', 'var(--toil)') +
    kpi('Weekend tickets', num(weekend), pct(weekend / Math.max(1, A.list.length)) + ' of all tickets') +
    kpi('Busiest hour', (() => { let bh = 0, bv = -1; for (let h = 0; h < 24; h++) { const v = sum(heat.map(r => r[h])); if (v > bv) { bv = v; bh = h; } } return bh + ':00'; })(), 'peak arrival time') +
    '</div>' +
    card('When incidents arrive', 'amber = outside your working hours', svgHeat(heat) +
      '<p class="hint">Working hours are ' + S.cfg.bhStart + ':00–' + S.cfg.bhEnd + ':00, Monday to Friday. Change them in Setup.</p>') +
    '<div style="height:12px"></div>' +
    '<div class="grid g2">' +
    card('Volume and severity by month', '', svgLine(months, [
      { name: 'All incidents', values: vol, color: 'var(--info)', area: true },
      { name: 'P1 + P2', values: p12, color: 'var(--bad)' }
    ], { h: 200 })) +
    card('Median resolve time and off-hours share', 'hours / percent', svgLine(months, [
      { name: 'Median hours', values: mtt, color: 'var(--toil)' },
      { name: 'Off-hours %', values: aft, color: 'var(--prob)' }
    ], { h: 200 })) +
    '</div>' +
    '<div style="height:12px"></div>' +
    cardFlush('What changed last month', 'signatures with the biggest swing', table('mv', moverCols, movers, { sort: 'delta', limit: 20 }), dlBtn('months', 'Download monthly CSV'));
}

/* ============================================================

function vSetup() {
  const opts = sel => '<option value="">— not mapped —</option>' + S.headers.map(h => '<option value="' + esc(h) + '"' + (sel === h ? ' selected' : '') + '>' + esc(h) + '</option>').join('');
  const mapping = FIELDS.map(f =>
    '<label class="fld">' + esc(f.label) + '<select data-map="' + f.k + '">' + opts(S.map[f.k]) + '</select></label>').join('');

  const numFld = (k, label, val, min, max, step, note) =>
    '<label class="fld">' + esc(label) + '<input type="number" data-cfg="' + k + '" value="' + val + '" min="' + min + '" max="' + max + '" step="' + step + '">' + (note ? '<span style="color:var(--dim);font-size:.75rem">' + esc(note) + '</span>' : '') + '</label>';

  const famIn = (f, k, min, max, step) => '<input type="number" data-fam="' + f.id + '" data-famk="' + k + '" value="' + f[k] + '" min="' + min + '" max="' + max + '" step="' + step + '" aria-label="' + esc(f.label + (k === 'wait' ? ' business wait share' : ' manual effort hours')) + '" style="width:86px;min-height:34px;padding:4px 8px">';
  const famRows = FAMILIES.concat([FAM_OTHER]).map(f =>
    '<tr><td><span class="pill">' + esc(f.label) + '</span></td><td class="num">' + Math.round(f.auto * 100) + '%</td><td>' + f.tier + ' · ' + S.cfg.build[f.tier] + 'h</td><td class="num">' + famIn(f, 'wait', 0, 1, 0.05) + '</td><td class="num">' + famIn(f, 'manual', 0, 40, 0.25) + '</td><td class="wrap" style="color:var(--muted)">' + esc(f.fix) + '</td></tr>').join('');

  return '<h2>Setup</h2>' +

      numFld('capTouch', 'Maximum touch time (hours)', S.cfg.capTouch, 1, 24, 1, 'caps long-running tickets') +
      numFld('autoEff', 'Share of work automation actually removes', S.cfg.autoEff, 0.2, 1, 0.05, 'exceptions still need people') +
      numFld('bizRate', 'Loaded cost per business user hour', S.cfg.bizRate, 10, 500, 5, 'what an hour of business time is worth') +
      numFld('bizUsers', 'Business users waiting per incident', S.cfg.bizUsers, 1, 1000, 1, 'ignored when an Affected users column is mapped') +
      numFld('capWait', 'Maximum business wait per incident (hours)', S.cfg.capWait, 1, 80, 1, 'caps tickets that sit open for days') +
      numFld('sim', 'Signature merge sensitivity', S.cfg.sim, 0.3, 0.95, 0.02, 'lower merges more aggressively') +
      '</div><div class="split" style="margin-top:12px"><button class="btn primary" id="applyCfg">Apply and recalculate</button></div>') +
    card('Working hours', 'defines off-hours interruptions and the window business wait is counted in',

    cardFlush('Work types and what ToilLens assumes about them', 'automatability drives the ranking; wait share and manual effort drive business hours',
