}
/* ============================================================
   Export builders
   ============================================================ */
const CLUSTER_COLS = ['Signature', 'Normalised signature', 'Work type', 'Incidents', 'Est. per year', 'Months active',
  'First seen', 'Last seen', 'Median hours', 'P90 hours', 'Technical hours each', 'Technical hours per year',
  'Technical hours saved per year', 'Technical value per year',
  'Business wait hours each', 'Business manual hours each', 'Business users per incident', 'Business hours per year',
  'Business hours saved per year', 'Business value per year', 'Total value per year',
  'Toil score', 'Automation fit', 'Effort tier', 'Build hours',
  'Payback months', 'Payback months incl. business value', 'Avg reassignments', 'Reopen rate', 'Off-hours share', 'P1/P2 share', 'Teams', 'Systems',
  'Close codes', 'Recommended action', 'Recommended fix'];

const clusterRow = c => [c.label, c.sig, c.family.label, c.n, Math.round(c.annualN), c.monthsActive,
  c.first ? ymd(c.first) : '', c.last ? ymd(c.last) : '', isFinite(c.p50) ? c.p50.toFixed(2) : '', isFinite(c.p90) ? c.p90.toFixed(2) : '',
  c.touchH.toFixed(2), Math.round(c.annualH), Math.round(c.recoverH), Math.round(c.saving),
  c.bizWaitH.toFixed(2), c.bizManualH.toFixed(2), c.users, Math.round(c.annualBizH), Math.round(c.recoverBizH), Math.round(c.bizSaving), Math.round(c.saving + c.bizSaving),
  c.toil, c.fit, c.tier, c.buildH,
  isFinite(c.payback) ? c.payback.toFixed(1) : '', isFinite(c.paybackAll) ? c.paybackAll.toFixed(1) : '', c.reassignAvg.toFixed(2), (c.reopenRate * 100).toFixed(1) + '%',
  (c.afterPct * 100).toFixed(1) + '%', (c.p1p2 * 100).toFixed(1) + '%', topStr(c.groups, 4), topStr(c.cis, 4),
  topStr(c.closeCodes, 3), c.action, c.family.fix];

const AGG_COLS = ['Name', 'Incidents', 'Distinct signatures', 'Repeat ratio', 'Median hours', 'P90 hours',
  'Technical hours per year', 'Technical hours saved per year', 'Business hours per year', 'Business hours saved per year',
  'Off-hours share', 'Reopen rate', 'SLA breach rate', 'Avg reassignments', 'Mostly'];
const aggRow = o => [o.k, o.n, o.sigN, o.repeatRatio.toFixed(1), isFinite(o.p50) ? o.p50.toFixed(2) : '', isFinite(o.p90) ? o.p90.toFixed(2) : '',
  Math.round(o.touchYr), Math.round(o.autoYr), Math.round(o.bizYr), Math.round(o.bizAutoYr), (o.afterPct * 100).toFixed(1) + '%', (o.reopenPct * 100).toFixed(1) + '%',
  o.breachPct == null ? '' : (o.breachPct * 100).toFixed(1) + '%', o.reassignAvg.toFixed(2), o.topFam];

function incidentTable() {
  const extra = ['Signature group', 'Normalised signature', 'Work type', 'Toil score', 'Automation fit',
    'Recommended action', 'Technical hours', 'Business hours', 'Business wait hours', 'Resolve hours', 'Off hours', 'Month', 'Weekday', 'Hour'];
  const headers = S.headers.concat(extra);
  const rows = A.list.map(x => x.raw.slice(0, S.headers.length).concat([
    x.clabel || '', x.nt || '', x.fam ? x.fam.label : '', x.toil || 0, x.fit || 0, x.action || '',
    (x.touchH || 0).toFixed(2), (x.bizH || 0).toFixed(2), x.waitH == null ? '' : x.waitH.toFixed(2), x.mttr == null ? '' : x.mttr.toFixed(2), x.after ? 'yes' : 'no',
    x.month, x.dow == null ? '' : DAYNAMES[x.dow], x.hour == null ? '' : x.hour
  ]));
  return { headers, rows };
}

function monthTable() {
  const months = uniq(A.list.map(x => x.month).filter(Boolean)).sort();
  const rows = months.map(m => {
    const l = A.list.filter(x => x.month === m);
    const v = l.map(x => x.mttr).filter(x => x != null);
    return [m, l.length, l.filter(x => x.done).length, isFinite(median(v)) ? median(v).toFixed(2) : '',
      isFinite(quant(v, 0.9)) ? quant(v, 0.9).toFixed(2) : '',
      (l.filter(x => x.after).length / l.length * 100).toFixed(1) + '%',
      (l.filter(x => x.reopen > 0).length / l.length * 100).toFixed(1) + '%',
      l.filter(x => x.prio <= 2).length, Math.round(sum(l.map(x => x.touchH || 0))), Math.round(sum(l.map(x => x.bizH || 0))), uniq(l.map(x => x.cid)).length];
  });
  return { headers: ['Month', 'Incidents', 'Resolved', 'Median hours', 'P90 hours', 'Off-hours share', 'Reopen rate', 'P1+P2', 'Technical hours', 'Business hours', 'Distinct signatures'], rows };
}

function briefMD(c) {
  const L = [];
  L.push('# Automation brief — ' + c.label);
  L.push('');
  L.push('_Generated by ToilLens on ' + stamp() + ' from ' + c.n + ' matching incidents._');
  L.push('');
  L.push('## Signature');
  L.push('```');
  L.push(c.sig);
  L.push('```');
  L.push('Placeholders such as `<host>`, `<n>` and `<date>` are the parts that vary between tickets. Everything else is constant, which is what makes this automatable.');
  L.push('');
  L.push('## Why it is on the list');
  L.push('');
  L.push('| Measure | Value |');
  L.push('| --- | --- |');
  L.push('| Occurrences in scope | ' + c.n + ' (about ' + Math.round(c.annualN) + ' a year) |');
  L.push('| Active in | ' + c.monthsActive + ' distinct months |');
  L.push('| Median resolve time | ' + hrs(c.p50) + ' (p90 ' + hrs(c.p90) + ') |');
  L.push('| Technical time each (ops team hands-on) | ' + hrs(c.touchH) + ' |');
  L.push('| Technical hours a year | ' + Math.round(c.annualH) + ' |');
  L.push('| Technical hours saved if automated | ' + Math.round(c.recoverH) + ' h/yr (' + money(c.saving) + ') |');
  L.push('| Business impact each | ' + hrs(c.bizWaitH) + ' waiting' + (c.users > 1 ? ' across ' + dec(c.users, 0) + ' users' : '') + ' + ' + hrs(c.bizManualH) + ' manual effort |');
  L.push('| Business hours a year | ' + Math.round(c.annualBizH) + ' |');
  L.push('| Business hours saved if automated | ' + Math.round(c.recoverBizH) + ' h/yr (' + money(c.bizSaving) + ') |');
  L.push('| Total value a year | ' + money(c.saving + c.bizSaving) + ' |');
  L.push('| Toil score / automation fit | ' + c.toil + ' / ' + c.fit + ' |');
  L.push('| Raised outside working hours | ' + pct(c.afterPct) + ' |');
  L.push('| Reopened | ' + pct(c.reopenRate) + ' · average ' + dec(c.reassignAvg, 1) + ' reassignments |');
  L.push('| Build estimate | ' + c.tier + ', roughly ' + c.buildH + ' hours |');
  L.push('| Payback | ' + (isFinite(c.payback) ? dec(c.payback, 1) + ' months on technical hours' : 'n/a') + (isFinite(c.paybackAll) ? ' · ' + dec(c.paybackAll, 1) + ' months including business value' : '') + ' |');
  L.push('');
  L.push('## Who and what is involved');
  L.push('');
  L.push('- **Teams:** ' + (topStr(c.groups, 5) || 'not recorded'));
  L.push('- **Systems:** ' + (topStr(c.cis, 6) || 'not recorded'));
  L.push('- **Close codes:** ' + (topStr(c.closeCodes, 4) || 'not recorded'));
  L.push('- **Priority mix:** ' + topN(c.prios, 5).map(p => (PRIO_LABEL[p[0]] || p[0]) + ': ' + p[1]).join(', '));
  L.push('');
  L.push('## Recommended approach');
  L.push('');
  L.push(c.family.fix);
  L.push('');
  L.push('## Suggested acceptance criteria');
  L.push('');
  L.push('- Detection fires from the same signal that raises the ticket today, not from the ticket itself.');
  L.push('- The action is idempotent and safe to run twice.');
  L.push('- A guard rail stops it after ' + (c.n >= 20 ? '3' : '2') + ' attempts in a rolling window and escalates to a human.');
  L.push('- Every run writes back to the incident record so the audit trail survives.');
  L.push('- Success measured as a drop in this signature below ' + Math.max(1, Math.round(c.n * 0.2)) + ' occurrences per equivalent period.');
  if (c.family.id === 'app') L.push('- Note: this looks like a product defect. Automating the workaround will hide it — raise it with engineering as well.');
  L.push('');
  L.push('## Sample incidents');
  L.push('');
  L.push('| Number | Opened | Resolve | Team | Description |');
  L.push('| --- | --- | --- | --- | --- |');
  c.members.slice(0, 12).forEach(x => {
    L.push('| ' + x.id + ' | ' + (x.opened ? ymd(x.opened) : '') + ' | ' + hrs(x.mttr) + ' | ' + x.group + ' | ' + String(x.short).replace(/\|/g, '/').slice(0, 90) + ' |');
  });
  L.push('');
  return L.join('\n');
}

function summaryMD() {
  const k = A.kpi;
  const back = A.clusters.filter(c => c.n >= 3 && c.recoverH > 1 && c.fit >= 40 && c.family.id !== 'app').sort((a, b) => b.recoverH - a.recoverH);
  const L = [];
  L.push('# Incident and toil review — ' + stamp());
  L.push('');
  L.push('Scope: **' + num(k.n) + ' incidents** across ' + Math.round(A.spanDays) + ' days, collapsing into **' + num(k.sigs) + ' distinct signatures**.');
  L.push('');
  L.push('## Headline');
  L.push('');
  L.push('- **' + pct(k.repeat) + '** of tickets are repeat work — a signature seen four or more times.');
  L.push('- Technical effort (ops team hands-on) runs at about **' + num(k.touchYr) + ' hours a year** (' + dec(k.touchYr / 1600, 1) + ' full-time engineers).');
  L.push('- The business spends about **' + num(k.bizYr) + ' hours a year** waiting on these incidents or working around them (median wait ' + hrs(k.waitP50) + ' of working time per ticket).');
  L.push('- Automation would return roughly **' + num(k.autoYr) + ' technical hours** (' + money(k.savings) + ') and **' + num(k.bizAutoYr) + ' business hours** (' + money(k.bizSavings) + ') a year — **' + money(k.savings + k.bizSavings) + '** in total.');
  L.push('- **' + pct(k.after) + '** of incidents arrive outside working hours.');
  L.push('- Median time to resolve is **' + hrs(k.p50) + '**, p90 **' + hrs(k.p90) + '**.');
  if (k.reopen > 0.05) L.push('- **' + pct(k.reopen) + '** of tickets were reopened — fixes are not holding.');
  L.push('');
  L.push('## Top ten things to build');
  L.push('');
  L.push('| # | Candidate | Type | Runs/yr | Tech hours back | Biz hours back | Value | Build | Payback |');
  L.push('| --- | --- | --- | --- | --- | --- | --- | --- | --- |');
  back.slice(0, 10).forEach((c, i) => {
    L.push('| ' + (i + 1) + ' | ' + String(c.label).replace(/\|/g, '/').slice(0, 70) + ' | ' + c.family.label + ' | ' + Math.round(c.annualN) +
      ' | ' + Math.round(c.recoverH) + ' h | ' + Math.round(c.recoverBizH) + ' h | ' + money(c.saving + c.bizSaving) + ' | ' + c.tier + ' (' + c.buildH + 'h) | ' +
      (isFinite(c.payback) ? dec(c.payback, 1) + ' mo' : '—') + ' |');
  });
  L.push('');
  const prob = A.clusters.filter(c => c.action.indexOf('Problem') === 0 || c.action === 'Engineering fix').sort((a, b) => b.annualH - a.annualH).slice(0, 5);
  if (prob.length) {
    L.push('## Raise as problem records instead of automating');
    L.push('');
    prob.forEach(c => L.push('- **' + String(c.label).slice(0, 80) + '** — ' + c.n + ' incidents, median ' + hrs(c.p50) + ', ' + pct(c.reopenRate) + ' reopened. ' + c.family.fix));
    L.push('');
  }
  const g = aggBy(A.list, x => x.group).sort((a, b) => b.touchYr - a.touchYr).slice(0, 5);
  L.push('## Where the load sits');
  L.push('');
  L.push('| Team | Tickets | Repeat | Tech hours/yr | Biz hours/yr | Tech saved | Biz saved | Off-hours |');
  L.push('| --- | --- | --- | --- | --- | --- | --- | --- |');
  g.forEach(o => L.push('| ' + o.k + ' | ' + o.n + ' | ' + dec(o.repeatRatio, 1) + '× | ' + Math.round(o.touchYr) + ' | ' + Math.round(o.bizYr) + ' | ' + Math.round(o.autoYr) + ' | ' + Math.round(o.bizAutoYr) + ' | ' + pct(o.afterPct) + ' |'));
  L.push('');
  L.push('---');
  L.push('');
  L.push('Assumptions: hands-on time is ' + Math.round(S.cfg.handsOn * 100) + '% of ticket duration (floor ' + S.cfg.minTouch + ' min, cap ' + S.cfg.capTouch + ' h); engineer cost ' + money(S.cfg.rate) + '/hour; automation removes ' + Math.round(S.cfg.autoEff * 100) + '% of the work it covers. Business hours are the working-day time (' + S.cfg.bhStart + ':00–' + S.cfg.bhEnd + ':00, Mon–Fri) a ticket sits open, weighted by how much the business is blocked for that type of work, capped at ' + S.cfg.capWait + ' h and multiplied by ' + S.cfg.bizUsers + ' waiting user' + (S.cfg.bizUsers === 1 ? '' : 's') + ' unless an Affected users column is mapped, plus a per-type allowance for manual effort; business time costed at ' + money(S.cfg.bizRate) + '/hour. Change these in Setup and regenerate.');
  return L.join('\n');
}

function buildExport(key) {
  const C = A.clusters;
  const pick = list => ({ headers: CLUSTER_COLS, rows: list.map(clusterRow) });
  switch (key) {
    case 'clusters': return { name: 'toil-signatures', t: pick(C) };
    case 'backlog': return { name: 'automation-backlog', t: pick(C.filter(c => c.n >= 3 && c.recoverH > 1 && c.fit >= 40 && c.family.id !== 'app').sort((a, b) => b.recoverH - a.recoverH)) };
    case 'problem': return { name: 'problem-candidates', t: pick(C.filter(c => c.n >= 2 && (c.action.indexOf('Problem') === 0 || c.action === 'Engineering fix' || (c.p1p2 > 0.3 && c.annualH > 20))).sort((a, b) => b.annualH - a.annualH)) };
    case 'noise': return { name: 'alert-noise', t: pick(C.filter(c => c.family.id === 'noise' || (isFinite(c.p50) && c.p50 < 0.25 && c.n >= 5)).sort((a, b) => b.n - a.n)) };
    case 'churn': return { name: 'routing-churn', t: pick(C.filter(c => c.reassignAvg >= 1.5 && c.n >= 3).sort((a, b) => b.reassignAvg - a.reassignAvg)) };
    case 'reopen': return { name: 'reopened-work', t: pick(C.filter(c => c.reopenRate > 0.1 && c.n >= 3).sort((a, b) => b.reopenRate - a.reopenRate)) };
    case 'incidents': return { name: 'incidents-enriched', t: incidentTable() };
    case 'months': return { name: 'by-month', t: monthTable() };
    case 'groups': return { name: 'by-team', t: { headers: AGG_COLS, rows: aggBy(A.list, x => x.group).sort((a, b) => b.touchYr - a.touchYr).map(aggRow) } };
    case 'cis': return { name: 'by-system', t: { headers: AGG_COLS, rows: aggBy(A.list, x => x.ci).sort((a, b) => b.touchYr - a.touchYr).map(aggRow) } };
    case 'categories': return { name: 'by-category', t: { headers: AGG_COLS, rows: aggBy(A.list, x => x.category).sort((a, b) => b.n - a.n).map(aggRow) } };
    case 'afterhours': {
      const saved = A.list; A.list = saved.filter(x => x.after);
      const t = incidentTable(); A.list = saved;
      return { name: 'off-hours-incidents', t };
    }
    case 'jira': {
      const rows = A.clusters.filter(c => c.n >= 3 && c.recoverH > 1 && c.fit >= 40 && c.family.id !== 'app').sort((a, b) => b.recoverH - a.recoverH).map((c, i) => [
        'Automate: ' + String(c.label).slice(0, 90),
        'Story',
        'Recurring work seen ' + c.n + ' times in scope (about ' + Math.round(c.annualN) + ' a year), median resolve ' + hrs(c.p50) + '. ' +
        'Business impact about ' + hrs(c.bizH) + ' per occurrence (' + hrs(c.bizWaitH) + ' waiting, ' + hrs(c.bizManualH) + ' manual effort). ' +
        c.family.fix + ' Signature: ' + c.sig,
        c.buildH, Math.round(c.recoverH), Math.round(c.recoverBizH), Math.round(c.saving + c.bizSaving),
        isFinite(c.payback) ? c.payback.toFixed(1) : '', top1(c.groups), top1(c.cis),
        'toil-reduction,' + c.family.id, c.p1p2 > 0.3 ? 'High' : i < 10 ? 'Medium' : 'Low'
      ]);
      return { name: 'automation-work-items', t: { headers: ['Summary', 'Issue Type', 'Description', 'Estimate (hours)', 'Technical hours saved (hours/yr)', 'Business hours saved (hours/yr)', 'Value ($/yr)', 'Payback (months)', 'Component', 'System', 'Labels', 'Priority'], rows } };
    }
  }
  return null;
}

function doDownload(key) {
  if (!A) return toast('Load a CSV first');
  if (key === 'summary') return download('toillens-summary-' + stamp() + '.md', summaryMD(), 'text/markdown');
  if (key === 'briefs') {
    const list = A.clusters.filter(c => c.n >= 3).sort((a, b) => b.recoverH - a.recoverH).slice(0, 30);
    if (!list.length) return toast('No signatures large enough for a brief');
    const files = list.map((c, i) => ({ name: 'briefs/' + String(i + 1).padStart(2, '0') + '-' + c.family.id + '-' + c.label.toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 46).replace(/-$/, '') + '.md', data: briefMD(c) }));
    files.push({ name: 'briefs/00-summary.md', data: summaryMD() });
    return download('toillens-briefs-' + stamp() + '.zip', makeZip(files));
  }
  if (key === 'all') {
    const keys = ['clusters', 'backlog', 'jira', 'problem', 'noise', 'churn', 'reopen', 'incidents', 'months', 'groups', 'cis', 'categories', 'afterhours'];
    const files = keys.map(k => { const e = buildExport(k); return { name: e.name + '.csv', data: '\uFEFF' + toCSV(e.t.headers, e.t.rows) }; });
    files.push({ name: 'summary.md', data: summaryMD() });
    A.clusters.filter(c => c.n >= 3).sort((a, b) => b.recoverH - a.recoverH).slice(0, 20)
      .forEach((c, i) => files.push({ name: 'briefs/' + String(i + 1).padStart(2, '0') + '-' + c.label.toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 46).replace(/-$/, '') + '.md', data: briefMD(c) }));
    return download('toillens-' + stamp() + '.zip', makeZip(files));
  }
  const e = buildExport(key);
  if (!e) return;
  download('toillens-' + e.name + '-' + stamp() + '.csv', toCSV(e.t.headers, e.t.rows));
}

function msBlock(key, label, items) {
  const sel = S.filters[key];
  return '<div class="ms" data-ms="' + key + '"><button type="button" aria-expanded="false" aria-controls="ms-' + key + '"><span>' + esc(label) + '</span>' +
    '<span class="n" data-n>' + (sel.length ? sel.length : 'all') + '</span><span class="cv">' + icon('down') + '</span></button>' +
    '<div class="ms-menu" id="ms-' + key + '"><input type="search" aria-label="Filter ' + esc(label.toLowerCase()) + '" placeholder="Filter ' + esc(label.toLowerCase()) + '…" data-mssearch>' +
    '<div class="ms-list">' + items.map(it =>
      '<label><input type="checkbox" value="' + esc(it.v) + '"' + (sel.indexOf(it.v) >= 0 ? ' checked' : '') + '><span>' + esc(it.l) + '</span><span class="ct">' + it.n + '</span></label>').join('') +
    '</div><div class="row"><button class="btn sm" data-msall>Select all</button><button class="btn sm" data-msnone>Clear</button></div></div></div>';
}

function renderTopbar() {
  if (!S.incidents.length) { $('#topbar').innerHTML = ''; return; }
  const cnt = f => { const m = new Map(); S.incidents.forEach(x => bump(m, f(x))); return Array.from(m.entries()).sort((a, b) => b[1] - a[1]); };
  const dates = S.incidents.map(x => x.opened).filter(Boolean).sort((a, b) => a - b);
  const min = dates.length ? ymd(dates[0]) : '', max = dates.length ? ymd(dates[dates.length - 1]) : '';
  $('#topbar').innerHTML =
    '<div class="filter-primary"><div class="filter-search">' + icon('explorer') + '<input type="search" id="q" aria-label="Search incidents" placeholder="Search incidents, systems, teams…" value="' + esc(S.filters.q) + '"></div>' +
    '<div class="date-range">' + icon('calendar') + '<label class="filter-date"><span>From</span><input type="date" id="from" value="' + esc(S.filters.from || min) + '" title="From date"></label>' +
    '<label class="filter-date"><span>To</span><input type="date" id="to" value="' + esc(S.filters.to || max) + '" title="To date"></label></div></div><div class="filter-secondary"><span class="filter-label">' + icon('setup') + 'Filter</span>' +
    msBlock('group', 'Team', cnt(x => x.group).map(e => ({ v: e[0], l: e[0], n: e[1] }))) +
    msBlock('priority', 'Priority', cnt(x => x.prio).sort((a, b) => a[0] - b[0]).map(e => ({ v: String(e[0]), l: PRIO_LABEL[e[0]] || e[0], n: e[1] }))) +
    msBlock('category', 'Category', cnt(x => x.category).map(e => ({ v: e[0], l: e[0], n: e[1] }))) +
    msBlock('state', 'State', cnt(x => x.state).map(e => ({ v: e[0], l: e[0], n: e[1] }))) +
    '<select id="flag" aria-label="Incident flags"><option value="">Everything</option>' +
    [['after', 'Outside working hours'], ['reopen', 'Reopened only'], ['breach', 'SLA breached only'], ['open', 'Still open'], ['p12', 'P1 and P2 only']]
      .map(o => '<option value="' + o[0] + '"' + (S.filters.flag === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select>' +
    '<button class="btn ghost" id="reset">Reset filters</button>' +
    '<span class="pill" id="scope" aria-live="polite"></span></div>';
  updateScope();
}
function updateScope() {
  const el = $('#scope'); if (el && A) el.textContent = num(A.list.length) + ' of ' + num(S.incidents.length) + ' incidents';
}

/* ============================================================
   Render
   ============================================================ */
function renderNav() {
  const groups = [
    { label: 'Analysis', keys: ['overview','clusters','backlog'] },
    { label: 'Explore', keys: ['problem','trends','teams','explorer'] },
    { label: 'Workspace', keys: ['exports','setup'] }
  ];
  $('#nav').innerHTML = groups.map(g =>
    '<div class="nav-section">' + g.label + '</div>' + g.keys.map(k => {
      const v = VIEWS.find(x => x.k === k);
      return '<button class="navbtn" data-view="' + v.k + '" aria-current="' + (S.view === v.k ? 'true' : 'false') + '">' +
        '<span class="ico">' + icon(v.k) + '</span><span>' + v.label + '</span><span class="tag" data-tag="' + v.k + '"></span></button>';
    }).join('')
  ).join('');
}

function emptyState() {
  return '<section class="empty" aria-labelledby="welcome-title">' +
    '<div class="empty-heading"><div class="view-kicker">' + icon('lens') + 'Incident intelligence</div>' +
    '<h2 id="welcome-title">Find the work worth automating.</h2>' +
    '<p>Start with your ServiceNow incident export. Discover repeat work, understand the effort, and build a focused automation backlog.</p></div>' +
    '<div class="import-grid">' +
      '<section class="import-panel" aria-labelledby="import-title"><div class="import-panel-top"><h3 id="import-title">' + icon('upload') + 'Import incidents</h3><span class="file-type">.CSV</span></div>' +
      '<button class="upload-target" data-open aria-describedby="upload-help"><span class="upload-symbol">' + icon('upload') + '</span>' +
      '<strong>Drop your CSV here, or <span class="browse-link">browse files</span></strong><small>ServiceNow exports · CSV or delimited text</small></button>' +
      '<div class="upload-help" id="upload-help">' + icon('shield') + '<span>Your incident data stays in this browser.<br>No uploads. No account needed.</span></div></section>' +
      '<aside class="sample-panel"><div class="eyebrow">Sample workspace</div><h3>No export handy?</h3><p>Explore a sample dataset to see the signatures, trends, and automation opportunities ToilLens uncovers.</p>' +
      '<button class="btn" data-sample><span>Explore sample data</span>' + icon('arrow') + '</button><span class="sample-note">Fictional incidents, full analysis</span></aside>' +
    '</div>' +
    '<div class="empty-features">' +
      '<div class="empty-feature"><div class="feature-number">01</div><div><b>Find repeat work</b><span>Group similar incidents into clear signatures and work types.</span></div></div>' +
      '<div class="empty-feature"><div class="feature-number">02</div><div><b>See the opportunity</b><span>Compare technical and business hours returned, automation fit, and payback.</span></div></div>' +
      '<div class="empty-feature"><div class="feature-number">03</div><div><b>Take it forward</b><span>Export ranked backlogs, work items, and ready-to-use briefs.</span></div></div>' +
    '</div><div class="empty-footer">' + icon('info') + '<span>Include <b>short description</b> and <b>opened date</b> for useful results. Common ServiceNow columns are mapped automatically; adjust them in Setup.</span></div></section>';
}

function render() {
  renderNav();
  const currentView = VIEWS.find(v => v.k === S.view);
  $('#pageTitle').textContent = S.incidents.length ? (currentView ? currentView.label : 'Overview') : 'Import incidents';
  const host = $('#views');
  if (!S.incidents.length) { host.innerHTML = '<div class="view on">' + emptyState() + '</div>'; return; }
  compute();
  const fn = { overview: vOverview, clusters: vClusters, backlog: vBacklog, problem: vProblem, trends: vTrends, teams: vTeams, explorer: vExplorer, exports: vExports, setup: vSetup }[S.view] || vOverview;
  host.innerHTML = '<div class="view on" data-page="' + S.view + '">' + fn() + '</div>';
  host.scrollTop = 0;
  updateScope();
  const tags = { clusters: num(A.clusters.length), explorer: num(A.list.length), backlog: num(A.clusters.filter(c => c.n >= 3 && c.recoverH > 1 && c.fit >= 40 && c.family.id !== 'app').length) };
  Object.keys(tags).forEach(k => { const t = $('[data-tag="' + k + '"]'); if (t) t.textContent = tags[k]; });
  $('#status').innerHTML = '<div class="status-title">' + icon('file') + '<span>' + (S.filename === 'sample-servicenow-export.csv' ? 'Sample dataset' : 'Dataset loaded') + '</span></div><div class="dataset-line"><span>Incidents</span><b>' + num(S.incidents.length) + '</b></div><div class="dataset-line"><span>Signatures</span><b>' + num(S.clusters.length) + '</b></div><div class="dataset-line"><span>Coverage</span><b>' + Math.round(A.spanDays) + ' days</b></div>';
}

/* ============================================================
   Data loading
   ============================================================ */
function ingest(text, name) {
  const rows = parseCSV(text);
  if (rows.length < 2) { toast('That file has no data rows'); return; }
  S.filename = name || 'Incident export';
  S.headers = rows[0].map(h => String(h).trim());
  S.rows = rows.slice(1).filter(r => r.length > 1);
  S.map = autoMap(S.headers);
  if (!S.map.shortDesc && !S.map.opened) {
    toast('Could not find a description or date column — map them in Setup');
    S.view = 'setup';
  }
  rebuild();
  toast('Loaded ' + num(S.rows.length) + ' rows from ' + (name || 'file'));
}

function rebuild() {
  buildIncidents();
  clusterIncidents();
  S.expanded = {}; S.limit = {};
  renderTopbar();
  render();
}

/* ---------- sample data ---------- */
function sampleCSV() {
  const groups = ['SRE-Platform', 'App Support - Loans', 'App Support - Payments', 'Database Ops', 'Network Ops', 'Middleware', 'Identity & Access', 'Cloud Engineering'];
  const T = [
    ['JBoss thread pool exhausted on {H} - restart required', 'Middleware', 'Restart Service', 2, 0.9, 34, 'Software'],
    ['Disk space above 90% on /var/log on {H}', 'SRE-Platform', 'Cleared Space', 3, 0.5, 46, 'Hardware'],
    ['Password reset request for user {U}', 'Identity & Access', 'Password Reset', 4, 0.4, 88, 'Inquiry'],
    ['Batch job FIN_DAILY_POST_{N} failed - rerun required', 'App Support - Payments', 'Job Rerun', 3, 1.2, 41, 'Software'],
    ['Kafka consumer lag on topic pay.settlement.{N}', 'Middleware', 'Restarted Consumer', 2, 1.6, 27, 'Software'],
    ['SSL certificate expiring in {N} days on {H}', 'SRE-Platform', 'Certificate Renewed', 3, 3.5, 22, 'Software'],
    ['Oracle blocking session on {H} - kill session requested', 'Database Ops', 'Session Killed', 2, 0.8, 25, 'Database'],
    ['Apigee proxy returning 502 errors on loan-api-{N}', 'App Support - Loans', 'Config Corrected', 2, 2.4, 19, 'Software'],
    ['Access request: add user {U} to AD group APP_SUPPORT', 'Identity & Access', 'Access Granted', 4, 6.0, 54, 'Inquiry'],
    ['Pod CrashLoopBackOff in namespace payments on cluster {H}', 'Cloud Engineering', 'Restart Service', 2, 1.1, 30, 'Software'],
    ['Dynatrace alert: response time degradation on Loan Origination API', 'App Support - Loans', 'Monitoring Tuned', 3, 0.2, 37, 'Software'],
    ['AMQ queue depth threshold breached on QUEUE.PAYMENT.IN.{N}', 'Middleware', 'Consumer Restarted', 2, 0.7, 24, 'Software'],
    ['Month-end reconciliation report extract required', 'App Support - Payments', 'Report Provided', 4, 4.5, 17, 'Inquiry'],
    ['Network latency between DC and AWS VPC vpc-{N}', 'Network Ops', 'Vendor Resolved', 2, 8.5, 12, 'Network'],
    ['NullPointerException in statement generation service', 'App Support - Loans', 'Code Fix Deployed', 2, 42, 14, 'Software'],
    ['Account locked out for user {U} after failed logins', 'Identity & Access', 'Account Unlocked', 4, 0.3, 62, 'Inquiry'],
    ['Tablespace {H} usage above threshold', 'Database Ops', 'Space Added', 3, 1.4, 21, 'Database'],
    ['False positive alert from synthetic monitor on {H}', 'SRE-Platform', 'No Action Required', 4, 0.1, 44, 'Software'],
    ['Payment file not received from partner sftp {H}', 'App Support - Payments', 'File Reprocessed', 2, 3.2, 23, 'Software'],
    ['Post-deployment errors after release {N} on loan service', 'App Support - Loans', 'Rolled Back', 1, 6.5, 9, 'Software'],
    ['Ansible tower job template failed - credential expired', 'SRE-Platform', 'Credential Rotated', 3, 1.0, 16, 'Software'],
    ['Memory utilisation above 92% on {H}', 'SRE-Platform', 'Restart Service', 3, 1.3, 28, 'Hardware'],
    ['User unable to access loan servicing portal from branch {N}', 'Network Ops', 'Connectivity Restored', 3, 2.1, 26, 'Network'],
    ['Duplicate incident created by monitoring integration', 'SRE-Platform', 'Duplicate', 4, 0.1, 20, 'Inquiry'],
    ['Interest calculation incorrect on account statement', 'App Support - Loans', 'Code Fix Deployed', 1, 61, 7, 'Software']
  ];
  const hosts = ['apppr-web01', 'apppr-web02', 'apppr-app03', 'dbpr-ora01', 'mwpr-jb04', 'ocp-prd-node07', 'aws-prd-ec2-11', 'apppr-bat02'];
  const states = ['Closed', 'Resolved', 'Closed', 'Closed', 'In Progress'];
  const rows = [];
  const headers = ['Number', 'Opened', 'Resolved', 'Short description', 'Priority', 'State', 'Category', 'Assignment group',
    'Configuration item', 'Close code', 'Reassignment count', 'Reopen count', 'Made SLA', 'Contact type', 'Assigned to'];
  let n = 0;
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth() - 11, 1);
  const rnd = (a, b) => a + Math.random() * (b - a);
  T.forEach(t => {
    const [tpl, grp, code, prio, baseH, count, cat] = t;
    const total = Math.round(count * rnd(0.85, 1.15));
    for (let i = 0; i < total; i++) {
      const d = new Date(start.getTime() + Math.random() * (now - start));
      // weight arrivals toward the working day, but keep a real off-hours tail
      let h = Math.random() < 0.68 ? Math.floor(rnd(8, 18)) : Math.floor(rnd(0, 24));
      d.setHours(h, Math.floor(rnd(0, 60)), 0, 0);
      const dur = Math.max(0.05, baseH * rnd(0.5, 1.9));
      const st = states[Math.floor(Math.random() * states.length)];
      const res = st === 'In Progress' ? null : new Date(d.getTime() + dur * 36e5);
      const host = hosts[Math.floor(Math.random() * hosts.length)];
      const txt = tpl.replace('{H}', host).replace('{U}', 'u' + Math.floor(rnd(10000, 99999))).replace('{N}', String(Math.floor(rnd(1, 90))));
      n++;
      rows.push([
        'INC' + String(1000000 + n),
        ymd(d) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ':00',
        res ? ymd(res) + ' ' + String(res.getHours()).padStart(2, '0') + ':' + String(res.getMinutes()).padStart(2, '0') + ':00' : '',
        txt,
        prio + ' - ' + (PRIO_LABEL[prio] || '').split(' ')[1],
        st, cat,
        Math.random() < 0.06 ? groups[Math.floor(Math.random() * groups.length)] : grp,
        host,
        res ? code : '',
        String(Math.random() < 0.22 ? Math.floor(rnd(1, 4)) : 0),
        String(Math.random() < (baseH > 20 ? 0.28 : 0.05) ? 1 : 0),
        Math.random() < (dur > baseH * 1.4 ? 0.5 : 0.92) ? 'true' : 'false',
        Math.random() < 0.5 ? 'Monitoring' : (Math.random() < 0.5 ? 'Phone' : 'Self-service'),
        'agent' + Math.floor(rnd(1, 24))
      ]);
    }
  });
  rows.sort(() => Math.random() - 0.5);
  return toCSV(headers, rows);
}

/* ============================================================
   Events
   ============================================================ */
function setNavigation(open) {
  $('#sidebar').classList.toggle('nav-open', open);
  const button = $('#btnMenu');
  button.setAttribute('aria-expanded', String(open));
  button.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
  button.innerHTML = icon(open ? 'close' : 'menu');
}
function closeFilters(except) {
  $$('.ms').forEach(m => {
    if (m !== except) { m.classList.remove('open'); $('button', m).setAttribute('aria-expanded', 'false'); }
  });
}
function wire() {
  $('#btnMenu').addEventListener('click', () => setNavigation(!$('#sidebar').classList.contains('nav-open')));
  const fileEl = $('#file');
  const openFile = () => { setNavigation(false); fileEl.click(); };
  $('#btnOpen').addEventListener('click', openFile);
  $('#btnSample').addEventListener('click', () => { setNavigation(false); ingest(sampleCSV(), 'sample-servicenow-export.csv'); });
  $('#btnTheme').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const nx = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', nx);
    const label = nx === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
    $('#btnTheme').innerHTML = icon(nx === 'dark' ? 'sun' : 'moon');
    $('#btnTheme').setAttribute('aria-label', label);
    $('#btnTheme').setAttribute('title', label);
    $('meta[name="theme-color"]').setAttribute('content', nx === 'dark' ? '#100818' : '#F6F6F6');
  });
  fileEl.addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => ingest(String(r.result), f.name);
    r.onerror = () => toast('Could not read that file');
    r.readAsText(f);
    fileEl.value = '';
  });

  let dragN = 0;
  const dz = $('#drop');
  window.addEventListener('dragenter', e => { e.preventDefault(); dragN++; dz.classList.add('on'); });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; dz.classList.remove('on'); } });
  window.addEventListener('drop', e => {
    e.preventDefault(); dragN = 0; dz.classList.remove('on');
    const f = e.dataTransfer.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => ingest(String(r.result), f.name);
    r.readAsText(f);
  });

  document.addEventListener('click', e => {
    const t = e.target;
    const nav = t.closest('[data-view]');
    if (nav) { const mobile = $('#btnMenu').getAttribute('aria-expanded') === 'true'; S.view = nav.getAttribute('data-view'); setNavigation(false); closeFilters(); render(); if (mobile) $('#views').focus({ preventScroll: true }); return; }
    if (t.closest('[data-open]')) return openFile();
    if (t.closest('[data-sample]')) return ingest(sampleCSV(), 'sample-servicenow-export.csv');
    const dl = t.closest('[data-dl]'); if (dl) return doDownload(dl.getAttribute('data-dl'));
    const ex = t.closest('[data-exp]'); if (ex) { const k = ex.getAttribute('data-exp'); S.expanded[k] = !S.expanded[k]; return render(); }
    const br = t.closest('[data-brief]');
    if (br) { const c = A.byCid.get(+br.getAttribute('data-brief')); return download('brief-' + c.label.toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 50) + '.md', briefMD(c), 'text/markdown'); }
    const cc = t.closest('[data-cluster-csv]');
    if (cc) {
      const c = A.byCid.get(+cc.getAttribute('data-cluster-csv'));
      const saved = A.list; A.list = c.members; const tb = incidentTable(); A.list = saved;
      return download('signature-' + c.label.toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 40) + '.csv', toCSV(tb.headers, tb.rows));
    }
    const more = t.closest('[data-more]'); if (more) { const k = more.getAttribute('data-more'); S.limit[k] = (S.limit[k] || 150) + 150; return render(); }
    const th = t.closest('th[data-k]');
    if (th) {
      const id = th.closest('table').getAttribute('data-table'), k = th.getAttribute('data-k');
      const cur = S.sort[id];
      S.sort[id] = { key: k, dir: cur && cur.key === k ? -cur.dir : (th.hasAttribute('data-num') ? -1 : 1) };
      return render();
    }
    const msb = t.closest('.ms>button');
    if (msb) { const ms = msb.parentElement; closeFilters(ms); const open = ms.classList.toggle('open'); msb.setAttribute('aria-expanded', String(open)); if (open) $('input[type=search]', ms).focus(); return; }
    if (!t.closest('.ms-menu')) closeFilters();
    const all = t.closest('[data-msall]'), none = t.closest('[data-msnone]');
    if (all || none) {
      const ms = t.closest('.ms'), key = ms.getAttribute('data-ms');
      const boxes = $$('input[type=checkbox]', ms).filter(b => b.parentElement.style.display !== 'none');
      boxes.forEach(b => { b.checked = !!all; });
      S.filters[key] = all ? boxes.map(b => b.value) : [];
      $('[data-n]', ms).textContent = S.filters[key].length || 'all';
      return render();
    }
    if (t.id === 'reset') {
      S.filters = { from: '', to: '', group: [], priority: [], category: [], state: [], q: '', flag: '' };
      renderTopbar(); return render();
    }
    if (t.id === 'applyCfg' || t.id === 'applyMap' || t.id === 'applyFam') {
      $$('[data-fam]').forEach(inp => {
        const f = FAMILIES.concat([FAM_OTHER]).find(x => x.id === inp.getAttribute('data-fam')), k = inp.getAttribute('data-famk'), v = parseFloat(inp.value);
        if (f && isFinite(v) && v >= 0) f[k] = k === 'wait' ? Math.min(1, v) : v;
      });
      $$('[data-cfg]').forEach(inp => {
        const k = inp.getAttribute('data-cfg'), v = parseFloat(inp.value);
        if (!isFinite(v)) return;
        if (k === 'buildS') S.cfg.build.S = v; else if (k === 'buildM') S.cfg.build.M = v;
        else if (k === 'buildL') S.cfg.build.L = v; else S.cfg[k] = v;
      });
      $$('[data-map]').forEach(sel => { const k = sel.getAttribute('data-map'); if (sel.value) S.map[k] = sel.value; else delete S.map[k]; });
      rebuild(); toast('Recalculated'); return;
    }
  });

  document.addEventListener('change', e => {
    const t = e.target;
    if (t.matches('.ms input[type=checkbox]')) {
      const ms = t.closest('.ms'), key = ms.getAttribute('data-ms');
      S.filters[key] = $$('input[type=checkbox]:checked', ms).map(b => b.value);
      $('[data-n]', ms).textContent = S.filters[key].length || 'all';
      return render();
    }
    if (t.id === 'from') { S.filters.from = t.value; return render(); }
    if (t.id === 'to') { S.filters.to = t.value; return render(); }
    if (t.id === 'flag') { S.filters.flag = t.value; return render(); }
  });

  let qt;
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'q') { clearTimeout(qt); qt = setTimeout(() => { S.filters.q = t.value; render(); }, 220); return; }
    if (t.matches('[data-mssearch]')) {
      const v = t.value.toLowerCase();
      $$('label', t.parentElement).forEach(l => { l.style.display = l.textContent.toLowerCase().includes(v) ? '' : 'none'; });
    }
  });

  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('th[data-k]')) {
      e.preventDefault();
      const tableId = e.target.closest('table').getAttribute('data-table'), key = e.target.getAttribute('data-k');
      e.target.click();
      const next = $('table[data-table="' + tableId + '"] th[data-k="' + key + '"]');
      if (next) next.focus({ preventScroll: true });
    }
    if (e.key === 'Escape') { const open = $('.ms.open'); closeFilters(); if (open) $('button', open).focus(); if ($('#btnMenu').getAttribute('aria-expanded') === 'true') { setNavigation(false); $('#btnMenu').focus(); } }
  });
}

wire();
render();

</script>
