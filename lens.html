<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ToilLens — ServiceNow incident to automation console</title>
<style>
:root{
  --bg:#0B0F16; --panel:#121926; --panel2:#0E1420; --raise:#18202F;
  --line:#1E2836; --line2:#2C3A4E;
  --ink:#E6EDF6; --muted:#8B9AAF; --dim:#5D6B80;
  --toil:#E8A33D; --auto:#3FC8BE; --prob:#8B7CF6; --bad:#E2646B; --good:#4FBF8B; --info:#5EA9F5;
  --mono:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",sans-serif;
  --r:7px;
}
html[data-theme="light"]{
  --bg:#EEF1F5; --panel:#FFFFFF; --panel2:#F5F7FA; --raise:#FFFFFF;
  --line:#DFE4EC; --line2:#C6CFDC;
  --ink:#111A26; --muted:#5A6879; --dim:#8896A8;
  --toil:#B77410; --auto:#0F8F86; --prob:#6350C9; --bad:#C33F47; --good:#2A8F62; --info:#2570C4;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:230px 1fr;height:100vh;overflow:hidden}
.side{background:var(--panel2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:16px 16px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.mark{width:26px;height:26px;flex:0 0 26px;border-radius:5px;background:linear-gradient(150deg,var(--toil),var(--auto));display:grid;place-items:center;color:#07101a;font-weight:800;font-size:13px;font-family:var(--mono)}
.brand b{display:block;font-size:14px;letter-spacing:.2px}
.brand small{display:block;color:var(--dim);font-size:10.5px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase}
nav{padding:10px 8px;overflow:auto;flex:1;min-height:0}
.navbtn{display:flex;width:100%;gap:9px;align-items:center;background:none;border:0;padding:8px 9px;border-radius:6px;color:var(--muted);cursor:pointer;text-align:left;font-size:13px}
.navbtn:hover{background:var(--raise);color:var(--ink)}
.navbtn[aria-current="true"]{background:var(--raise);color:var(--ink);box-shadow:inset 2px 0 0 var(--toil)}
.navbtn .ico{width:16px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--dim)}
.navbtn[aria-current="true"] .ico{color:var(--toil)}
.navbtn .tag{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.side-foot{padding:10px;border-top:1px solid var(--line);display:grid;gap:6px}
.status{font-family:var(--mono);font-size:10.5px;color:var(--dim);line-height:1.5;padding:6px 8px;border:1px dashed var(--line2);border-radius:6px}
.status b{color:var(--ink);font-weight:600}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{border-bottom:1px solid var(--line);background:var(--panel2);padding:8px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.views{overflow:auto;flex:1;padding:18px;min-height:0}
.view{display:none;max-width:1500px;margin:0 auto}
.view.on{display:block}

/* ---------- controls ---------- */
.btn{background:var(--raise);border:1px solid var(--line2);color:var(--ink);padding:6px 11px;border-radius:6px;cursor:pointer;font-size:12.5px;white-space:nowrap;transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.navbtn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--info);outline-offset:1px}
.btn.primary{background:var(--toil);border-color:var(--toil);color:#150E02;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:3px 8px;font-size:11.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
select,input[type=text],input[type=number],input[type=date],input[type=search]{background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:5px 8px;font-size:12.5px}
label.fld{display:grid;gap:4px;font-size:11px;color:var(--muted)}

/* multiselect */
.ms{position:relative}
.ms>button{display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:5px 9px;font-size:12.5px;cursor:pointer;max-width:230px}
.ms>button .n{font-family:var(--mono);font-size:10.5px;color:var(--toil)}
.ms>button .cv{color:var(--dim);font-size:10px}
.ms-menu{display:none;position:absolute;z-index:60;top:calc(100% + 4px);left:0;width:264px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;box-shadow:0 14px 38px rgba(0,0,0,.5);padding:8px}
.ms.open .ms-menu{display:block}
.ms-list{max-height:250px;overflow:auto;margin-top:6px;display:grid;gap:1px}
.ms-list label{display:flex;gap:7px;align-items:center;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:12.5px}
.ms-list label:hover{background:var(--raise)}
.ms-list .ct{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.ms-menu .row{display:flex;gap:6px;margin-top:6px}
.ms-menu input[type=search]{width:100%}

/* ---------- panels ---------- */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card>header{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card>header h3{margin:0;font-size:12.5px;font-weight:600;letter-spacing:.02em}
.card>header .sub{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.card>header .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.card .body{padding:14px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.view>h2{margin:0 0 3px;font-size:19px;letter-spacing:-.01em}
.view>p.lede{margin:0 0 16px;color:var(--muted);font-size:13px;max-width:78ch}

/* KPI */
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset:0 auto 0 0;width:2px;background:var(--k,var(--line2))}
.kpi .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.kpi .val{font-family:var(--mono);font-size:25px;font-weight:600;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums;color:var(--k,var(--ink))}
.kpi .val small{font-size:13px;color:var(--muted);font-weight:400}
.kpi .note{font-size:11.5px;color:var(--muted);margin-top:3px}

/* ---------- tables ---------- */
.tw{overflow:auto;max-height:none}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{position:sticky;top:0;background:var(--panel2);z-index:2;font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap;border-bottom:1px solid var(--line2)}
thead th:hover{color:var(--ink)}
thead th .ar{color:var(--toil)}
tbody tr:hover{background:var(--panel2)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.mono{font-family:var(--mono);font-size:11.5px}
td.wrap{min-width:240px}
.rank{font-family:var(--mono);color:var(--dim);font-size:11px}
.expander{cursor:pointer}
.sub-row td{background:var(--panel2);padding:0}
.sub-inner{padding:12px 14px;border-left:2px solid var(--toil)}

/* signature chip — the artifact of the subject's world */
.sig{font-family:var(--mono);font-size:11.5px;color:var(--muted);word-break:break-word;line-height:1.6}
.sig .ph{color:var(--auto);background:color-mix(in srgb,var(--auto) 14%,transparent);border-radius:3px;padding:0 3px}
.sigbox{border:1px solid var(--line2);border-left:2px solid var(--auto);border-radius:5px;padding:8px 10px;background:var(--panel2)}

/* bars & pills */
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:52px}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--toil);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.ledger{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);min-width:90px}
.ledger i{display:block;height:100%}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:99px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.pill.toil{color:var(--toil);border-color:color-mix(in srgb,var(--toil) 45%,transparent);background:color-mix(in srgb,var(--toil) 10%,transparent)}
.pill.auto{color:var(--auto);border-color:color-mix(in srgb,var(--auto) 45%,transparent);background:color-mix(in srgb,var(--auto) 10%,transparent)}
.pill.prob{color:var(--prob);border-color:color-mix(in srgb,var(--prob) 45%,transparent);background:color-mix(in srgb,var(--prob) 10%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent);background:color-mix(in srgb,var(--good) 10%,transparent)}
.score{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.dot{width:7px;height:7px;border-radius:99px;display:inline-block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* charts */
svg{display:block;width:100%;height:auto;overflow:visible}
.ax{stroke:var(--line);stroke-width:1}
.axtxt{fill:var(--dim);font-family:var(--mono);font-size:9px}
.gl{stroke:var(--line);stroke-dasharray:2 4;stroke-width:1}
.blab{fill:var(--muted);font-family:var(--mono);font-size:9.5px}

/* dropzone / empty */
.empty{border:1.5px dashed var(--line2);border-radius:12px;padding:44px 26px;text-align:center;background:var(--panel2)}
.empty h3{margin:0 0 6px;font-size:17px}
.empty p{margin:0 auto 16px;color:var(--muted);max-width:60ch;font-size:13px}
.drop{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(3px);display:none;place-items:center;z-index:200;font-size:17px}
.drop.on{display:grid}
.drop div{border:2px dashed var(--toil);border-radius:14px;padding:52px 70px;font-family:var(--mono);color:var(--toil)}

/* toast */
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(24px);background:var(--raise);border:1px solid var(--line2);border-left:3px solid var(--good);padding:9px 15px;border-radius:7px;font-size:12.5px;opacity:0;pointer-events:none;transition:.2s;z-index:300;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.hint{font-size:11.5px;color:var(--dim);margin-top:8px}
.split{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.warn{border-left:2px solid var(--toil);background:color-mix(in srgb,var(--toil) 7%,transparent);padding:9px 12px;border-radius:5px;font-size:12.5px;color:var(--muted)}

@media (max-width:960px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;height:auto;min-height:100vh;overflow:visible}
  .side{border-right:0;border-bottom:1px solid var(--line)}
  nav{display:flex;gap:4px;overflow-x:auto;padding:8px}
  .navbtn{width:auto;white-space:nowrap}
  .navbtn .tag{display:none}
  .side-foot{grid-template-columns:1fr 1fr 1fr}
  .side-foot .status{grid-column:1/-1}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .views{padding:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="mark">TL</div>
      <div><b>ToilLens</b><small>incident → automation</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="status" id="status">No data loaded.<br>Drop a ServiceNow CSV anywhere.</div>
      <button class="btn primary" id="btnOpen">Load CSV</button>
      <button class="btn ghost" id="btnSample">Load sample data</button>
      <button class="btn ghost" id="btnTheme">Switch to light</button>
    </div>
  </aside>
  <div class="main">
    <div class="topbar" id="topbar"></div>
    <div class="views" id="views"></div>
  </div>
</div>
<input type="file" id="file" accept=".csv,.txt,text/csv" hidden>
<div class="drop" id="drop"><div>Drop the CSV to analyze</div></div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   ToilLens — ServiceNow incident → toil & automation console
   Single file, no dependencies. All processing stays in-browser.
   ============================================================ */
'use strict';

/* ---------- tiny utils ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uniq = a => Array.from(new Set(a));
const num = n => (n == null || !isFinite(n)) ? '—' : Math.round(n).toLocaleString();
const dec = (n, d) => (n == null || !isFinite(n)) ? '—' : (Math.round(n * Math.pow(10, d || 1)) / Math.pow(10, d || 1)).toLocaleString();
const money = n => (n == null || !isFinite(n)) ? '—' : (Math.abs(n) >= 1000 ? '$' + Math.round(n).toLocaleString() : '$' + Math.round(n));
const pct = n => (n == null || !isFinite(n)) ? '—' : (Math.round(n * 1000) / 10) + '%';
const hrs = h => (h == null || !isFinite(h)) ? '—' : h < 1 ? Math.round(h * 60) + 'm' : h < 72 ? (Math.round(h * 10) / 10) + 'h' : (Math.round(h / 24 * 10) / 10) + 'd';
const median = a => { if (!a.length) return NaN; const b = a.slice().sort((x, y) => x - y); const m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };
const quant = (a, q) => { if (!a.length) return NaN; const b = a.slice().sort((x, y) => x - y); const p = (b.length - 1) * q, lo = Math.floor(p), hi = Math.ceil(p); return b[lo] + (b[hi] - b[lo]) * (p - lo); };
const sum = a => a.reduce((x, y) => x + (isFinite(y) ? y : 0), 0);
const mean = a => a.length ? sum(a) / a.length : NaN;
const topN = (map, n) => Array.from(map.entries()).sort((a, b) => b[1] - a[1]).slice(0, n);
const bump = (map, k, by) => map.set(k, (map.get(k) || 0) + (by == null ? 1 : by));
const top1 = m => { const t = topN(m, 1)[0]; return t ? t[0] : ''; };
const topStr = (m, n) => topN(m, n).map(x => x[0] + ' (' + x[1] + ')').join(' | ');
const DAYNAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2600);
}

/* ---------- state ---------- */
const S = {
  headers: [], rows: [], map: {}, incidents: [], clusters: [], view: 'overview',
  sort: {}, expanded: {}, limit: {},
  filters: { from: '', to: '', group: [], priority: [], category: [], state: [], q: '', flag: '' },
  cfg: {
    rate: 85,             // loaded hourly cost of an engineer
    handsOn: 0.35,        // share of ticket duration that is actual human touch time
    minTouch: 15,         // floor, minutes
    capTouch: 6,          // ceiling, hours
    bhStart: 8, bhEnd: 18,
    sim: 0.62,            // signature merge threshold
    autoEff: 0.8,         // realistic share of touch time automation removes
    build: { S: 24, M: 80, L: 200 },
    dateOrder: 'auto'
  }
};

/* ---------- CSV ---------- */
function sniffDelim(text) {
  const line = text.slice(0, 8000).split(/\r?\n/)[0] || '';
  let best = ',', bestN = -1;
  [',', ';', '\t', '|'].forEach(d => {
    let n = 0, q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') q = !q; else if (c === d && !q) n++;
    }
    if (n > bestN) { bestN = n; best = d; }
  });
  return best;
}

function parseCSV(text, delim) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const d = delim || sniffDelim(text);
  const rows = []; let row = [], field = '', inQ = false, i = 0;
  const n = text.length;
  while (i < n) {
    const c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if (c === '"') { inQ = true; i++; continue; }
    if (c === d) { row.push(field); field = ''; i++; continue; }
    if (c === '\r') { i++; continue; }
    if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
    field += c; i++;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  // drop fully blank rows
  return rows.filter(r => r.some(v => String(v).trim() !== ''));
}

/* ---------- dates ---------- */
function detectDateOrder(vals) {
  let dmy = 0, mdy = 0;
  for (const v of vals) {
    const m = String(v).match(/^\s*(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
    if (!m) continue;
    if (+m[1] > 12) dmy++; else if (+m[2] > 12) mdy++;
  }
  return dmy > mdy ? 'DMY' : 'MDY';
}

function parseDate(v) {
  if (!v) return null;
  if (v instanceof Date) return isNaN(v) ? null : v;
  const s = String(v).trim();
  if (!s || /^(null|n\/a|na|-|--)$/i.test(s)) return null;
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:[ ,]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?\s*(AM|PM)?/i);
  if (m) {
    let a = +m[1], b = +m[2], y = +m[3]; if (y < 100) y += 2000;
    let day, mon;
    const order = S.cfg.dateOrder === 'auto' ? (a > 12 ? 'DMY' : S.cfg._auto || 'MDY') : S.cfg.dateOrder;
    if (order === 'DMY' || a > 12) { day = a; mon = b; } else { mon = a; day = b; }
    let H = +(m[4] || 0); const ap = (m[7] || '').toUpperCase();
    if (ap === 'PM' && H < 12) H += 12; if (ap === 'AM' && H === 12) H = 0;
    return new Date(y, mon - 1, day, H, +(m[5] || 0), +(m[6] || 0));
  }
  const t = Date.parse(s);
  return isNaN(t) ? null : new Date(t);
}
const ymd = d => d ? d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') : '';
const ym = d => d ? d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') : '';
const dstr = d => d ? ymd(d) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') : '';

/* ---------- column mapping ---------- */
const FIELDS = [
  { k: 'id', label: 'Incident number', alias: ['number', 'incident', 'incident number', 'inc', 'ticket', 'ticket number', 'task', 'id', 'record'] },
  { k: 'opened', label: 'Opened / created', alias: ['opened', 'opened at', 'opened_at', 'created', 'created on', 'sys created on', 'sys_created_on', 'reported date', 'open time', 'start'] },
  { k: 'resolved', label: 'Resolved', alias: ['resolved', 'resolved at', 'resolved_at', 'resolve time', 'resolution date', 'u_resolved'] },

const normHdr = h => String(h || '').toLowerCase().replace(/[_\-.]+/g, ' ').replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();

function autoMap(headers) {
  const map = {}; const used = new Set();
  const norm = headers.map(normHdr);
  FIELDS.forEach(f => {
    let best = -1, bestScore = 0;
    norm.forEach((h, i) => {
      if (used.has(i) || !h) return;
      let sc = 0;
      if (f.alias.indexOf(h) >= 0) sc = 100 - f.alias.indexOf(h);
      else if (f.alias.some(a => h === a + 's')) sc = 70;
      else if (f.alias.some(a => a.length > 4 && h.indexOf(a) >= 0)) sc = 45 - h.length * 0.1;
      else if (f.alias.some(a => a.length > 5 && a.indexOf(h) >= 0 && h.length > 4)) sc = 30;
      if (sc > bestScore) { bestScore = sc; best = i; }

/* ---------- priority ---------- */
function priorityRank(v) {
  const s = String(v || '').toLowerCase();
  const m = s.match(/(\d)/);
  if (m) { const n = +m[1]; if (n >= 1 && n <= 5) return n; }
  if (/critical|sev\s*1|p1|highest|emergency/.test(s)) return 1;
  if (/high|sev\s*2|p2|major/.test(s)) return 2;
  if (/moderate|medium|sev\s*3|p3|normal/.test(s)) return 3;
  if (/low|sev\s*4|p4|minor/.test(s)) return 4;
  if (/planning|sev\s*5|p5/.test(s)) return 5;

}

const STOP = new Set(('the a an of on in at for to and or is are was were be been being with from by as it its this that these those ' +
  'please kindly hi hello team dear thanks thank regards not no yes we you i has have had do does did will would can could should ' +
  'need needs required requesting requested issue issues problem incident ticket case new open close closed user users ' +
  'unable able getting getting seeing see also same again due there their they').split(/\s+/));

/* Turn a free-text description into a stable signature by masking the volatile parts. */
function normText(s) {
  return String(s || '').toLowerCase()
    .replace(/https?:\/\/\S+/g, ' <url> ')
    .replace(/[\w.+-]+@[\w-]+\.[\w.]+/g, ' <email> ')
    .replace(/\b\d{1,3}(\.\d{1,3}){3}\b/g, ' <ip> ')
    .replace(/\b[0-9a-f]{8}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{12}\b/g, ' <id> ')
    .replace(/\b[0-9a-f]{12,}\b/g, ' <hash> ')
    .replace(/\b(inc|chg|req|ritm|prb|task|rtsk|sctask)[0-9]{4,}\b/g, ' <ref> ')
    .replace(/\b\d{4}-\d{2}-\d{2}([t ]\d{2}:\d{2}(:\d{2})?)?\b/g, ' <date> ')
    .replace(/\b\d{1,2}:\d{2}(:\d{2})?\s*(am|pm)?\b/g, ' <time> ')
    .replace(/\b(?=[a-z0-9-]*\d)[a-z][a-z0-9]*(?:[-_.][a-z0-9]+)+\b/g, ' <host> ')
    .replace(/\b[a-z]:\\[^\s]+|\/(?:[\w.-]+\/){1,}[\w.-]*/g, ' <path> ')
    .replace(/\b\d+(\.\d+)?\s*(%|gb|mb|tb|kb|ms|sec|secs|s|min|mins|hrs|hours)\b/g, ' <qty> ')
    .replace(/\b\d+(\.\d+)?\b/g, ' <n> ')
    .replace(/[^a-z0-9<>_ ]+/g, ' ')
    .replace(/\s+/g, ' ').trim();
}

function tokenize(nt) {
  const seen = new Set(), out = [];
  nt.split(' ').forEach(t => {
    if (t.length < 3 || t[0] === '<' || STOP.has(t)) return;
    if (seen.has(t)) return; seen.add(t); out.push(t);
  });
  return out.slice(0, 14);
}

function jaccard(a, b) {
  if (!a.length || !b.length) return 0;
  const sa = new Set(a); let inter = 0;
  for (const t of b) if (sa.has(t)) inter++;
  return inter / (a.length + b.length - inter);
}

const FAM_OTHER = { id: 'other', label: 'Unclassified', auto: 0.35, tier: 'M', color: 'var(--muted)', fix: 'Read a few samples and tag it — unclassified volume is where hidden toil lives.' };

/* The description decides the work type; category and close code only break ties.
   Scoring beats first-match-wins — a close code of "Code Fix Deployed" should not
   turn an application defect into change fallout. */
function familyOf(primary, secondary) {
  const a = String(primary || '').toLowerCase(), b = String(secondary || '').toLowerCase();
  let best = null, bs = 0;
  for (const f of FAMILIES) {
    let sc = 0;
    if (f.re.test(a)) sc += 2;
    if (b && f.re.test(b)) sc += 1;
    if (sc > bs) { bs = sc; best = f; }
  }
  return best || FAM_OTHER;
}

/* ---------- clustering: exact signature, then fuzzy merge of near-duplicates ---------- */
function clusterIncidents() {
  const inc = S.incidents;
  const groups = new Map();
  inc.forEach(x => {
    x.nt = normText(x.short);
    x.tok = tokenize(x.nt + ' ' + normText(x.category === '(none)' ? '' : x.category));
    const key = x.nt || ('cat:' + x.category);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(x.i);
  });

  let keys = Array.from(groups.keys());
  const reps = keys.map(k => {
    const first = inc[groups.get(k)[0]];
    return { key: k, tok: first.tok, n: groups.get(k).length };
  });

  // union-find over signature groups
  const parent = reps.map((_, i) => i);
  const find = a => { while (parent[a] !== a) { parent[a] = parent[parent[a]]; a = parent[a]; } return a; };
  const union = (a, b) => { a = find(a); b = find(b); if (a !== b) parent[b > a ? b : a] = b > a ? a : b; };

  // only fuzzy-merge the busiest signatures; bounds the work on very large dumps
  const order = reps.map((r, i) => i).sort((a, b) => reps[b].n - reps[a].n).slice(0, 2500);
  const index = new Map();
  const df = new Map();
  order.forEach(i => reps[i].tok.forEach(t => bump(df, t)));
  const rare = t => (df.get(t) || 0) <= Math.max(40, order.length * 0.2);
  order.forEach(i => reps[i].tok.forEach(t => { if (!rare(t)) return; if (!index.has(t)) index.set(t, []); index.get(t).push(i); }));

  const th = S.cfg.sim;
  order.forEach(i => {
    const cand = new Map();
    reps[i].tok.forEach(t => {
      const lst = index.get(t); if (!lst || lst.length > 600) return;
      lst.forEach(j => { if (j !== i) bump(cand, j); });
    });
    cand.forEach((shared, j) => {
      if (shared < 2) return;
      if (find(i) === find(j)) return;
      if (jaccard(reps[i].tok, reps[j].tok) >= th) union(i, j);
    });
  });

  const rootToCid = new Map(); const clusters = [];
  reps.forEach((r, i) => {
    const root = find(i);
    let cid = rootToCid.get(root);
    if (cid == null) { cid = clusters.length; rootToCid.set(root, cid); clusters.push({ id: cid, members: [], sigs: [] }); }
    clusters[cid].sigs.push(r.key);
    groups.get(r.key).forEach(ix => { clusters[cid].members.push(ix); inc[ix].cid = cid; });
  });
  S.clusters = clusters;
}

/* ---------- per-view cluster statistics + scoring ---------- */
function analyze(list) {
  const cfg = S.cfg;
  const byC = new Map();
  list.forEach(x => { if (!byC.has(x.cid)) byC.set(x.cid, []); byC.get(x.cid).push(x); });

  const dates = list.map(x => x.opened).filter(Boolean).sort((a, b) => a - b);
  const spanDays = dates.length > 1 ? Math.max(1, (dates[dates.length - 1] - dates[0]) / 864e5) : 1;
  const annualise = n => spanDays >= 25 ? n * 365 / spanDays : n;
  const lastDate = dates.length ? dates[dates.length - 1] : null;
  let maxN = 1; byC.forEach(v => { if (v.length > maxN) maxN = v.length; });

  const out = [];
  byC.forEach((mem, cid) => {
    const mttrs = mem.map(x => x.mttr).filter(v => v != null && isFinite(v));
    const p50 = median(mttrs), p90 = quant(mttrs, 0.9), avg = mean(mttrs);
    const sd = mttrs.length > 1 ? Math.sqrt(mean(mttrs.map(v => (v - avg) * (v - avg)))) : 0;
    const cv = avg > 0 ? sd / avg : 0;
    const gm = new Map(), cm = new Map(), pm = new Map(), mm = new Map(), cc = new Map();
    mem.forEach(x => { bump(gm, x.group); bump(cm, x.ci); bump(pm, x.prio); if (x.month) bump(mm, x.month); if (x.closeCode) bump(cc, x.closeCode); });
    const label = (() => {
      const c = new Map(); mem.forEach(x => bump(c, x.short));
      return topN(c, 1)[0][0];
    })();
    const sigText = mem[0].nt || '(no signature)';
    const fam = familyOf(label + ' ' + sigText, (mem[0].category || '') + ' ' + topStr(cc, 2));
    const n = mem.length;
    const opens = mem.map(x => x.opened).filter(Boolean).sort((a, b) => a - b);
    const first = opens[0] || null, last = opens[opens.length - 1] || null;
    const staleDays = (last && lastDate) ? (lastDate - last) / 864e5 : 0;

    const touchH = clamp((p50 != null && isFinite(p50) ? p50 : 1) * cfg.handsOn, cfg.minTouch / 60, cfg.capTouch);
    const annualN = annualise(n);
    const annualH = annualN * touchH;
    const reassignAvg = mean(mem.map(x => x.reassign)) || 0;
    const reopenRate = mem.filter(x => x.reopen > 0).length / n;
    const afterPct = mem.filter(x => x.after).length / n;
    const p1p2 = mem.filter(x => x.prio <= 2).length / n;
    const monthsActive = mm.size;

    // --- toil score -------------------------------------------------
    const rep = clamp(Math.log(n + 1) / Math.log(maxN + 1), 0, 1);
    const persist = clamp(monthsActive / clamp(spanDays / 30, 1, 12), 0, 1);
    const quick = !isFinite(p50) ? 0.5 : p50 <= 0.5 ? 1 : p50 <= 2 ? 0.85 : p50 <= 8 ? 0.55 : p50 <= 24 ? 0.3 : 0.12;
    const predict = !isFinite(cv) ? 0.5 : cv <= 0.4 ? 1 : cv <= 0.8 ? 0.7 : cv <= 1.5 ? 0.4 : 0.2;
    const lowChurn = clamp(1 - reassignAvg / 3, 0, 1) * 0.6 + clamp(1 - reopenRate * 4, 0, 1) * 0.4;
    let toil = 100 * (0.30 * rep + 0.14 * persist + 0.18 * quick + 0.10 * predict + 0.18 * fam.auto + 0.10 * lowChurn);
    if (n < 2) toil *= 0.3; else if (n < 4) toil *= 0.72;
    if (staleDays > 90) toil *= 0.6;

    // --- automation fit ---------------------------------------------
    const oneOwner = gm.size === 1 ? 1 : gm.size <= 3 ? 0.6 : 0.3;
    const fit = 100 * (0.42 * fam.auto + 0.22 * predict + 0.18 * quick + 0.10 * oneOwner + 0.08 * clamp(monthsActive / 6, 0, 1));

    // --- effort & payback -------------------------------------------
    let tier = fam.tier;
    if (gm.size > 4 || cm.size > 14 || cv > 1.5) tier = tier === 'S' ? 'M' : 'L';
    if (n >= 10 && fam.tier === 'S' && gm.size === 1) tier = 'S';
    const buildH = cfg.build[tier];
    const recoverH = annualH * fam.auto * cfg.autoEff;
    const saving = recoverH * cfg.rate;
    const payback = recoverH > 0 ? (buildH / (recoverH / 12)) : Infinity;

    // --- what to actually do ----------------------------------------
    const severe = (p1p2 > 0.4 && isFinite(p50) && p50 > 8) || reopenRate > 0.25;
    let action, cls;
    if (staleDays > 120 && n < 10) { action = 'Watch — stopped recurring'; cls = ''; }
    else if (fam.id === 'noise' || (isFinite(p50) && p50 < 0.17 && n >= 8)) { action = 'Tune the alert'; cls = 'bad'; }
    else if (fam.id === 'app' && n >= 3) { action = 'Engineering fix'; cls = 'prob'; }
    else if (severe && fam.auto < 0.85) { action = 'Problem record — eliminate'; cls = 'prob'; }
    else if (reassignAvg >= 2 && n >= 5) { action = 'Fix routing first'; cls = 'prob'; }
    else if (fit >= 55 && n >= 4) { action = 'Automate'; cls = 'auto'; }
    else if (severe) { action = 'Problem record — eliminate'; cls = 'prob'; }
    else if (n >= 4 && toil >= 45) { action = 'Standardise runbook'; cls = 'toil'; }
    else { action = 'Monitor'; cls = ''; }

    out.push({
      cid, label, sig: sigText, family: fam, n, annualN, members: mem,
      p50, p90, cv, touchH, annualH, recoverH, saving, buildH, tier, payback,
      groups: gm, cis: cm, prios: pm, months: mm, closeCodes: cc,

/* decision quadrant: how often vs how long, bubble = hours a year */
function svgQuad(points) {
  const W = 720, H = 340, pl = 52, pr = 14, pt = 14, pb = 40;
  const iw = W - pl - pr, ih = H - pt - pb;
  const maxN = Math.max(2, ...points.map(p => p.n));
  const maxT = Math.max(0.5, ...points.map(p => isFinite(p.p50) ? p.p50 : 0.5));
  const maxR = Math.max(1, ...points.map(p => p.annualH));
  const lx = v => pl + (Math.log(v + 1) / Math.log(maxN + 1)) * iw;
  const ly = v => pt + ih - (Math.log((isFinite(v) ? v : 0.1) + 0.2) / Math.log(maxT + 0.2)) * ih;
  const midX = pl + iw * 0.42, midY = pt + ih * 0.5;
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '">';

  s += '<line class="gl" x1="' + pl + '" y1="' + midY + '" x2="' + (W - pr) + '" y2="' + midY + '"/>';

}

/* ---------- generic sortable table ---------- */
function table(id, cols, rows, opt) {

const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

/* store-only zip so a team can grab every report in one click */
function makeZip(files) {
  const enc = new TextEncoder(); const parts = []; const central = []; let off = 0;
  files.forEach(f => {
    const nb = enc.encode(f.name);
    const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
    const crc = crc32(data);
    const lh = new Uint8Array(30 + nb.length); const dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, 0, true); dv.setUint16(10, 0, true); dv.setUint16(12, 0x2821, true);
    dv.setUint32(14, crc, true); dv.setUint32(18, data.length, true); dv.setUint32(22, data.length, true);
    dv.setUint16(26, nb.length, true); dv.setUint16(28, 0, true);
    lh.set(nb, 30);
    parts.push(lh, data);
    const cd = new Uint8Array(46 + nb.length); const cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true); cv.setUint16(12, 0, true); cv.setUint16(14, 0x2821, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true);
    cv.setUint16(28, nb.length, true); cv.setUint32(42, off, true);
    cd.set(nb, 46);
    central.push(cd);
    off += lh.length + data.length;
  });

  ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, off, true);
  return new Blob(parts.concat(central, [end]), { type: 'application/zip' });
}

/* ---------- filtering ---------- */
function applyFilters() {
  const f = S.filters;
  const from = f.from ? parseDate(f.from) : null;
  const to = f.to ? new Date(parseDate(f.to).getTime() + 864e5 - 1) : null;
  const q = f.q.trim().toLowerCase();
  const G = new Set(f.group), P = new Set(f.priority.map(Number)), C = new Set(f.category), ST = new Set(f.state);
  return S.incidents.filter(x => {
    if (from && (!x.opened || x.opened < from)) return false;
    if (to && (!x.opened || x.opened > to)) return false;
    if (G.size && !G.has(x.group)) return false;
    if (P.size && !P.has(x.prio)) return false;
    if (C.size && !C.has(x.category)) return false;
    if (ST.size && !ST.has(x.state)) return false;
    if (f.flag === 'after' && !x.after) return false;
    if (f.flag === 'reopen' && !(x.reopen > 0)) return false;
    if (f.flag === 'breach' && x.breached !== true) return false;
    if (f.flag === 'open' && x.done) return false;
    if (f.flag === 'p12' && x.prio > 2) return false;
    if (q && !(x.short + ' ' + x.ci + ' ' + x.group + ' ' + x.id + ' ' + x.category + ' ' + x.closeCode).toLowerCase().includes(q)) return false;
    return true;
  });
}

function compute() {
  const list = applyFilters();
  const res = analyze(list);
  const factor = res.spanDays >= 25 ? 365 / res.spanDays : 1;
  const byCid = new Map();
  res.clusters.forEach(c => {
    byCid.set(c.cid, c);
    c.members.forEach(x => { x.touchH = c.touchH; x.fam = c.family; x.toil = c.toil; x.fit = c.fit; x.action = c.action; x.clabel = c.label; });
  });
  A = { list, clusters: res.clusters, byCid, spanDays: res.spanDays, factor, lastDate: res.lastDate };
  A.kpi = kpis();
  return A;
}

function kpis() {
  const L = A ? A.list : [];
  const list = L.length ? L : [];
  const mttrs = list.map(x => x.mttr).filter(v => v != null);
  const touch = sum(list.map(x => x.touchH || 0));
  const autoH = sum(list.map(x => (x.touchH || 0) * (x.fam ? x.fam.auto : 0.35) * S.cfg.autoEff));
  const toilInc = list.filter(x => (x.toil || 0) >= 55).length;
  return {
    n: list.length,
    resolved: list.filter(x => x.done).length,
    p50: median(mttrs), p90: quant(mttrs, 0.9),
    touchYr: touch * A.factor,
    autoYr: autoH * A.factor,
    savings: autoH * A.factor * S.cfg.rate,
    toilShare: list.length ? toilInc / list.length : 0,
    after: list.length ? list.filter(x => x.after).length / list.length : 0,
    reopen: list.length ? list.filter(x => x.reopen > 0).length / list.length : 0,
    breach: (() => { const k = list.filter(x => x.breached != null); return k.length ? k.filter(x => x.breached).length / k.length : null; })(),
    repeat: (() => { const big = A.clusters.filter(c => c.n >= 4); return list.length ? sum(big.map(c => c.n)) / list.length : 0; })(),
    sigs: A.clusters.length
  };
}

/* ---------- aggregation helper ---------- */
function aggBy(list, keyFn) {
  const m = new Map();
  list.forEach(x => {
    const k = keyFn(x) || '(none)';
    let o = m.get(k);
    if (!o) { o = { k, n: 0, mttrs: [], touch: 0, auto: 0, after: 0, reopen: 0, breachN: 0, breachD: 0, reassign: 0, p12: 0, fams: new Map(), sigs: new Set() }; m.set(k, o); }
    o.n++;
    if (x.mttr != null) o.mttrs.push(x.mttr);
    o.touch += x.touchH || 0;
    o.auto += (x.touchH || 0) * (x.fam ? x.fam.auto : .35) * S.cfg.autoEff;
    if (x.after) o.after++;
    if (x.reopen > 0) o.reopen++;
    if (x.breached != null) { o.breachD++; if (x.breached) o.breachN++; }
    o.reassign += x.reassign || 0;
    if (x.prio <= 2) o.p12++;
    if (x.fam) bump(o.fams, x.fam.label);
    o.sigs.add(x.cid);
  });
  const out = Array.from(m.values());
  out.forEach(o => {
    o.p50 = median(o.mttrs); o.p90 = quant(o.mttrs, 0.9);
    o.touchYr = o.touch * A.factor; o.autoYr = o.auto * A.factor;
    o.afterPct = o.after / o.n; o.reopenPct = o.reopen / o.n;
    o.breachPct = o.breachD ? o.breachN / o.breachD : null;
    o.reassignAvg = o.reassign / o.n;
    o.topFam = topN(o.fams, 1)[0] ? topN(o.fams, 1)[0][0] : '—';
    o.sigN = o.sigs.size;
    o.repeatRatio = o.n / Math.max(1, o.sigN);
  });
  return out;
}

/* ============================================================
   VIEW: problems & noise
   ============================================================ */
function vProblem() {
  const prob = A.clusters.filter(c => c.n >= 2 && (c.action.indexOf('Problem') === 0 || c.action === 'Engineering fix' || (c.p1p2 > 0.3 && c.annualH > 20)))
    .sort((a, b) => b.annualH - a.annualH);
  const noise = A.clusters.filter(c => c.family.id === 'noise' || (isFinite(c.p50) && c.p50 < 0.25 && c.n >= 5)).sort((a, b) => b.n - a.n);
  const churn = A.clusters.filter(c => c.reassignAvg >= 1.5 && c.n >= 3).sort((a, b) => b.reassignAvg * b.n - a.reassignAvg * a.n);
  const reop = A.clusters.filter(c => c.reopenRate > 0.1 && c.n >= 3).sort((a, b) => b.reopenRate * b.n - a.reopenRate * a.n);

  const base = [
    { k: 'label', label: 'Signature', cls: 'wrap', r: r => esc(r.label) },
    { k: 'n', label: 'Count', n: true, r: r => num(r.n) },
    { k: 'p50', label: 'Median', n: true, r: r => hrs(r.p50) },
    { k: 'annualH', label: 'h/yr', n: true, r: r => num(r.annualH) }
  ];
  const probCols = base.concat([
    { k: 'p1p2', label: 'P1/P2', n: true, r: r => pct(r.p1p2) },
    { k: 'reopenRate', label: 'Reopened', n: true, r: r => pct(r.reopenRate) },
    { k: 'owner', label: 'Owner', r: r => esc(topN(r.groups, 1)[0][0]), sv: r => topN(r.groups, 1)[0][0] }
  ]);
  const noiseCols = base.concat([
    { k: 'ci', label: 'Top system', r: r => esc(topN(r.cis, 1)[0][0]), sv: r => topN(r.cis, 1)[0][0] },
    { k: 'afterPct', label: 'Off-hrs', n: true, r: r => pct(r.afterPct) }
  ]);
  const churnCols = base.concat([
    { k: 'reassignAvg', label: 'Hops', n: true, r: r => dec(r.reassignAvg, 1) },
    { k: 'teams', label: 'Teams touched', n: true, r: r => r.groups.size, sv: r => r.groups.size }
  ]);
  const reopCols = base.concat([
    { k: 'reopenRate', label: 'Reopened', n: true, r: r => pct(r.reopenRate) },
    { k: 'owner', label: 'Owner', r: r => esc(topN(r.groups, 1)[0][0]), sv: r => topN(r.groups, 1)[0][0] }
  ]);

  const noiseInc = sum(noise.map(c => c.n));
  const offNoise = sum(noise.map(c => c.n * c.afterPct));

  return '<h2>Problems, noise and churn</h2>' +
    '<p class="lede">Not everything repetitive should be automated. Some of it should stop happening. These four lists separate work that needs a permanent fix from work that is just interruption, and from tickets that bounce between teams before anyone starts.</p>' +
    '<div class="grid g3" style="margin-bottom:12px">' +
    kpi('Problem candidates', num(prob.length), 'recurring, severe or reopening — needs root cause', 'var(--prob)') +
    kpi('Likely alert noise', num(noiseInc) + ' <small>tickets</small>', num(offNoise) + ' of them raised outside hours', 'var(--bad)') +
    kpi('Signatures that bounce', num(churn.length), 'routing or ownership is wrong', 'var(--toil)') +
    '</div>' +
    cardFlush('Problem records to raise', 'high impact, repeating — automating around these hides the cause', table('pr', probCols, prob, { sort: 'annualH' }), dlBtn('problem')) +
    '<div style="height:12px"></div>' +
    cardFlush('Alert noise to tune out', 'closed almost immediately or explicitly no-action', table('nz', noiseCols, noise, { sort: 'n' }), dlBtn('noise')) +
    '<div style="height:12px"></div>' +
    '<div class="grid g2">' +
    cardFlush('Routing churn', 'average hops before resolution', table('ch', churnCols, churn, { sort: 'reassignAvg', limit: 25 }), dlBtn('churn')) +
    cardFlush('Fixes that did not hold', 'reopen rate above 10%', table('ro', reopCols, reop, { sort: 'reopenRate', limit: 25 }), dlBtn('reopen')) +
    '</div>';
}

/* ============================================================
   VIEW: trends
   ============================================================ */
function vTrends() {
  const months = uniq(A.list.map(x => x.month).filter(Boolean)).sort();
  const byM = m => A.list.filter(x => x.month === m);
  const vol = months.map(m => byM(m).length);
  const mtt = months.map(m => { const v = byM(m).map(x => x.mttr).filter(x => x != null); return v.length ? median(v) : 0; });
  const aft = months.map(m => { const l = byM(m); return l.length ? l.filter(x => x.after).length / l.length * 100 : 0; });
  const p12 = months.map(m => byM(m).filter(x => x.prio <= 2).length);

  const heat = Array.from({ length: 7 }, () => new Array(24).fill(0));
  A.list.forEach(x => { if (x.dow != null && x.hour != null) heat[x.dow][x.hour]++; });

  // month over month movers by signature
  const movers = [];
  if (months.length >= 2) {
    const last = months[months.length - 1], prev = months[months.length - 2];
    A.clusters.forEach(c => {
      const a = c.months.get(last) || 0, b = c.months.get(prev) || 0;
      if (a + b >= 4) movers.push({ label: c.label, prev: b, last: a, delta: a - b, cid: c.cid, fam: c.family.label });
    });
    movers.sort((x, y) => Math.abs(y.delta) - Math.abs(x.delta));
  }
  const moverCols = [
    { k: 'label', label: 'Signature', cls: 'wrap', r: r => esc(r.label) },
    { k: 'fam', label: 'Type', r: r => '<span class="pill">' + esc(r.fam) + '</span>' },
    { k: 'prev', label: months[months.length - 2] || 'prev', n: true },
    { k: 'last', label: months[months.length - 1] || 'last', n: true },
    { k: 'delta', label: 'Change', n: true, r: r => '<span style="color:' + (r.delta > 0 ? 'var(--bad)' : 'var(--good)') + '">' + (r.delta > 0 ? '+' : '') + r.delta + '</span>' }
  ];

  const offCount = A.list.filter(x => x.after).length;
  const weekend = A.list.filter(x => x.dow === 0 || x.dow === 6).length;

  return '<h2>Trends</h2>' +
    '<p class="lede">Volume tells you whether the work is growing. The clock heatmap tells you what it costs people to be on call for it.</p>' +
    '<div class="grid g4" style="margin-bottom:12px">' +
    kpi('Months covered', months.length, (months[0] || '—') + ' → ' + (months[months.length - 1] || '—')) +
    kpi('Outside business hours', num(offCount), pct(offCount / Math.max(1, A.list.length)) + ' of all tickets', 'var(--toil)') +
    kpi('Weekend tickets', num(weekend), pct(weekend / Math.max(1, A.list.length)) + ' of all tickets') +
    kpi('Busiest hour', (() => { let bh = 0, bv = -1; for (let h = 0; h < 24; h++) { const v = sum(heat.map(r => r[h])); if (v > bv) { bv = v; bh = h; } } return bh + ':00'; })(), 'peak arrival time') +
    '</div>' +
    card('When incidents arrive', 'amber = outside your business hours', svgHeat(heat) +
      '<p class="hint">Business hours are ' + S.cfg.bhStart + ':00–' + S.cfg.bhEnd + ':00, Monday to Friday. Change them in Setup.</p>') +
    '<div style="height:12px"></div>' +
    '<div class="grid g2">' +
    card('Volume and severity by month', '', svgLine(months, [
      { name: 'All incidents', values: vol, color: 'var(--info)', area: true },
      { name: 'P1 + P2', values: p12, color: 'var(--bad)' }
    ], { h: 200 })) +
    card('Median resolve time and off-hours share', 'hours / percent', svgLine(months, [
      { name: 'Median hours', values: mtt, color: 'var(--toil)' },
      { name: 'Off-hours %', values: aft, color: 'var(--prob)' }
    ], { h: 200 })) +
    '</div>' +
    '<div style="height:12px"></div>' +
    cardFlush('What changed last month', 'signatures with the biggest swing', table('mv', moverCols, movers, { sort: 'delta', limit: 20 }), dlBtn('months', 'Download monthly CSV'));
}

    { k: 'flags', label: 'Flags', r: r => [r.after ? '<span class="pill toil">off-hrs</span>' : '', r.reopen > 0 ? '<span class="pill bad">reopened</span>' : '', r.breached === true ? '<span class="pill bad">breach</span>' : '', r.reassign >= 3 ? '<span class="pill">' + r.reassign + ' hops</span>' : ''].join(' '), sv: r => (r.after ? 1 : 0) + (r.reopen > 0 ? 2 : 0) }
  ];
  return '<h2>Incidents</h2>' +
    '<p class="lede">Every ticket in the current filter, enriched with its signature group, work type, toil score and recommended action. Download gives you the original columns plus everything ToilLens worked out.</p>' +
    cardFlush('Filtered incidents', num(A.list.length) + ' rows', table('ex', cols, A.list, { sort: 'opened' }), dlBtn('incidents', 'Download enriched CSV'));
}

const CLUSTER_COLS = ['Signature', 'Normalised signature', 'Work type', 'Incidents', 'Est. per year', 'Months active',
  'First seen', 'Last seen', 'Median hours', 'P90 hours', 'Hands-on hours each', 'Hands-on hours per year',
  'Recoverable hours per year', 'Value per year', 'Toil score', 'Automation fit', 'Effort tier', 'Build hours',
  'Payback months', 'Avg reassignments', 'Reopen rate', 'Off-hours share', 'P1/P2 share', 'Teams', 'Systems',
  'Close codes', 'Recommended action', 'Recommended fix'];

const clusterRow = c => [c.label, c.sig, c.family.label, c.n, Math.round(c.annualN), c.monthsActive,
  c.first ? ymd(c.first) : '', c.last ? ymd(c.last) : '', isFinite(c.p50) ? c.p50.toFixed(2) : '', isFinite(c.p90) ? c.p90.toFixed(2) : '',
  c.touchH.toFixed(2), Math.round(c.annualH), Math.round(c.recoverH), Math.round(c.saving), c.toil, c.fit, c.tier, c.buildH,
  isFinite(c.payback) ? c.payback.toFixed(1) : '', c.reassignAvg.toFixed(2), (c.reopenRate * 100).toFixed(1) + '%',
  (c.afterPct * 100).toFixed(1) + '%', (c.p1p2 * 100).toFixed(1) + '%', topStr(c.groups, 4), topStr(c.cis, 4),
  topStr(c.closeCodes, 3), c.action, c.family.fix];

const AGG_COLS = ['Name', 'Incidents', 'Distinct signatures', 'Repeat ratio', 'Median hours', 'P90 hours',
  'Hands-on hours per year', 'Automatable hours per year', 'Off-hours share', 'Reopen rate', 'SLA breach rate', 'Avg reassignments', 'Mostly'];
const aggRow = o => [o.k, o.n, o.sigN, o.repeatRatio.toFixed(1), isFinite(o.p50) ? o.p50.toFixed(2) : '', isFinite(o.p90) ? o.p90.toFixed(2) : '',
  Math.round(o.touchYr), Math.round(o.autoYr), (o.afterPct * 100).toFixed(1) + '%', (o.reopenPct * 100).toFixed(1) + '%',
  o.breachPct == null ? '' : (o.breachPct * 100).toFixed(1) + '%', o.reassignAvg.toFixed(2), o.topFam];

function incidentTable() {
  const extra = ['Signature group', 'Normalised signature', 'Work type', 'Toil score', 'Automation fit',
    'Recommended action', 'Hands-on hours', 'Resolve hours', 'Off hours', 'Month', 'Weekday', 'Hour'];
  const headers = S.headers.concat(extra);
  const rows = A.list.map(x => x.raw.slice(0, S.headers.length).concat([
    x.clabel || '', x.nt || '', x.fam ? x.fam.label : '', x.toil || 0, x.fit || 0, x.action || '',
    (x.touchH || 0).toFixed(2), x.mttr == null ? '' : x.mttr.toFixed(2), x.after ? 'yes' : 'no',
    x.month, x.dow == null ? '' : DAYNAMES[x.dow], x.hour == null ? '' : x.hour
  ]));
  return { headers, rows };
}

function monthTable() {
  const months = uniq(A.list.map(x => x.month).filter(Boolean)).sort();
  const rows = months.map(m => {
    const l = A.list.filter(x => x.month === m);
    const v = l.map(x => x.mttr).filter(x => x != null);
    return [m, l.length, l.filter(x => x.done).length, isFinite(median(v)) ? median(v).toFixed(2) : '',
      isFinite(quant(v, 0.9)) ? quant(v, 0.9).toFixed(2) : '',
      (l.filter(x => x.after).length / l.length * 100).toFixed(1) + '%',
      (l.filter(x => x.reopen > 0).length / l.length * 100).toFixed(1) + '%',
      l.filter(x => x.prio <= 2).length, Math.round(sum(l.map(x => x.touchH || 0))), uniq(l.map(x => x.cid)).length];
  });
  return { headers: ['Month', 'Incidents', 'Resolved', 'Median hours', 'P90 hours', 'Off-hours share', 'Reopen rate', 'P1+P2', 'Hands-on hours', 'Distinct signatures'], rows };
}

  L.push('## Signature');
  L.push('```');
  L.push(c.sig);
  L.push('```');
  L.push('Placeholders such as `<host>`, `<n>` and `<date>` are the parts that vary between tickets. Everything else is constant, which is what makes this automatable.');
  L.push('');
  L.push('## Why it is on the list');
  L.push('');
  L.push('| Measure | Value |');
  L.push('| --- | --- |');
  L.push('| Occurrences in scope | ' + c.n + ' (about ' + Math.round(c.annualN) + ' a year) |');
  L.push('| Active in | ' + c.monthsActive + ' distinct months |');
  L.push('| Median resolve time | ' + hrs(c.p50) + ' (p90 ' + hrs(c.p90) + ') |');
  L.push('| Hands-on time each | ' + hrs(c.touchH) + ' |');
  L.push('| Hands-on hours a year | ' + Math.round(c.annualH) + ' |');
  L.push('| Recoverable by automation | ' + Math.round(c.recoverH) + ' h/yr (' + money(c.saving) + ') |');
  L.push('| Toil score / automation fit | ' + c.toil + ' / ' + c.fit + ' |');
  L.push('| Raised outside business hours | ' + pct(c.afterPct) + ' |');
  L.push('| Reopened | ' + pct(c.reopenRate) + ' · average ' + dec(c.reassignAvg, 1) + ' reassignments |');
  L.push('| Build estimate | ' + c.tier + ', roughly ' + c.buildH + ' hours |');
  L.push('| Payback | ' + (isFinite(c.payback) ? dec(c.payback, 1) + ' months' : 'n/a') + ' |');
  L.push('');
  L.push('## Who and what is involved');
  L.push('');
  L.push('- **Teams:** ' + (topStr(c.groups, 5) || 'not recorded'));
  L.push('- **Systems:** ' + (topStr(c.cis, 6) || 'not recorded'));
  L.push('- **Close codes:** ' + (topStr(c.closeCodes, 4) || 'not recorded'));
  L.push('- **Priority mix:** ' + topN(c.prios, 5).map(p => (PRIO_LABEL[p[0]] || p[0]) + ': ' + p[1]).join(', '));
  L.push('');
  L.push('## Recommended approach');
  L.push('');
  L.push(c.family.fix);
  L.push('');
  L.push('## Suggested acceptance criteria');
  L.push('');
  L.push('- Detection fires from the same signal that raises the ticket today, not from the ticket itself.');
  L.push('- The action is idempotent and safe to run twice.');
  L.push('- A guard rail stops it after ' + (c.n >= 20 ? '3' : '2') + ' attempts in a rolling window and escalates to a human.');
  L.push('- Every run writes back to the incident record so the audit trail survives.');
  L.push('- Success measured as a drop in this signature below ' + Math.max(1, Math.round(c.n * 0.2)) + ' occurrences per equivalent period.');
  if (c.family.id === 'app') L.push('- Note: this looks like a product defect. Automating the workaround will hide it — raise it with engineering as well.');
  L.push('');
  L.push('## Sample incidents');
  L.push('');
  L.push('| Number | Opened | Resolve | Team | Description |');
  L.push('| --- | --- | --- | --- | --- |');

function summaryMD() {
  const k = A.kpi;

  const L = [];
  L.push('# Incident and toil review — ' + stamp());
  L.push('');
  L.push('Scope: **' + num(k.n) + ' incidents** across ' + Math.round(A.spanDays) + ' days, collapsing into **' + num(k.sigs) + ' distinct signatures**.');
  L.push('');
  L.push('## Headline');
  L.push('');
  L.push('- **' + pct(k.repeat) + '** of tickets are repeat work — a signature seen four or more times.');
  L.push('- Hands-on effort runs at about **' + num(k.touchYr) + ' hours a year** (' + dec(k.touchYr / 1600, 1) + ' full-time engineers).');
  L.push('- Roughly **' + num(k.autoYr) + ' hours a year** (' + money(k.savings) + ') is recoverable through automation.');

  L.push('## Top ten things to build');

      ' | ' + Math.round(c.recoverH) + ' h | ' + money(c.saving) + ' | ' + c.tier + ' (' + c.buildH + 'h) | ' +

    prob.forEach(c => L.push('- **' + String(c.label).slice(0, 80) + '** — ' + c.n + ' incidents, median ' + hrs(c.p50) + ', ' + pct(c.reopenRate) + ' reopened. ' + c.family.fix));

  L.push('## Where the load sits');
  L.push('');
  L.push('| Team | Tickets | Repeat | Hours/yr | Automatable | Off-hours |');
  L.push('| --- | --- | --- | --- | --- | --- |');
  g.forEach(o => L.push('| ' + o.k + ' | ' + o.n + ' | ' + dec(o.repeatRatio, 1) + '× | ' + Math.round(o.touchYr) + ' | ' + Math.round(o.autoYr) + ' | ' + pct(o.afterPct) + ' |'));
  L.push('');
  L.push('---');
  L.push('');
  L.push('Assumptions: hands-on time is ' + Math.round(S.cfg.handsOn * 100) + '% of ticket duration (floor ' + S.cfg.minTouch + ' min, cap ' + S.cfg.capTouch + ' h); engineer cost ' + money(S.cfg.rate) + '/hour; automation removes ' + Math.round(S.cfg.autoEff * 100) + '% of the work it covers. Change these in Setup and regenerate.');
  return L.join('\n');
}
