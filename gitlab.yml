"""
DataStage View-to-Base-Table Column Mapper
───────────────────────────────────────────
Takes the CSV output from the DataStage XML parser and enriches it with
two additional columns:
  - Base Table Name   : the underlying table the view column comes from
  - Base Column Name  : the actual column name in the base table

It does this by parsing CREATE VIEW DDL statements from a master
spreadsheet to build a mapping of view_name.column → base_table.column.

Usage:
  1. Update the 3 file paths below
  2. Run:  python3 datastage_ddl_mapper.py

Master DDL spreadsheet format (from DBMS_METADATA.GET_DDL):
  - Column A contains the full DDL text per row, one view per row
  - Example:
      CREATE OR REPLACE FORCE EDITIONABLE VIEW IODS.ADDR_RV
      (ADDR_ID, ADDR_LINE1, ...) AS
      SELECT t1.ADDR_ID, t1.ADDR_LINE1, ...
      FROM IODS.ADDRESS t1
      JOIN IODS.CUSTOMER t2 ON ...
"""

import csv
import re
from pathlib import Path
from typing import Optional

# ── Try to import openpyxl / pandas for reading Excel; fall back to csv ──────
try:
    from openpyxl import load_workbook
    HAS_OPENPYXL = True
except ImportError:
    HAS_OPENPYXL = False

try:
    import pandas as pd
    HAS_PANDAS = True
except ImportError:
    HAS_PANDAS = False


# ── Configuration ─────────────────────────────────────────────────────────────
PARSER_CSV       = "./datastage_output.csv"          # Output from the XML parser
MASTER_DDL_FILE  = "./master_ddl.xlsx"               # Master DDL spreadsheet (.xlsx or .csv)
MASTER_DDL_SHEET = "Export Worksheet"                 # Sheet name (ignored if .csv)
OUTPUT_CSV       = "./datastage_output_enriched.csv"
OUTPUT_XLSX      = "./datastage_output_enriched.xlsx"

# The view names in the parser CSV use DataStage parameter syntax:
#   #$ORA_IODS_SCHEMA#.iods_ast_v
# The DDLs use the actual schema name:
#   IODS.IODS_AST_V  or  IODS.IODS_AST_RV
# This mapping strips the DS parameter prefix for matching.
# Add entries here if your DS parameters map to specific Oracle schemas:
DS_PARAM_TO_SCHEMA = {
    "ORA_IODS_SCHEMA": "IODS",
    "ORA_ALFA_ODS_SCHEMA": "IODS",
    # Add more as needed
}
# ──────────────────────────────────────────────────────────────────────────────


# ═════════════════════════════════════════════════════════════════════════════
#  Read master DDL file
# ═════════════════════════════════════════════════════════════════════════════

def read_master_ddls(file_path: str, sheet_name: str = "Export Worksheet") -> list[str]:
    """
    Read the master DDL file.  Returns a list of DDL strings (one per view).
    Supports .xlsx, .xls, and .csv files.
    Column A of each row contains the full DDL text.
    """
    path = Path(file_path)
    ddls: list[str] = []

    if path.suffix.lower() in (".xlsx", ".xls"):
        if HAS_OPENPYXL:
            wb = load_workbook(str(path), read_only=True, data_only=True)
            # Try requested sheet, fall back to first sheet
            if sheet_name in wb.sheetnames:
                ws = wb[sheet_name]
            else:
                ws = wb[wb.sheetnames[0]]
                print(f"  [INFO] Sheet '{sheet_name}' not found, using '{wb.sheetnames[0]}'")

            for row in ws.iter_rows(min_row=1, max_col=1, values_only=True):
                cell_val = row[0]
                if cell_val and isinstance(cell_val, str):
                    text = cell_val.strip()
                    if text.upper().startswith("CREATE"):
                        ddls.append(text)
            wb.close()
        elif HAS_PANDAS:
            df = pd.read_excel(str(path), sheet_name=sheet_name, header=None, dtype=str)
            for val in df.iloc[:, 0].dropna():
                text = str(val).strip()
                if text.upper().startswith("CREATE"):
                    ddls.append(text)
        else:
            print("[ERROR] Install openpyxl or pandas to read .xlsx files:")
            print("        pip install openpyxl")
            return []
    elif path.suffix.lower() == ".csv":
        with path.open("r", encoding="utf-8", errors="replace") as f:
            reader = csv.reader(f)
            for row in reader:
                if row and row[0].strip().upper().startswith("CREATE"):
                    ddls.append(row[0].strip())
    else:
        # Try reading as plain text (one DDL per line, or separated by semicolons)
        content = path.read_text(encoding="utf-8", errors="replace")
        # Split on semicolons or on CREATE keywords
        parts = re.split(r";\s*(?=CREATE)", content, flags=re.IGNORECASE)
        for part in parts:
            text = part.strip().rstrip(";").strip()
            if text.upper().startswith("CREATE"):
                ddls.append(text)

    print(f"  Read {len(ddls)} CREATE VIEW DDL(s) from {path.name}")
    return ddls


# ═════════════════════════════════════════════════════════════════════════════
#  Parse a single CREATE VIEW DDL
# ═════════════════════════════════════════════════════════════════════════════

def parse_create_view_ddl(ddl: str) -> Optional[dict]:
    """
    Parse a CREATE VIEW DDL and extract:
      - view_schema, view_name
      - For each view column: the base table and base column it maps to

    Returns:
      {
        "view_schema": "IODS",
        "view_name": "ADDR_RV",
        "view_fqn": "IODS.ADDR_RV",
        "columns": {
            "ADDR_ID":    {"base_table": "IODS.ADDRESS", "base_column": "ADDR_ID"},
            "ADDR_LINE1": {"base_table": "IODS.ADDRESS", "base_column": "ADDR_LINE1"},
            ...
        }
      }
    or None if parsing fails.

    DDL format:
      CREATE OR REPLACE [FORCE] [EDITIONABLE|EDITIONING] VIEW schema.view_name
      (col1, col2, col3, ...) AS
      SELECT expr1, expr2, expr3, ...
      FROM schema.table1 alias1
      [JOIN schema.table2 alias2 ON ...]
      [WHERE ...]
    """

    # ── Step 1: Extract view name ────────────────────────────────────────────
    view_match = re.search(
        r"VIEW\s+"
        r"(?:\"([^\"]+)\"|([A-Za-z_][\w$#]*))"     # schema (quoted or plain)
        r"\s*\.\s*"
        r"(?:\"([^\"]+)\"|([A-Za-z_][\w$#]*))",     # view name
        ddl, re.IGNORECASE,
    )
    if not view_match:
        # Try without schema
        view_match = re.search(
            r"VIEW\s+(?:\"([^\"]+)\"|([A-Za-z_][\w$#]*))\s*\(",
            ddl, re.IGNORECASE,
        )
        if not view_match:
            return None
        view_schema = ""
        view_name = (view_match.group(1) or view_match.group(2)).upper()
    else:
        view_schema = (view_match.group(1) or view_match.group(2) or "").upper()
        view_name = (view_match.group(3) or view_match.group(4) or "").upper()

    view_fqn = f"{view_schema}.{view_name}" if view_schema else view_name

    # ── Step 2: Extract view column list from parentheses after view name ────
    # Find: VIEW schema.name (COL1, COL2, ...) AS
    col_list_match = re.search(
        r"VIEW\s+[^\(]+\(\s*(.*?)\s*\)\s*AS\b",
        ddl, re.IGNORECASE | re.DOTALL,
    )
    view_columns: list[str] = []
    if col_list_match:
        col_block = col_list_match.group(1)
        # Split on commas, strip quotes and whitespace
        for c in col_block.split(","):
            col = c.strip().strip('"').strip()
            if col:
                view_columns.append(col.upper())

    # ── Step 3: Extract SELECT expressions ───────────────────────────────────
    as_match = re.search(r"\)\s*AS\s+", ddl, re.IGNORECASE)
    if not as_match:
        # Try: AS SELECT (no parenthesized column list)
        as_match = re.search(r"\bAS\s+(?=SELECT\b)", ddl, re.IGNORECASE)
    if not as_match:
        return {
            "view_schema": view_schema,
            "view_name": view_name,
            "view_fqn": view_fqn,
            "columns": {},
        }

    select_part = ddl[as_match.end():].strip()

    # Extract the SELECT ... FROM portion
    # Handle nested subqueries by finding the main FROM
    select_exprs_match = re.search(
        r"SELECT\s+(.*?)\s+FROM\b",
        select_part, re.IGNORECASE | re.DOTALL,
    )
    if not select_exprs_match:
        return {
            "view_schema": view_schema,
            "view_name": view_name,
            "view_fqn": view_fqn,
            "columns": {},
        }

    select_block = select_exprs_match.group(1).strip()
    select_block = re.sub(r"^(DISTINCT|ALL|UNIQUE)\s+", "", select_block, flags=re.IGNORECASE)

    # Split SELECT expressions on commas (respecting parenthesis depth)
    select_exprs: list[str] = []
    depth = 0
    current: list[str] = []
    for ch in select_block:
        if ch == "(":
            depth += 1
            current.append(ch)
        elif ch == ")":
            depth -= 1
            current.append(ch)
        elif ch == "," and depth == 0:
            select_exprs.append("".join(current).strip())
            current = []
        else:
            current.append(ch)
    if current:
        select_exprs.append("".join(current).strip())

    # ── Step 4: Extract FROM/JOIN table aliases ──────────────────────────────
    from_part = select_part[select_exprs_match.end():]
    # Include the "FROM" keyword for parsing
    from_part = "FROM " + from_part

    alias_to_table: dict[str, str] = {}   # alias (upper) → full table name

    alias_pattern = re.compile(
        r"(?:FROM|JOIN)\s+"
        r"("
            r"(?:\"[^\"]+\"|[A-Za-z_][\w$#]*)"
            r"(?:\s*\.\s*(?:\"[^\"]+\"|[A-Za-z_][\w$#]*))*"
        r")"
        r"(?:\s+(?:AS\s+)?([A-Za-z_][\w$#]*))?",
        re.IGNORECASE,
    )
    first_table = None
    for m in alias_pattern.finditer(from_part):
        table_name = re.sub(r"\s*\.\s*", ".", m.group(1)).strip().strip('"').upper()
        alias = (m.group(2) or "").strip().upper()

        # Skip SQL keywords that might be captured as aliases
        if alias and alias in (
            "ON", "WHERE", "AND", "OR", "LEFT", "RIGHT", "INNER", "OUTER",
            "CROSS", "FULL", "NATURAL", "JOIN", "SET", "GROUP", "ORDER",
            "HAVING", "UNION", "INTERSECT", "MINUS", "EXCEPT",
        ):
            alias = ""

        if first_table is None:
            first_table = table_name

        if alias:
            alias_to_table[alias] = table_name
        else:
            # Use the table name itself (last part) as implicit alias
            short = table_name.split(".")[-1].upper()
            alias_to_table[short] = table_name

    # ── Step 5: Map each SELECT expression to base table + column ────────────
    columns: dict[str, dict] = {}

    for i, expr in enumerate(select_exprs):
        expr = expr.strip()
        if not expr:
            continue

        # Determine the view column name for this position
        if i < len(view_columns):
            v_col = view_columns[i]
        else:
            # Infer from expression alias or last identifier
            v_col = _infer_column_name(expr).upper()

        if not v_col:
            continue

        # Parse the expression to find base_table.base_column
        base_table, base_column = _resolve_expr_to_base(
            expr, alias_to_table, first_table
        )

        columns[v_col] = {
            "base_table": base_table,
            "base_column": base_column,
        }

    return {
        "view_schema": view_schema,
        "view_name": view_name,
        "view_fqn": view_fqn,
        "columns": columns,
    }


def _infer_column_name(expr: str) -> str:
    """Infer the output column name from a SELECT expression."""
    # Explicit alias: ... AS alias
    m = re.search(r"\bAS\s+\"?(\w+)\"?\s*$", expr, re.IGNORECASE)
    if m:
        return m.group(1)

    # Qualified: alias.column → column
    m = re.match(r"(?:[\w$.#\"]+\.)+(\w+)\s*$", expr.strip())
    if m:
        return m.group(1)

    # Simple identifier
    m = re.match(r"^(\w+)\s*$", expr.strip())
    if m:
        return m.group(1)

    return ""


def _resolve_expr_to_base(
    expr: str,
    alias_to_table: dict[str, str],
    first_table: Optional[str],
) -> tuple[str, str]:
    """
    Given a SELECT expression like "t1.ADDR_ID" or "alias.col AS output_col",
    resolve it to (base_table, base_column).
    """
    expr = expr.strip()

    # Strip trailing alias: expr AS alias
    core = re.sub(r"\s+AS\s+\S+\s*$", "", expr, flags=re.IGNORECASE).strip()

    # Qualified: alias.column  or  schema.table.column
    qual_match = re.match(
        r"(?:\"?(\w+)\"?)\s*\.\s*(?:\"?(\w+)\"?)\s*$",
        core,
    )
    if qual_match:
        qualifier = qual_match.group(1).upper()
        col_name = qual_match.group(2).upper()

        # Look up the qualifier as an alias
        if qualifier in alias_to_table:
            return (alias_to_table[qualifier], col_name)
        else:
            # Qualifier might be a table name directly
            return (qualifier, col_name)

    # Three-part: schema.table.column
    qual3_match = re.match(
        r"(?:\"?(\w+)\"?)\s*\.\s*(?:\"?(\w+)\"?)\s*\.\s*(?:\"?(\w+)\"?)\s*$",
        core,
    )
    if qual3_match:
        schema = qual3_match.group(1).upper()
        table = qual3_match.group(2).upper()
        col = qual3_match.group(3).upper()
        return (f"{schema}.{table}", col)

    # Simple column (no alias prefix) → associate with first table
    simple_match = re.match(r"^\"?(\w+)\"?\s*$", core)
    if simple_match:
        col_name = simple_match.group(1).upper()
        return (first_table or "", col_name)

    # Complex expression (function call, etc.) → can't resolve base table
    return ("", core.upper())


# ═════════════════════════════════════════════════════════════════════════════
#  Build the lookup from all DDLs
# ═════════════════════════════════════════════════════════════════════════════

def build_view_column_lookup(
    ddls: list[str],
) -> dict[str, dict[str, dict]]:
    """
    Parse all DDLs and build a lookup:
      {
        "VIEW_NAME_UPPER": {
            "COL_NAME_UPPER": {"base_table": "...", "base_column": "..."},
            ...
        },
        "SCHEMA.VIEW_NAME_UPPER": { ... },   # also keyed by FQN
      }
    Multiple keys are registered for flexible matching.
    """
    lookup: dict[str, dict[str, dict]] = {}
    parsed_count = 0

    for ddl in ddls:
        result = parse_create_view_ddl(ddl)
        if not result or not result["columns"]:
            continue

        parsed_count += 1
        cols = result["columns"]

        # Register under multiple keys for flexible matching
        keys_to_register = set()
        keys_to_register.add(result["view_name"])
        if result["view_fqn"]:
            keys_to_register.add(result["view_fqn"])
        # Also without schema prefix
        short = result["view_name"].split(".")[-1]
        keys_to_register.add(short)

        for key in keys_to_register:
            if key:
                lookup[key.upper()] = cols

    print(f"  Successfully parsed {parsed_count} view DDL(s) into column mappings")
    return lookup


# ═════════════════════════════════════════════════════════════════════════════
#  Normalize a view name from the parser CSV for lookup
# ═════════════════════════════════════════════════════════════════════════════

def normalize_view_name(raw_view_name: str) -> list[str]:
    """
    Given a view name from the parser CSV like:
      #$ORA_IODS_SCHEMA#.iods_ast_v
    Return a list of possible lookup keys:
      ["IODS.IODS_AST_V", "IODS_AST_V", "#$ORA_IODS_SCHEMA#.IODS_AST_V"]
    """
    if not raw_view_name:
        return []

    raw = raw_view_name.strip()
    keys: list[str] = []

    # Handle DataStage parameter: #$PARAM#.view_name
    ds_match = re.match(r"#\$(\w+)#\s*\.\s*(.*)", raw)
    if ds_match:
        param_name = ds_match.group(1).upper()
        view_part = ds_match.group(2).strip().upper()

        # Try mapping the DS parameter to a real schema
        if param_name in DS_PARAM_TO_SCHEMA:
            schema = DS_PARAM_TO_SCHEMA[param_name]
            keys.append(f"{schema}.{view_part}")

        keys.append(view_part)
        keys.append(raw.upper())
    else:
        # Regular name: SCHEMA.VIEW or just VIEW
        keys.append(raw.upper())
        parts = raw.split(".")
        if len(parts) >= 2:
            keys.append(parts[-1].upper())  # just the view name

    return keys


# ═════════════════════════════════════════════════════════════════════════════
#  Main: enrich the parser CSV
# ═════════════════════════════════════════════════════════════════════════════

def main():
    parser_csv_path = Path(PARSER_CSV)
    master_ddl_path = Path(MASTER_DDL_FILE)
    output_csv_path = Path(OUTPUT_CSV)

    if not parser_csv_path.exists():
        print(f"[ERROR] Parser CSV not found: {parser_csv_path}")
        return
    if not master_ddl_path.exists():
        print(f"[ERROR] Master DDL file not found: {master_ddl_path}")
        return

    # ── Read master DDLs ─────────────────────────────────────────────────────
    print("Reading master DDL file...")
    ddls = read_master_ddls(str(master_ddl_path), MASTER_DDL_SHEET)
    if not ddls:
        print("[ERROR] No DDLs found in master file")
        return

    # ── Build lookup ─────────────────────────────────────────────────────────
    print("Parsing DDLs...")
    lookup = build_view_column_lookup(ddls)
    if not lookup:
        print("[WARN] No column mappings could be parsed from DDLs")

    # ── Read parser CSV and enrich ───────────────────────────────────────────
    # ── Read parser CSV rows ────────────────────────────────────────────────
    print(f"Reading parser CSV: {parser_csv_path}")
    all_input_rows: list[dict] = []
    with parser_csv_path.open("r", encoding="utf-8") as f:
        reader = csv.DictReader(f)
        for row in reader:
            all_input_rows.append(dict(row))

    # ── Group rows by stage (non-empty Job Name starts a group) ──────────
    groups: list[list[dict]] = []
    for row in all_input_rows:
        if row.get("Job/Sequence Name", "").strip():
            groups.append([row])
        elif groups:
            groups[-1].append(row)
        else:
            groups.append([row])

    # ── Enrich each group ────────────────────────────────────────────────
    enriched_rows: list[dict] = []
    match_count = 0
    miss_count = 0

    output_headers = [
        "Job/Sequence Name",
        "Stage Name",
        "SQL Query",
        "View Name",
        "View Column",
        "Base Table Name",
        "Base Column Name",
    ]

    for group in groups:
        # Collect ALL view names in this stage group
        group_views: list[str] = []
        for row in group:
            vn = row.get("View Name", "").strip()
            if vn:
                group_views.append(vn)

        # Build a list of all column maps for this group's views
        group_col_maps: list[dict[str, dict]] = []
        for vn in group_views:
            possible_keys = normalize_view_name(vn)
            for key in possible_keys:
                if key in lookup:
                    group_col_maps.append(lookup[key])
                    break

        # Enrich each row
        for row in group:
            view_column = row.get("View Column", "").strip()
            base_table = ""
            base_column = ""

            if view_column:
                col_upper = view_column.upper()

                # First try: the view on the same row
                vn = row.get("View Name", "").strip()
                if vn:
                    possible_keys = normalize_view_name(vn)
                    for key in possible_keys:
                        if key in lookup and col_upper in lookup[key]:
                            base_table = lookup[key][col_upper]["base_table"]
                            base_column = lookup[key][col_upper]["base_column"]
                            break

                # Second try: search ALL views in this stage group
                if not base_table:
                    for col_map in group_col_maps:
                        if col_upper in col_map:
                            base_table = col_map[col_upper]["base_table"]
                            base_column = col_map[col_upper]["base_column"]
                            break

                if base_table:
                    match_count += 1
                elif view_column:
                    miss_count += 1

            enriched_rows.append({
                "Job/Sequence Name": row.get("Job/Sequence Name", ""),
                "Stage Name":        row.get("Stage Name", ""),
                "SQL Query":         row.get("SQL Query", ""),
                "View Name":         row.get("View Name", ""),
                "View Column":       view_column,
                "Base Table Name":   base_table,
                "Base Column Name":  base_column,
            })

    print(f"\nMapping results:")
    print(f"  Matched:   {match_count}")
    print(f"  Unmatched: {miss_count}")
    print(f"  Total rows: {len(enriched_rows)}")

    # ── Write enriched CSV ───────────────────────────────────────────────────
    with output_csv_path.open("w", newline="", encoding="utf-8") as f:
        writer = csv.DictWriter(f, fieldnames=output_headers)
        writer.writeheader()
        writer.writerows(enriched_rows)
    print(f"\nEnriched CSV written to: {output_csv_path}")

    # ── Write enriched Excel with merged cells ───────────────────────────────
    try:
        _write_enriched_excel(enriched_rows, output_headers, str(OUTPUT_XLSX))
        print(f"Enriched Excel written to: {OUTPUT_XLSX}")
    except ImportError:
        print("[INFO] Install openpyxl for Excel output: pip install openpyxl")


def _write_enriched_excel(rows: list[dict], headers: list[str], output_path: str):
    """Write enriched output as .xlsx with merged cells for Job/Stage/SQL."""
    from openpyxl import Workbook
    from openpyxl.styles import Font, Alignment, PatternFill, Border, Side

    wb = Workbook()
    ws = wb.active
    ws.title = "enriched_output"

    header_font = Font(name="Arial", bold=True, size=11, color="FFFFFF")
    header_fill = PatternFill("solid", fgColor="4472C4")
    header_align = Alignment(horizontal="center", vertical="center", wrap_text=True)
    data_align = Alignment(horizontal="left", vertical="center", wrap_text=True)
    thin_border = Border(
        left=Side(style="thin"), right=Side(style="thin"),
        top=Side(style="thin"), bottom=Side(style="thin"),
    )

    for col_idx, header in enumerate(headers, 1):
        cell = ws.cell(row=1, column=col_idx, value=header)
        cell.font = header_font
        cell.fill = header_fill
        cell.alignment = header_align
        cell.border = thin_border

    # Identify groups (consecutive rows for same stage)
    groups: list[tuple[int, int]] = []
    i = 0
    while i < len(rows):
        count = 1
        while (i + count < len(rows)
               and rows[i + count]["Job/Sequence Name"] == ""):
            count += 1
        groups.append((i, count))
        i += count

    excel_row = 2
    for start_idx, count in groups:
        first = rows[start_idx]

        for offset in range(count):
            r = excel_row + offset
            row_data = rows[start_idx + offset]

            # Columns D-G: one value per row
            for col_idx, field in [(4, "View Name"), (5, "View Column"),
                                    (6, "Base Table Name"), (7, "Base Column Name")]:
                cell = ws.cell(row=r, column=col_idx, value=row_data[field])
                cell.alignment = data_align
                cell.border = thin_border

        # Columns A-C: write in first row, merge if multiple rows
        ws.cell(row=excel_row, column=1, value=first["Job/Sequence Name"])
        ws.cell(row=excel_row, column=2, value=first["Stage Name"])
        ws.cell(row=excel_row, column=3, value=first["SQL Query"])

        for col in range(1, 4):
            cell = ws.cell(row=excel_row, column=col)
            cell.alignment = Alignment(horizontal="left", vertical="center", wrap_text=True)
            cell.border = thin_border

        if count > 1:
            for col in range(1, 4):
                ws.merge_cells(
                    start_row=excel_row, start_column=col,
                    end_row=excel_row + count - 1, end_column=col,
                )
                ws.cell(row=excel_row, column=col).alignment = Alignment(
                    horizontal="left", vertical="center", wrap_text=True
                )
            for offset in range(count):
                for col in range(1, 8):
                    ws.cell(row=excel_row + offset, column=col).border = thin_border

        excel_row += count

    ws.column_dimensions["A"].width = 28
    ws.column_dimensions["B"].width = 30
    ws.column_dimensions["C"].width = 50
    ws.column_dimensions["D"].width = 42
    ws.column_dimensions["E"].width = 25
    ws.column_dimensions["F"].width = 42
    ws.column_dimensions["G"].width = 25
    ws.freeze_panes = "A2"

    wb.save(output_path)


if __name__ == "__main__":
    main()
