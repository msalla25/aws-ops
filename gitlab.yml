stages:
  - test

variables:
  ANSIBLE_CONTROLLER_URL: "https://ansible-controller.example.com/api/v2/job_templates/"  # Replace with your Ansible controller URL
  ANSIBLE_JOB_TEMPLATE_ID: "123"  # Replace with your Ansible job template ID
  POSTMAN_COLLECTION_DIR: "src/test"  # Directory containing Postman collection files
  ANSIBLE_API_TOKEN: "your_ansible_api_token_here"  # Replace with your Ansible API token

run_api_tests:
  stage: test
  script:
    - |
      # Install dependencies (if needed)
      apt-get update && apt-get install -y curl python3 ansible

      # Loop through Postman collection files in /src/test
      for file in $(find $POSTMAN_COLLECTION_DIR -name "*.json"); do
        echo "Processing file: $file"

        # Preprocess the file to extract relevant information
        PROCESSED_CONTENT=$(python3 <<EOF
      import re

      with open("$file", "r") as f:
          content = f.read()

      # Extract URLs, methods, headers, and bodies using regex (customize as needed)
      urls = re.findall(r'"url"\s*:\s*"([^"]+)"', content)
      methods = re.findall(r'"method"\s*:\s*"([^"]+)"', content)
      headers = re.findall(r'"header"\s*:\s*\[([^\]]+)\]', content)
      bodies = re.findall(r'"body"\s*:\s*\{([^}]+)\}', content)

      # Format the extracted data into a structured JSON-like format
      structured_data = {
          "item": [
              {
                  "request": {
                      "url": urls[i],
                      "method": methods[i],
                      "header": headers[i] if i < len(headers) else [],
                      "body": bodies[i] if i < len(bodies) else {}
                  }
              }
              for i in range(len(urls))
          ]
      }

      # Print the structured data as a JSON string
      import json
      print(json.dumps(structured_data))
      EOF
      )

        # Encode the processed content for API request using Python
        FILE_CONTENT=$(echo "$PROCESSED_CONTENT" | python3 -c "import base64, sys; print(base64.b64encode(sys.stdin.read().encode('utf-8')).decode('utf-8'))")

        # Prepare JSON payload with properly escaped content
        JSON_PAYLOAD=$(python3 -c "import json; print(json.dumps({'extra_vars': {'postman_collection': '$FILE_CONTENT'}}))")

        # Call Ansible controller API to trigger job
        RESPONSE=$(curl -s -X POST \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer $ANSIBLE_API_TOKEN" \
          -d "$JSON_PAYLOAD" \
          "$ANSIBLE_CONTROLLER_URL$ANSIBLE_JOB_TEMPLATE_ID/launch/")

        # Check if job was triggered successfully using Python
        JOB_ID=$(python3 -c "import json, sys; print(json.loads('''$RESPONSE''').get('job', 'null'))")
        if [ "$JOB_ID" != "null" ]; then
          echo "Ansible job triggered successfully. Job ID: $JOB_ID"
        else
          echo "Failed to trigger Ansible job. Response: $RESPONSE"
          exit 1
        fi
      done