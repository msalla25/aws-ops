stages:
  - test

variables:
  ANSIBLE_CONTROLLER_URL: "https://ansible-controller.example.com/api/v2/job_templates/"  # Replace with your Ansible controller URL
  ANSIBLE_JOB_TEMPLATE_ID: "123"  # Replace with your Ansible job template ID
  POSTMAN_COLLECTION_DIR: "src/test"  # Directory containing Postman collection files
  ANSIBLE_API_TOKEN: "your_ansible_api_token_here"  # Replace with your Ansible API token

run_api_tests:
  stage: test
  script:
    - |
      # Install dependencies
      apt-get update && apt-get install -y curl jq python3

      # Loop through Postman collection files in /src/test
      for file in $(find "$POSTMAN_COLLECTION_DIR" -name "*.json"); do
        echo "Processing file: $file"

        # Validate JSON
        if ! jq -e . "$file" > /dev/null 2>&1; then
          echo "Error: Invalid JSON in file $file"
          exit 1
        fi

        # Read file content and format it properly
        FILE_CONTENT=$(jq -c '.' "$file")

        # Prepare JSON payload
        PAYLOAD=$(jq -n --argjson collection "$FILE_CONTENT" '{extra_vars: {postman_collection: $collection}}')

        # Call Ansible API
        RESPONSE=$(curl -s -X POST \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer $ANSIBLE_API_TOKEN" \
          -d "$PAYLOAD" \
          "$ANSIBLE_CONTROLLER_URL$ANSIBLE_JOB_TEMPLATE_ID/launch/")

        # Check if the job was triggered successfully
        JOB_ID=$(echo "$RESPONSE" | jq -r '.job // empty')

        if [[ -z "$JOB_ID" ]]; then
          echo "Failed to trigger Ansible job. Response: $RESPONSE"
          exit 1
        else
          echo "Ansible job triggered successfully. Job ID: $JOB_ID"
        fi
      done
