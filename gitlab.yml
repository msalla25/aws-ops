"""
DataStage XML Parser
─────────────────────
Reads DataStage XML export files (<DSExport> root) from a folder and
outputs a CSV with job name, stage name, SQL query, and the view names
and column names parsed directly from the SQL query text.

CSV Layout
──────────
  Row 1 for a stage:  Job Name | Stage Name | SQL Query | View Name | View Column
  Row 2..N:           (blank)  | (blank)    | (blank)   | (blank)   | next column
"""

import csv
import re
import glob
import html
import xml.etree.ElementTree as ET
from pathlib import Path
from typing import Optional


# ── Configuration ─────────────────────────────────────────────────────────────
INPUT_FOLDER  = "./datastage_jobs"
OUTPUT_CSV    = "./datastage_output.csv"

REQUIRED_STRINGS = ["OracleConnectorPX", "ORA_IODS_SCHEMA"]

CSV_HEADERS = [
    "Job/Sequence Name",
    "Stage Name",
    "SQL Query",
    "View Name",
    "View Column",
]
# ──────────────────────────────────────────────────────────────────────────────


# ═════════════════════════════════════════════════════════════════════════════
#  XML navigation helpers
# ═════════════════════════════════════════════════════════════════════════════

def _strip_ns(tag: str) -> str:
    return tag.split("}")[-1] if "}" in tag else tag


def get_property(record_el: ET.Element, prop_name: str) -> str:
    for prop in record_el:
        if _strip_ns(prop.tag) == "Property" and prop.get("Name") == prop_name:
            return (prop.text or "").strip()
    return ""


def get_subrecord_value(record_el: ET.Element, sr_prop_name: str) -> str:
    for collection in record_el.iter():
        if _strip_ns(collection.tag) != "Collection":
            continue
        for sub in collection:
            if _strip_ns(sub.tag) != "SubRecord":
                continue
            name_val = ""
            value_val = ""
            for prop in sub:
                if _strip_ns(prop.tag) != "Property":
                    continue
                pname = prop.get("Name", "")
                ptext = (prop.text or "").strip()
                if pname == "Name":
                    name_val = ptext
                elif pname == "Value":
                    value_val = ptext
            if name_val == sr_prop_name:
                return value_val
    return ""


def get_stage_identifier_for_link(link_rec: ET.Element) -> str:
    partner = get_property(link_rec, "Partner")
    if partner:
        return partner
    rec_id = link_rec.get("Identifier", "")
    m = re.match(r"^(.+?)P\d+$", rec_id)
    return m.group(1) if m else ""


# ═════════════════════════════════════════════════════════════════════════════
#  Extract SQL from the XMLProperties embedded XML string
# ═════════════════════════════════════════════════════════════════════════════

def _fully_unescape(text: str) -> str:
    prev = None
    current = text
    for _ in range(5):
        prev = current
        current = html.unescape(current)
        if current == prev:
            break
    return current


def extract_sql_from_xmlprops(xml_props_str: str) -> str:
    """Extract the SQL query from the XMLProperties embedded XML string."""
    if not xml_props_str:
        return ""

    raw  = xml_props_str.strip()
    text = _fully_unescape(raw)

    sql = ""

    # Strategy 1: XML parse
    try:
        clean = re.sub(r"<\?xml[^?]*\?>", "", text).strip()
        if not clean.startswith("<"):
            clean = f"<root>{clean}</root>"
        inner_root = ET.fromstring(clean)

        for el in inner_root.iter():
            tag_lower = _strip_ns(el.tag).lower()
            el_text = (el.text or "").strip()
            if el_text.startswith("<![CDATA["):
                el_text = el_text[9:]
            if el_text.endswith("]]>"):
                el_text = el_text[:-3]
            el_text = el_text.strip()
            if not el_text:
                continue

            if tag_lower in ("selectstatement", "userquery", "query"):
                sql = el_text
                break
            elif tag_lower == "insertstatement" and not sql:
                sql = el_text
    except ET.ParseError:
        pass

    if sql:
        return sql

    # Strategy 2: regex on unescaped then raw text
    for source in (text, raw):
        for pattern in [
            r"<SelectStatement[^>]*>\s*(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?\s*</SelectStatement>",
            r"<UserQuery[^>]*>\s*(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?\s*</UserQuery>",
            r"<Query[^>]*>\s*(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?\s*</Query>",
            r"<InsertStatement[^>]*>\s*(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?\s*</InsertStatement>",
        ]:
            m = re.search(pattern, source, re.IGNORECASE | re.DOTALL)
            if m and m.group(1).strip():
                return m.group(1).strip()

    # Strategy 3: escaped entity form
    for tag in ("SelectStatement", "UserQuery", "Query", "InsertStatement"):
        for pattern in [
            rf"&lt;{tag}[^&]*&gt;\s*&lt;!\[CDATA\[(.*?)\]\]&gt;\s*&lt;/{tag}&gt;",
            rf"&lt;{tag}[^&]*&gt;(.*?)&lt;/{tag}&gt;",
        ]:
            m = re.search(pattern, raw, re.IGNORECASE | re.DOTALL)
            if m and m.group(1).strip():
                return m.group(1).strip()

    # Strategy 4: bare SELECT in the blob
    m = re.search(
        r"(SELECT\s+.+?\s+FROM\s+\S+.*?)(?=SELECT\s|\Z)",
        text, re.IGNORECASE | re.DOTALL,
    )
    if m:
        return m.group(1).strip()

    return ""


# ═════════════════════════════════════════════════════════════════════════════
#  Parse View Name + View Column directly from the SQL query text
# ═════════════════════════════════════════════════════════════════════════════

# Regex for an Oracle-style object name: handles quoted or unquoted,
# with optional schema prefix and optional DB link (@dblink)
#   Examples matched:
#     CUSTOMERS
#     ORA_IODS_SCHEMA.CUSTOMERS
#     "ORA_IODS_SCHEMA"."CUSTOMERS"
#     SCHEMA . VIEW_NAME
#     SCHEMA.VIEW@DBLINK
_OBJ_NAME = (
    r"(?:"
        r'"[^"]+"|[A-Za-z_][\w$#]*'       # one part (quoted or unquoted)
    r")"
    r"(?:"
        r"\s*\.\s*"                         # dot (with optional spaces)
        r'(?:"[^"]+"|[A-Za-z_][\w$#]*)'    # another part
    r"){0,2}"                               # up to schema.table.column
    r"(?:@[A-Za-z_][\w$#]*)?"              # optional @dblink
)

_FROM_JOIN_RE = re.compile(
    r"(?:FROM|JOIN)\s+"
    r"(" + _OBJ_NAME + r")",
    re.IGNORECASE,
)


def parse_views_and_columns_from_sql(sql: str) -> tuple[str, list[str]]:
    """
    Given a SQL query string, extract:
      - view_name : semicolon-separated list of tables/views from FROM/JOIN
      - columns   : list of individual column names from the SELECT clause

    Returns (view_name_str, [col1, col2, ...])
    """
    if not sql:
        return ("", [])

    # ── Normalize whitespace (handle literal \n, \r, \t) ────────────────────
    norm_sql = sql.replace("\\n", " ").replace("\\r", " ").replace("\\t", " ")

    # ── Extract view / table names from FROM and JOIN ────────────────────────
    seen_tables: set[str] = set()
    tables: list[str] = []
    for m in _FROM_JOIN_RE.finditer(norm_sql):
        raw_name = m.group(1).strip()
        # Normalize: remove spaces around dots, strip quotes for dedup key
        clean = re.sub(r'\s*\.\s*', '.', raw_name)
        key = clean.upper().replace('"', '')
        if key not in seen_tables:
            seen_tables.add(key)
            tables.append(clean)

    view_name_str = "; ".join(tables)

    # ── Extract column names from SELECT … FROM ─────────────────────────────
    select_match = re.search(
        r"SELECT\s+(.*?)\s+FROM\b",
        norm_sql, re.IGNORECASE | re.DOTALL,
    )
    columns: list[str] = []
    if select_match:
        col_block = select_match.group(1).strip()
        col_block = re.sub(r"^(DISTINCT|ALL)\s+", "", col_block, flags=re.IGNORECASE)

        # Split on commas not inside parentheses
        depth = 0
        current: list[str] = []
        for ch in col_block:
            if ch == "(":
                depth += 1
                current.append(ch)
            elif ch == ")":
                depth -= 1
                current.append(ch)
            elif ch == "," and depth == 0:
                columns.append("".join(current).strip())
                current = []
            else:
                current.append(ch)
        if current:
            columns.append("".join(current).strip())

    clean_cols: list[str] = []
    for expr in columns:
        col = _clean_column_expr(expr)
        if col:
            clean_cols.append(col)

    return (view_name_str, clean_cols)


def _clean_column_expr(expr: str) -> str:
    """
    Given a raw SELECT column expression, return the effective column name.
    Examples:
      "c.CUSTOMER_ID"          → "CUSTOMER_ID"
      "a.CITY AS customer_city"→ "customer_city"
      "TRIM(x.NAME)"          → "TRIM(x.NAME)"
      "*"                      → ""
    """
    expr = expr.strip()
    if not expr or expr == "*":
        return ""

    # Explicit alias: ... AS alias
    alias_match = re.search(r"\bAS\s+[\"'`]?(\w+)[\"'`]?\s*$", expr, re.IGNORECASE)
    if alias_match:
        return alias_match.group(1)

    # Implicit alias: last space-separated token if it's a simple identifier
    tokens = expr.split()
    if len(tokens) >= 2:
        last = tokens[-1].strip("\"'`")
        if re.match(r"^[A-Za-z_]\w*$", last) and last.upper() not in (
            "FROM", "WHERE", "AND", "OR", "ON", "AS", "IN", "NOT", "NULL",
            "IS", "BETWEEN", "LIKE", "EXISTS", "CASE", "WHEN", "THEN",
            "ELSE", "END", "SELECT", "DISTINCT", "ALL",
        ):
            return last

    # Qualified name: schema.table.column or alias.column → last part
    qual_match = re.match(r'(?:(?:"[^"]+"|[A-Za-z_][\w$#]*)\s*\.\s*)+([A-Za-z_][\w$#]*)', expr)
    if qual_match:
        return qual_match.group(1)

    # Simple unqualified name
    simple = re.match(r"^([A-Za-z_][\w$#]*)$", expr)
    if simple:
        return simple.group(1)

    # Complex expression — return as-is
    return expr


# ═════════════════════════════════════════════════════════════════════════════
#  File-level filtering (single read)
# ═════════════════════════════════════════════════════════════════════════════

def read_file_if_meets_criteria(file_path: str) -> Optional[str]:
    try:
        content = Path(file_path).read_text(encoding="utf-8", errors="replace")
        if all(s in content for s in REQUIRED_STRINGS):
            return content
        return None
    except Exception as e:
        print(f"  [WARN] Could not read {file_path}: {e}")
        return None


# ═════════════════════════════════════════════════════════════════════════════
#  Process a single DataStage XML export file
# ═════════════════════════════════════════════════════════════════════════════

def process_file(file_path: str, raw_content: str) -> list[dict]:
    rows: list[dict] = []

    try:
        root = ET.fromstring(raw_content)
    except ET.ParseError as e:
        print(f"  [ERROR] XML parse failed for {file_path}: {e}")
        return rows

    root_tag = _strip_ns(root.tag)

    # Locate Job elements
    jobs: list[ET.Element] = []
    if root_tag == "DSExport":
        for child in root:
            if _strip_ns(child.tag) == "Job":
                jobs.append(child)
    elif root_tag == "Job":
        jobs.append(root)
    else:
        for el in root.iter():
            if _strip_ns(el.tag) == "Job":
                jobs.append(el)

    if not jobs:
        print(f"  [WARN] No <Job> elements found in {Path(file_path).name}")
        return rows

    for job_el in jobs:
        # Job name
        job_name = job_el.get("Identifier", "")
        if not job_name:
            for rec in job_el:
                if _strip_ns(rec.tag) == "Record" and rec.get("Type") == "JobDefn":
                    job_name = get_property(rec, "Name")
                    break
        if not job_name:
            job_name = Path(file_path).stem

        # Index Record elements by Type
        records_by_type: dict[str, list[ET.Element]] = {}
        for rec in job_el:
            if _strip_ns(rec.tag) != "Record":
                continue
            rec_type = rec.get("Type", "")
            records_by_type.setdefault(rec_type, []).append(rec)

        # Gather link-level XMLProperties per stage
        stage_link_xmlprops: dict[str, list[str]] = {}
        for link_type in ("CustomOutput", "CustomInput"):
            for rec in records_by_type.get(link_type, []):
                partner_id = get_stage_identifier_for_link(rec)
                if not partner_id:
                    continue
                lxp = get_property(rec, "XMLProperties")
                if not lxp:
                    lxp = get_subrecord_value(rec, "XMLProperties")
                if lxp:
                    stage_link_xmlprops.setdefault(partner_id, []).append(lxp)

        # Process CustomStage records
        for stage_rec in records_by_type.get("CustomStage", []):
            stage_id   = stage_rec.get("Identifier", "")
            stage_name = get_property(stage_rec, "Name") or stage_id
            stage_type = get_property(stage_rec, "StageType")

            # Get XMLProperties
            xml_props_str = get_property(stage_rec, "XMLProperties")
            if not xml_props_str:
                xml_props_str = get_subrecord_value(stage_rec, "XMLProperties")

            link_xml_props = stage_link_xmlprops.get(stage_id, [])

            # Filter: must contain both required strings
            combined_text = f"{stage_type} {xml_props_str} {' '.join(link_xml_props)}"
            if not all(s in combined_text for s in REQUIRED_STRINGS):
                continue

            # Extract SQL
            sql = extract_sql_from_xmlprops(xml_props_str)
            if not sql:
                for lxp in link_xml_props:
                    sql = extract_sql_from_xmlprops(lxp)
                    if sql:
                        break

            # ── DIAGNOSTIC: show what SQL was extracted ───────────────────────
            sql_preview = sql[:120].replace('\n', ' ') if sql else "(no SQL found)"
            print(f"         Stage: {stage_name}")
            print(f"         SQL  : {sql_preview}...")

            # Parse View Name + View Columns from the SQL
            view_name, view_columns = parse_views_and_columns_from_sql(sql)

            print(f"         Views: {view_name or '(none)'}")
            print(f"         Cols : {view_columns[:5]}{'...' if len(view_columns) > 5 else ''}")
            print()

            # Build rows
            if view_columns:
                rows.append({
                    "Job/Sequence Name": job_name,
                    "Stage Name":        stage_name,
                    "SQL Query":         sql,
                    "View Name":         view_name,
                    "View Column":       view_columns[0],
                })
                for col in view_columns[1:]:
                    rows.append({
                        "Job/Sequence Name": "",
                        "Stage Name":        "",
                        "SQL Query":         "",
                        "View Name":         "",
                        "View Column":       col,
                    })
            else:
                rows.append({
                    "Job/Sequence Name": job_name,
                    "Stage Name":        stage_name,
                    "SQL Query":         sql,
                    "View Name":         view_name,
                    "View Column":       "",
                })

    return rows


# ═════════════════════════════════════════════════════════════════════════════
#  Main
# ═════════════════════════════════════════════════════════════════════════════

def main():
    input_folder = Path(INPUT_FOLDER).resolve()
    if not input_folder.exists():
        print(f"[ERROR] Input folder not found: {input_folder}")
        print("        Update INPUT_FOLDER at the top of this script.")
        return

    xml_files = sorted(set(
        glob.glob(str(input_folder / "*.xml")) +
        glob.glob(str(input_folder / "**" / "*.xml"), recursive=True)
    ))

    if not xml_files:
        print(f"[WARN] No XML files found in: {input_folder}")
        return

    print(f"Found {len(xml_files)} XML file(s). Checking for required strings …\n")

    all_rows:        list[dict] = []
    skipped_count:   int = 0
    processed_count: int = 0

    for fp in xml_files:
        fname = Path(fp).name
        content = read_file_if_meets_criteria(fp)

        if content is None:
            print(f"  [SKIP] {fname}  ← missing required strings")
            skipped_count += 1
            continue

        print(f"  [OK]   {fname}")
        file_rows = process_file(fp, content)
        all_rows.extend(file_rows)
        processed_count += 1

    print(f"\nProcessed: {processed_count}  |  Skipped: {skipped_count}")
    print(f"Total rows extracted: {len(all_rows)}")

    output_path = Path(OUTPUT_CSV).resolve()
    with output_path.open("w", newline="", encoding="utf-8") as f:
        writer = csv.DictWriter(f, fieldnames=CSV_HEADERS)
        writer.writeheader()
        writer.writerows(all_rows)

    print(f"\nCSV written to: {output_path}")


if __name__ == "__main__":
    main()
