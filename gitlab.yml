"""
DataStage XML Parser
─────────────────────
Reads DataStage XML export files (<DSExport> root) from a folder and
outputs an Excel file (.xlsx) with merged cells for readability.

View Name and View Column are extracted from the SQL query text itself.
"""

import csv
import re
import glob
import html
import xml.etree.ElementTree as ET
from pathlib import Path
from typing import Optional


# ── Configuration ─────────────────────────────────────────────────────────────
INPUT_FOLDER  = "./datastage_jobs"
OUTPUT_XLSX   = "./datastage_output.xlsx"
OUTPUT_CSV    = "./datastage_output.csv"       # also produce CSV as backup
DIAG_LOG      = "./datastage_diagnostic.log"   # diagnostic log

REQUIRED_STRINGS = ["OracleConnectorPX", "ORA_IODS_SCHEMA"]

CSV_HEADERS = [
    "Job/Sequence Name",
    "Stage Name",
    "SQL Query",
    "View Name",
    "View Column",
]
# ──────────────────────────────────────────────────────────────────────────────

diag_lines: list[str] = []   # collects diagnostic output

def diag(msg: str):
    print(msg)
    diag_lines.append(msg)


# ═════════════════════════════════════════════════════════════════════════════
#  XML navigation helpers
# ═════════════════════════════════════════════════════════════════════════════

def _strip_ns(tag: str) -> str:
    return tag.split("}")[-1] if "}" in tag else tag


def get_property(record_el: ET.Element, prop_name: str) -> str:
    for prop in record_el:
        if _strip_ns(prop.tag) == "Property" and prop.get("Name") == prop_name:
            return (prop.text or "").strip()
    return ""


def get_subrecord_value(record_el: ET.Element, sr_prop_name: str) -> str:
    for collection in record_el.iter():
        if _strip_ns(collection.tag) != "Collection":
            continue
        for sub in collection:
            if _strip_ns(sub.tag) != "SubRecord":
                continue
            name_val = ""
            value_val = ""
            for prop in sub:
                if _strip_ns(prop.tag) != "Property":
                    continue
                pname = prop.get("Name", "")
                ptext = (prop.text or "").strip()
                if pname == "Name":
                    name_val = ptext
                elif pname == "Value":
                    value_val = ptext
            if name_val == sr_prop_name:
                return value_val
    return ""


def get_stage_identifier_for_link(link_rec: ET.Element) -> str:
    partner = get_property(link_rec, "Partner")
    if partner:
        return partner
    rec_id = link_rec.get("Identifier", "")
    m = re.match(r"^(.+?)P\d+$", rec_id)
    return m.group(1) if m else ""


# ═════════════════════════════════════════════════════════════════════════════
#  Extract SQL from the XMLProperties embedded XML string
# ═════════════════════════════════════════════════════════════════════════════

def _fully_unescape(text: str) -> str:
    prev = None
    current = text
    for _ in range(5):
        prev = current
        current = html.unescape(current)
        if current == prev:
            break
    return current


def _get_full_text(el: ET.Element) -> str:
    """Get ALL text from an element including text in children (itertext).
    This handles cases where el.text only has partial content."""
    return "".join(el.itertext()).strip()


def extract_sql_from_xmlprops(xml_props_str: str) -> str:
    """Extract the SQL query from the XMLProperties embedded XML string."""
    if not xml_props_str:
        return ""

    raw  = xml_props_str.strip()
    text = _fully_unescape(raw)

    sql = ""

    # Strategy 1: XML parse — use itertext() to get ALL text from elements
    try:
        clean = re.sub(r"<\?xml[^?]*\?>", "", text).strip()
        if not clean.startswith("<"):
            clean = f"<root>{clean}</root>"
        inner_root = ET.fromstring(clean)

        for el in inner_root.iter():
            tag_lower = _strip_ns(el.tag).lower()

            if tag_lower in ("selectstatement", "userquery", "query", "insertstatement"):
                # Use itertext to get ALL text, not just el.text
                full_text = _get_full_text(el)
                # Also try el.text directly
                el_text = (el.text or "").strip()

                # Pick whichever is longer (more complete)
                candidate = full_text if len(full_text) >= len(el_text) else el_text

                # Strip leftover CDATA markers
                candidate = re.sub(r"<!\[CDATA\[", "", candidate)
                candidate = re.sub(r"\]\]>", "", candidate)
                candidate = candidate.strip()

                if candidate and len(candidate) > len(sql):
                    sql = candidate
    except ET.ParseError:
        pass

    if sql:
        return sql

    # Strategy 2: regex — try many patterns on both unescaped and raw text
    for source in (text, raw):
        for pattern in [
            r"<SelectStatement[^>]*>\s*(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?\s*</SelectStatement>",
            r"<UserQuery[^>]*>\s*(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?\s*</UserQuery>",
            r"<Query[^>]*>\s*(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?\s*</Query>",
            r"<InsertStatement[^>]*>\s*(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?\s*</InsertStatement>",
        ]:
            m = re.search(pattern, source, re.IGNORECASE | re.DOTALL)
            if m and m.group(1).strip():
                return m.group(1).strip()

    # Strategy 3: escaped entity form
    for tag in ("SelectStatement", "UserQuery", "Query", "InsertStatement"):
        for pattern in [
            rf"&lt;{tag}[^&]*&gt;\s*&lt;!\[CDATA\[(.*?)\]\]&gt;\s*&lt;/{tag}&gt;",
            rf"&lt;{tag}[^&]*&gt;(.*?)&lt;/{tag}&gt;",
        ]:
            m = re.search(pattern, raw, re.IGNORECASE | re.DOTALL)
            if m and m.group(1).strip():
                return _fully_unescape(m.group(1).strip())

    # Strategy 4: just find SELECT...FROM anywhere in the blob
    m = re.search(
        r"(SELECT\s+.+?\s+FROM\s+\S+.*?)(?=SELECT\s|\Z)",
        text, re.IGNORECASE | re.DOTALL,
    )
    if m:
        return m.group(1).strip()

    return ""


# ═════════════════════════════════════════════════════════════════════════════
#  Parse View Name + View Column from the SQL query text
# ═════════════════════════════════════════════════════════════════════════════

def parse_views_and_columns_from_sql(sql: str) -> tuple[str, list[str]]:
    """
    Extract view/table names from FROM/JOIN and column names from SELECT.
    Returns (view_name_str, [col1, col2, ...])
    """
    if not sql:
        return ("", [])

    # Normalize: replace literal escape sequences and collapse whitespace
    norm = sql.replace("\\n", " ").replace("\\r", " ").replace("\\t", " ")
    # Strip SQL single-line comments (-- to end of line)
    norm = re.sub(r"--[^\n]*", " ", norm)
    # Strip SQL block comments (/* ... */)
    norm = re.sub(r"/\*.*?\*/", " ", norm, flags=re.DOTALL)
    norm = re.sub(r"\s+", " ", norm)

    # ── View / table names from FROM and JOIN ────────────────────────────────
    # Handles:
    #   SCHEMA.VIEW                            — plain names
    #   "SCHEMA"."VIEW"                        — quoted identifiers
    #   #$ORA_IODS_SCHEMA#.iods_ast_v          — DataStage parameter markers
    #   SCHEMA.VIEW@DBLINK                     — Oracle DB links
    #   ( subquery ) alias                     — skipped (starts with parenthesis)
    #
    # A "name part" is one of:
    #   - A DS parameter:   #$PARAM_NAME#
    #   - A quoted ident:   "something"
    #   - A regular ident:  letter_or_underscore followed by word chars
    _NAME_PART = r'(?:#\$[\w]+#|"[^"]+"|[A-Za-z_][\w$#]*)'

    from_pattern = re.compile(
        r"(?:FROM|JOIN)\s+"
        r"(" + _NAME_PART + r"(?:\s*\.\s*" + _NAME_PART + r"){0,2}"
        r"(?:@[A-Za-z_][\w$#]*)?"     # optional @dblink
        r")",
        re.IGNORECASE,
    )

    seen_tables: set[str] = set()
    tables: list[str] = []
    for m in from_pattern.finditer(norm):
        raw_name = m.group(1).strip()
        clean = re.sub(r"\s*\.\s*", ".", raw_name)
        key = clean.upper().replace('"', '')
        if key not in seen_tables:
            seen_tables.add(key)
            tables.append(clean)

    # ── Column names from SELECT … FROM ──────────────────────────────────────
    select_match = re.search(
        r"\bSELECT\s+(.*?)\s+FROM\b",
        norm, re.IGNORECASE | re.DOTALL,
    )
    columns: list[str] = []
    if select_match:
        col_block = select_match.group(1).strip()
        col_block = re.sub(r"^(DISTINCT|ALL)\s+", "", col_block, flags=re.IGNORECASE)

        depth = 0
        current: list[str] = []
        for ch in col_block:
            if ch == "(":
                depth += 1
                current.append(ch)
            elif ch == ")":
                depth -= 1
                current.append(ch)
            elif ch == "," and depth == 0:
                columns.append("".join(current).strip())
                current = []
            else:
                current.append(ch)
        if current:
            columns.append("".join(current).strip())

    clean_cols: list[str] = []
    for expr in columns:
        col = _clean_column_expr(expr)
        if col:
            clean_cols.append(col)

    return (tables, clean_cols)


def _clean_column_expr(expr: str) -> str:
    """
    Given a raw SELECT column expression, return the actual base column name
    (not the alias).  Strip table/alias qualifiers.
    Return "" for anything that is NOT a real column reference:
      literals, CASE expressions, function calls, subqueries, etc.

    Examples:
      "t1.ADDR_ID"                        → "ADDR_ID"
      "A.ACCT_NBR AS ACCOUNT_NUM"         → "ACCT_NBR"
      "iods_ast_v.agrmnt_nbr"             → "agrmnt_nbr"
      "V.YR AS YEAR"                      → "YR"
      "0 AS some_flag"                    → ""   (literal)
      "'N' AS active_flag"                → ""   (string literal)
      "CASE WHEN x=1 THEN 'Y' END"       → ""   (expression)
      "ROW_NUMBER() OVER(...) AS rn"      → ""   (window function)
      "TRIM(x.NAME)"                      → ""   (function call)
      "( SELECT ... )"                    → ""   (subquery)
      "*"                                 → ""
    """
    expr = expr.strip()
    if not expr or expr == "*":
        return ""

    # ── Early rejection: things that are clearly not column references ────
    # String literals: 'N', 'ACTIVE', 'text'
    if re.match(r"^'[^']*'", expr):
        return ""

    # Numeric literals: 0, 1, 100, 3.14, -5
    if re.match(r"^-?\d+(\.\d+)?\s*(AS\b|$)", expr, re.IGNORECASE):
        return ""

    # CASE expressions
    if re.match(r"^\(?\s*CASE\b", expr, re.IGNORECASE):
        return ""

    # Subqueries: starts with ( SELECT  or (SELECT
    if re.match(r"^\(\s*SELECT\b", expr, re.IGNORECASE):
        return ""

    # NULL literal
    if re.match(r"^NULL\s*(AS\b|$)", expr, re.IGNORECASE):
        return ""

    # ── Step 1: Strip explicit alias  (... AS alias_name) ────────────────
    core = re.sub(r"\s+AS\s+[\"'`]?\w+[\"'`]?\s*$", "", expr, flags=re.IGNORECASE).strip()

    # ── More rejections after stripping alias ────────────────────────────
    # Literal after alias strip
    if re.match(r"^'[^']*'$", core):
        return ""
    if re.match(r"^-?\d+(\.\d+)?$", core):
        return ""
    if core.upper() in ("NULL", "SYSDATE", "SYSTIMESTAMP", "USER"):
        return ""

    # Function calls: FUNC(...), including nested
    if re.match(r"^\w+\s*\(", core):
        return ""

    # Expressions starting with ( — subqueries, grouped expressions
    if core.startswith("("):
        return ""

    # Arithmetic / concatenation expressions: contains +, -, *, /, ||
    if re.search(r"[+\-*/]|(\|\|)", core) and not re.match(r"^[\w$.#\"]+$", core):
        return ""

    # CASE after alias strip
    if re.match(r"^\s*CASE\b", core, re.IGNORECASE):
        return ""

    # ── Step 2: Strip implicit alias ─────────────────────────────────────
    tokens = core.split()
    if len(tokens) >= 2:
        last = tokens[-1].strip("\"'`")
        before_last = " ".join(tokens[:-1]).strip()
        if (re.match(r"^(?:[A-Za-z_][\w$#]*\.)*[A-Za-z_][\w$#]*$", before_last)
                and re.match(r"^[A-Za-z_]\w*$", last)
                and last.upper() not in (
                    "FROM", "WHERE", "AND", "OR", "ON", "AS", "IN", "NOT", "NULL",
                    "IS", "BETWEEN", "LIKE", "EXISTS", "CASE", "WHEN", "THEN",
                    "ELSE", "END", "SELECT", "DISTINCT", "ALL",
                )):
            core = before_last

    # ── Step 3: Qualified name (table.column) → take last part ───────────
    qual_match = re.match(r'(?:(?:"[^"]+"|[A-Za-z_][\w$#]*)\s*\.\s*)+([A-Za-z_][\w$#]*)', core)
    if qual_match:
        return qual_match.group(1)

    # ── Step 4: Simple unqualified column name ───────────────────────────
    simple = re.match(r"^([A-Za-z_][\w$#]*)$", core)
    if simple:
        return simple.group(1)

    # ── Anything else is not a simple column → skip it ───────────────────
    return ""


# ═════════════════════════════════════════════════════════════════════════════
#  File-level filtering (single read)
# ═════════════════════════════════════════════════════════════════════════════

def read_file_if_meets_criteria(file_path: str) -> Optional[str]:
    try:
        content = Path(file_path).read_text(encoding="utf-8", errors="replace")
        if all(s in content for s in REQUIRED_STRINGS):
            return content
        return None
    except Exception as e:
        diag(f"  [WARN] Could not read {file_path}: {e}")
        return None


# ═════════════════════════════════════════════════════════════════════════════
#  Process a single DataStage XML export file
# ═════════════════════════════════════════════════════════════════════════════

def process_file(file_path: str, raw_content: str) -> list[dict]:
    rows: list[dict] = []

    try:
        root = ET.fromstring(raw_content)
    except ET.ParseError as e:
        diag(f"  [ERROR] XML parse failed for {file_path}: {e}")
        return rows

    root_tag = _strip_ns(root.tag)

    jobs: list[ET.Element] = []
    if root_tag == "DSExport":
        for child in root:
            if _strip_ns(child.tag) == "Job":
                jobs.append(child)
    elif root_tag == "Job":
        jobs.append(root)
    else:
        for el in root.iter():
            if _strip_ns(el.tag) == "Job":
                jobs.append(el)

    if not jobs:
        diag(f"  [WARN] No <Job> elements found in {Path(file_path).name}")
        return rows

    for job_el in jobs:
        job_name = job_el.get("Identifier", "")
        if not job_name:
            for rec in job_el:
                if _strip_ns(rec.tag) == "Record" and rec.get("Type") == "JobDefn":
                    job_name = get_property(rec, "Name")
                    break
        if not job_name:
            job_name = Path(file_path).stem

        records_by_type: dict[str, list[ET.Element]] = {}
        for rec in job_el:
            if _strip_ns(rec.tag) != "Record":
                continue
            rec_type = rec.get("Type", "")
            records_by_type.setdefault(rec_type, []).append(rec)

        stage_link_xmlprops: dict[str, list[str]] = {}
        for link_type in ("CustomOutput", "CustomInput"):
            for rec in records_by_type.get(link_type, []):
                partner_id = get_stage_identifier_for_link(rec)
                if not partner_id:
                    continue
                lxp = get_property(rec, "XMLProperties")
                if not lxp:
                    lxp = get_subrecord_value(rec, "XMLProperties")
                if lxp:
                    stage_link_xmlprops.setdefault(partner_id, []).append(lxp)

        for stage_rec in records_by_type.get("CustomStage", []):
            stage_id   = stage_rec.get("Identifier", "")
            stage_name = get_property(stage_rec, "Name") or stage_id
            stage_type = get_property(stage_rec, "StageType")

            xml_props_str = get_property(stage_rec, "XMLProperties")
            if not xml_props_str:
                xml_props_str = get_subrecord_value(stage_rec, "XMLProperties")

            link_xml_props = stage_link_xmlprops.get(stage_id, [])

            combined_text = f"{stage_type} {xml_props_str} {' '.join(link_xml_props)}"
            if not all(s in combined_text for s in REQUIRED_STRINGS):
                continue

            # Extract SQL
            sql = extract_sql_from_xmlprops(xml_props_str)
            if not sql:
                for lxp in link_xml_props:
                    sql = extract_sql_from_xmlprops(lxp)
                    if sql:
                        break

            # ── DIAGNOSTIC ───────────────────────────────────────────────────
            diag(f"    Stage: {stage_name}  (type: {stage_type})")
            diag(f"    SQL extracted ({len(sql)} chars):")
            # Show first 300 chars of SQL with special chars visible
            sql_show = repr(sql[:300])
            diag(f"      {sql_show}")

            # Parse views and columns from SQL
            view_names, view_columns = parse_views_and_columns_from_sql(sql)
            diag(f"    Views:     {view_names[:5]}{'...' if len(view_names) > 5 else ''}")
            diag(f"    Columns:   {view_columns[:8]}{'...' if len(view_columns) > 8 else ''}")
            diag("")

            # Build rows — views and columns fill parallel rows
            # Row count = max(len(views), len(columns)), minimum 1
            n_rows = max(len(view_names), len(view_columns), 1)

            for i in range(n_rows):
                rows.append({
                    "Job/Sequence Name": job_name if i == 0 else "",
                    "Stage Name":        stage_name if i == 0 else "",
                    "SQL Query":         sql if i == 0 else "",
                    "View Name":         view_names[i] if i < len(view_names) else "",
                    "View Column":       view_columns[i] if i < len(view_columns) else "",
                })

    return rows


# ═════════════════════════════════════════════════════════════════════════════
#  Write Excel with merged cells
# ═════════════════════════════════════════════════════════════════════════════

def write_excel(all_rows: list[dict], output_path: str):
    """Write output as .xlsx with merged & centered cells for readability."""
    from openpyxl import Workbook
    from openpyxl.styles import Font, Alignment, PatternFill, Border, Side

    wb = Workbook()
    ws = wb.active
    ws.title = "datastage_output"

    # Styles
    header_font = Font(name="Arial", bold=True, size=11, color="FFFFFF")
    header_fill = PatternFill("solid", fgColor="4472C4")
    header_align = Alignment(horizontal="center", vertical="center", wrap_text=True)
    data_align = Alignment(horizontal="left", vertical="center", wrap_text=True)
    center_align = Alignment(horizontal="center", vertical="center", wrap_text=True)
    thin_border = Border(
        left=Side(style="thin"),
        right=Side(style="thin"),
        top=Side(style="thin"),
        bottom=Side(style="thin"),
    )

    # Write header row
    for col_idx, header in enumerate(CSV_HEADERS, 1):
        cell = ws.cell(row=1, column=col_idx, value=header)
        cell.font = header_font
        cell.fill = header_fill
        cell.alignment = header_align
        cell.border = thin_border

    # Identify stage groups: consecutive rows belonging to same stage
    # A group starts at a row where Job/Sequence Name is non-empty
    groups: list[tuple[int, int]] = []   # (start_data_idx, count)
    i = 0
    while i < len(all_rows):
        count = 1
        while (i + count < len(all_rows)
               and all_rows[i + count]["Job/Sequence Name"] == ""):
            count += 1
        groups.append((i, count))
        i += count

    # Write data and merge
    excel_row = 2  # start after header
    for start_idx, count in groups:
        first_row_data = all_rows[start_idx]

        for offset in range(count):
            r = excel_row + offset
            row_data = all_rows[start_idx + offset]

            # View Name — one per row (col 4)
            cell = ws.cell(row=r, column=4, value=row_data["View Name"])
            cell.alignment = data_align
            cell.border = thin_border

            # View Column — one per row (col 5)
            cell = ws.cell(row=r, column=5, value=row_data["View Column"])
            cell.alignment = data_align
            cell.border = thin_border

        # Write main fields (Job, Stage, SQL) in the first row of the group
        ws.cell(row=excel_row, column=1, value=first_row_data["Job/Sequence Name"])
        ws.cell(row=excel_row, column=2, value=first_row_data["Stage Name"])
        ws.cell(row=excel_row, column=3, value=first_row_data["SQL Query"])

        # Style columns A-C
        for col in range(1, 4):
            cell = ws.cell(row=excel_row, column=col)
            cell.alignment = Alignment(
                horizontal="left", vertical="center", wrap_text=True
            )
            cell.border = thin_border

        # Merge cells for columns A-C (Job, Stage, SQL) only
        if count > 1:
            for col in range(1, 4):  # columns 1, 2, 3 only
                ws.merge_cells(
                    start_row=excel_row,
                    start_column=col,
                    end_row=excel_row + count - 1,
                    end_column=col,
                )
                cell = ws.cell(row=excel_row, column=col)
                cell.alignment = Alignment(
                    horizontal="left", vertical="center", wrap_text=True
                )

            # Apply borders to all cells in the merged range
            for offset in range(count):
                for col in range(1, 6):
                    ws.cell(row=excel_row + offset, column=col).border = thin_border

        excel_row += count

    # Column widths
    ws.column_dimensions["A"].width = 28
    ws.column_dimensions["B"].width = 30
    ws.column_dimensions["C"].width = 60
    ws.column_dimensions["D"].width = 40
    ws.column_dimensions["E"].width = 25

    # Freeze top row
    ws.freeze_panes = "A2"

    wb.save(output_path)


# ═════════════════════════════════════════════════════════════════════════════
#  Main
# ═════════════════════════════════════════════════════════════════════════════

def main():
    input_folder = Path(INPUT_FOLDER).resolve()
    if not input_folder.exists():
        diag(f"[ERROR] Input folder not found: {input_folder}")
        diag("        Update INPUT_FOLDER at the top of this script.")
        return

    xml_files = sorted(set(
        glob.glob(str(input_folder / "*.xml")) +
        glob.glob(str(input_folder / "**" / "*.xml"), recursive=True)
    ))

    if not xml_files:
        diag(f"[WARN] No XML files found in: {input_folder}")
        return

    diag(f"Found {len(xml_files)} XML file(s). Checking for required strings …\n")

    all_rows:        list[dict] = []
    skipped_count:   int = 0
    processed_count: int = 0

    for fp in xml_files:
        fname = Path(fp).name
        content = read_file_if_meets_criteria(fp)

        if content is None:
            diag(f"  [SKIP] {fname}")
            skipped_count += 1
            continue

        diag(f"  [OK]   {fname}")
        file_rows = process_file(fp, content)
        all_rows.extend(file_rows)
        processed_count += 1

    diag(f"\nProcessed: {processed_count}  |  Skipped: {skipped_count}")
    diag(f"Total rows extracted: {len(all_rows)}")

    # Write CSV
    csv_path = Path(OUTPUT_CSV).resolve()
    with csv_path.open("w", newline="", encoding="utf-8") as f:
        writer = csv.DictWriter(f, fieldnames=CSV_HEADERS)
        writer.writeheader()
        writer.writerows(all_rows)
    diag(f"\nCSV written to: {csv_path}")

    # Write Excel with merged cells
    xlsx_path = Path(OUTPUT_XLSX).resolve()
    try:
        write_excel(all_rows, str(xlsx_path))
        diag(f"Excel written to: {xlsx_path}")
    except ImportError:
        diag("[WARN] openpyxl not installed — run: pip install openpyxl")
        diag("       Only CSV was produced.")

    # Write diagnostic log
    log_path = Path(DIAG_LOG).resolve()
    log_path.write_text("\n".join(diag_lines), encoding="utf-8")
    diag(f"Diagnostic log: {log_path}")


if __name__ == "__main__":
    main()
