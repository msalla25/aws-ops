stages:
  - apigee-testing

variables:
  AWS_DEFAULT_REGION: "us-east-1"        # Set your AWS region
  SECRET_NAME: "your-secret-name"        # Name of the secret in AWS Secrets Manager
  INPUT_FILE: "input.json"               # Path to the input file

apigee_testing:
  stage: apigee-testing
  image: python:3.9-slim
  before_script:
    - apt-get update && apt-get install -y jq  # Install jq for JSON parsing
    - pip install requests boto3               # Install Python dependencies
  script:
    - python scripts/apigee_test.py            # Run the script (optional)
    # OR keep the logic inline here if you prefer