8- name: Debug raw Postman collection
  debug:
    var: postman_collection

- name: Ensure postman_collection is parsed correctly
  set_fact:
    parsed_collection: "{{ postman_collection | from_json }}"

- name: Debug parsed collection
  debug:
    var: parsed_collection

- name: Extract API requests from Postman collection
  set_fact:
    api_requests: "{{ parsed_collection.item | default([]) }}"

- name: Debug API requests structure
  debug:
    var: api_requests

- name: Run API requests
  uri:
    url: "{{ item.request.url.raw | default('') }}"
    method: "{{ item.request.method | default('GET') }}"
    headers: >-
      {{
        (item.request.header | default([]) | items2dict(key_name='key', value_name='value'))
        | combine({'Authorization': 'Bearer ' + (bearer_token | default(''))})
      }}
    body: "{{ item.request.body.raw | default(omit) }}"
    body_format: "{{ 'json' if (item.request.body is defined and item.request.body.mode == 'raw') else omit }}"
    status_code: "{{ item.response | json_query('[].code') | default([200]) }}"
    validate_certs: no
  loop: "{{ api_requests }}"
  loop_control:
    label: "{{ item.name | default('Unnamed Request') }}"
  register: api_results

- name: Display API results
  debug:
    var: api_results
python3 -c "print(open('file').read().replace('}', '\n'))"