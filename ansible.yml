---
- name: Move New Files to Backup Folders
  hosts: your_target_server
  vars:
    base_path: "/path/to/your/folders"
    folders: ['folder1', 'folder2', 'folder3', 'folder4', 'folder5']
    max_file_age_minutes: 30

  tasks:
    # Create all backup directories first
    - name: Ensure backup directories exist
      file:
        path: "{{ base_path }}/{{ item }}_bkp"
        state: directory
        mode: '0755'
      loop: "{{ folders }}"

    # Process each folder sequentially
    - name: Process folders for new files
      vars:
        current_folder: "{{ item }}"
        source_path: "{{ base_path }}/{{ current_folder }}"
        dest_path: "{{ base_path }}/{{ current_folder }}_bkp"
      loop: "{{ folders }}"
      block:
        - name: Find new files in {{ current_folder }}
          find:
            paths: "{{ source_path }}"
            age: "-{{ max_file_age_minutes }}m"
            file_type: file
          register: file_results

        - name: Move new files to backup
          command: "mv '{{ item.path }}' '{{ dest_path }}/{{ item.path | basename }}'"
          loop: "{{ file_results.files }}"
          when: file_results.matched > 0
          loop_control:
            label: "{{ item.path | basename }}"