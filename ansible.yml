---
- name: File Backup Automation
  hosts: your_target_server
  vars:
    base_path: "/path/to/main/folder"
    folders:
      - "folder1"
      - "folder2"
      - "folder3"
      - "folder4"
      - "folder5"
    max_file_age_minutes: 30

  tasks:
    # Create backup directories if missing
    - name: Ensure backup directories exist
      ansible.builtin.file:
        path: "{{ base_path }}/{{ folder }}_bkp"
        state: directory
        mode: '0755'
      loop: "{{ folders }}"
      loop_control:
        loop_var: folder

    # Find and move new files
    - name: Process files in each folder
      vars:
        current_folder: "{{ folder }}"
        source_path: "{{ base_path }}/{{ current_folder }}"
        backup_path: "{{ base_path }}/{{ current_folder }}_bkp"
      loop: "{{ folders }}"
      loop_control:
        loop_var: folder
        label: "PROCESSING {{ folder }}"
      tasks:
        - name: Find recent files
          ansible.builtin.find:
            paths: "{{ source_path }}"
            age: "-{{ max_file_age_minutes }}m"
            file_type: file
            recurse: no
          register: file_scan

        - name: Move files to backup
          ansible.builtin.command:
            cmd: "mv '{{ file.path }}' '{{ backup_path }}/{{ file.path | basename }}'"
          loop: "{{ file_scan.files }}"
          loop_control:
            loop_var: file
            label: "{{ file.path | basename }}"
          when: file_scan.matched > 0
          args:
            removes: "{{ file.path }}"
            creates: "{{ backup_path }}/{{ file.path | basename }}"