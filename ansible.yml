---
- name: Simple File Backup
  hosts: your_target_server
  vars:
    base_path: "/path/to/folders"
    folders: ["folder1", "folder2", "folder3", "folder4", "folder5"]

  tasks:
    - name: Create backup directories
      file:
        path: "{{ base_path }}/{{ item }}_bkp"
        state: directory
      loop: "{{ folders }}"

    - name: Move new files using find + mv
      shell: |
        find "{{ base_path }}/{{ item }}" -type f -mmin -30 -exec mv -v "{}" "{{ base_path }}/{{ item }}_bkp" \;
      loop: "{{ folders }}"