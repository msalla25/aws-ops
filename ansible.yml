---
- name: Restart all pods in an OpenShift namespace
  hosts: localhost
  gather_facts: false

  vars:
    ocp_cluster_url: "https://api.your-cluster.example.com:6443"   # Override via -e or vars file
    ocp_token: "sha256~your-token-here"                             # Override via -e or vars file
    ocp_namespace: "your-namespace"                                 # Override via -e or vars file
    k8s_api_base: "{{ ocp_cluster_url }}/api/v1"

  tasks:

    # ------------------------------------------------------------------ #
    # 1. Fetch all pods in the namespace
    # ------------------------------------------------------------------ #
    - name: Get all pods in namespace
      ansible.builtin.uri:
        url: "{{ k8s_api_base }}/namespaces/{{ ocp_namespace }}/pods"
        method: GET
        headers:
          Authorization: "Bearer {{ ocp_token }}"
          Content-Type: "application/json"
        validate_certs: false          # Set to true in production with proper CA
        status_code: 200
      register: pods_response

    # ------------------------------------------------------------------ #
    # 2. Parse pod names from the API response
    # ------------------------------------------------------------------ #
    - name: Set pod names list
      ansible.builtin.set_fact:
        pod_names: "{{ pods_response.json.items | map(attribute='metadata.name') | list }}"

    - name: Show pods to be deleted
      ansible.builtin.debug:
        msg: "Found {{ pod_names | length }} pod(s) to delete: {{ pod_names }}"

    # ------------------------------------------------------------------ #
    # 3. Abort early if no pods found
    # ------------------------------------------------------------------ #
    - name: Abort if no pods found
      ansible.builtin.meta: end_play
      when: pod_names | length == 0

    # ------------------------------------------------------------------ #
    # 4. Delete each pod (controllers will restart them automatically)
    # ------------------------------------------------------------------ #
    - name: Delete pod {{ item }}
      ansible.builtin.uri:
        url: "{{ k8s_api_base }}/namespaces/{{ ocp_namespace }}/pods/{{ item }}"
        method: DELETE
        headers:
          Authorization: "Bearer {{ ocp_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          gracePeriodSeconds: 0          # Immediate kill; remove for graceful shutdown
        validate_certs: false
        status_code: [200, 202, 404]     # 404 = already gone, treat as OK
      loop: "{{ pod_names }}"
      register: delete_results

    # ------------------------------------------------------------------ #
    # 5. Summary
    # ------------------------------------------------------------------ #
    - name: Deletion summary
      ansible.builtin.debug:
        msg: >-
          Pod '{{ item.item }}' →
          {{ 'DELETED' if item.status in [200, 202] else 'ALREADY GONE' }}
      loop: "{{ delete_results.results }}"
      loop_control:
        label: "{{ item.item }}"