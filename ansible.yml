---
- name: Update JSON payloads and send email
  hosts: localhost
  gather_facts: no
  vars:
    json_file: "sample_payload.json"
    csv_file: "data_fields.csv"
    output_file: "output_payloads.txt"
    recipient_email: "recipient@example.com"  # Replace with the recipient's email
    sender_email: "noreply@localhost"         # Sender email (can be anything for local mail server)
    smtp_host: "localhost"                    # Local mail server
    smtp_port: 25                             # Default SMTP port for local mail server

  tasks:
    - name: Install pip if not present
      become: yes
      apt:
        name: python3-pip
        state: present
      when: ansible_os_family == "Debian"

    - name: Install pip if not present (RedHat)
      become: yes
      yum:
        name: python3-pip
        state: present
      when: ansible_os_family == "RedHat"

    - name: Install required Python packages
      pip:
        name:
          - pandas
        executable: pip3

    - name: Run the Python script to update JSON payloads
      command: >
        python3 update_payloads.py
        {{ json_file }} {{ csv_file }} {{ output_file }}

    - name: Send email with the output file as an attachment
      community.general.mail:
        host: "{{ smtp_host }}"
        port: "{{ smtp_port }}"
        subject: "Updated JSON Payloads"
        body: "Please find the updated JSON payloads attached."
        from: "{{ sender_email }}"
        to: "{{ recipient_email }}"
        attach:
          - "{{ output_file }}"