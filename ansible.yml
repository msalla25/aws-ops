---
- name: Move new files to backup folders
  hosts: your_target_server
  vars:
    base_path: "/path/to/your/folders"
    folder_names:
      - folder1
      - folder2
      - folder3
      - folder4
      - folder5
    max_file_age_minutes: 30

  tasks:
    - name: Find and move new files in each folder
      block:
        - name: Find files younger than {{ max_file_age_minutes }} minutes in {{ current_folder }}
          find:
            paths: "{{ base_path }}/{{ current_folder }}"
            age: "-{{ max_file_age_minutes }}m"
            recurse: no
            file_type: file
          register: new_files

        - name: Move found files to backup
          command: "mv {{ item.path }} {{ base_path }}/{{ current_folder }}_bkp/{{ item.path | basename }}"
          loop: "{{ new_files.files }}"
          when: new_files.matched > 0
      loop: "{{ folder_names }}"
      loop_control:
        loop_var: current_folder