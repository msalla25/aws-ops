- name: Parse Postman collection and run API requests
  hosts: localhost
  vars:
    bearer_token: "your_bearer_token_here"  # Replace with your bearer token
  tasks:
    - name: Parse Postman collection
      set_fact:
        api_requests: "{{ postman_collection | from_json }}"

    - name: Debug parsed API requests
      debug:
        var: api_requests

    - name: Run API requests
      ansible.builtin.uri:
        url: "{{ item.request.url }}"
        method: "{{ item.request.method }}"
        headers: >-
          {{
            item.request.header | items2dict(key_name='key', value_name='value') | combine({
              'Authorization': 'Bearer ' + bearer_token
            })
          }}
        body: "{{ item.request.body | default(omit) }}"
        body_format: "{{ 'json' if item.request.body.mode == 'raw' else omit }}"
        status_code: "{{ item.response | map(attribute='code') | list | default([200]) }}"
        validate_certs: no
      loop: "{{ api_requests.item }}"
      loop_control:
        label: "{{ item.name }}"
      register: api_results

    - name: Display API results
      debug:
        var: api_results