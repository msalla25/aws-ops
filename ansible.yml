---
- name: Send email with updated JSON payloads
  hosts: localhost
  gather_facts: no
  vars:
    output_file: "output_payloads.txt"
    recipient_email: "recipient@example.com"
    sender_email: "noreply@localhost"

  tasks:
    - name: Send email with the output file as an attachment
      shell: |
        echo "Please find the updated JSON payloads attached." | mailx \
        -s "Updated JSON Payloads" \
        -a "{{ output_file }}" \
        -r "{{ sender_email }}" \
        "{{ recipient_email }}"