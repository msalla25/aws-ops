---
- name: Reliable File Mover
  hosts: your_target_server
  vars:
    base_path: "/path/to/your/folders"
    folders: ["folder1", "folder2", "folder3", "folder4", "folder5"]
    max_file_age_minutes: 30

  tasks:
    # First create all backup directories
    - name: Ensure backup directories exist
      file:
        path: "{{ base_path }}/{{ item }}_bkp"
        state: directory
      loop: "{{ folders }}"

    # Main file processing
    - name: Process each folder
      vars:
        current_folder: "{{ item }}"
        source_dir: "{{ base_path }}/{{ current_folder }}"
        backup_dir: "{{ base_path }}/{{ current_folder }}_bkp"
      loop: "{{ folders }}"
      tasks:
        - name: Find new files in {{ current_folder }}
          find:
            paths: "{{ source_dir }}"
            age: "-{{ max_file_age_minutes }}m"
            file_type: file
            recurse: no
          register: file_results

        - name: Move files to backup
          command: "mv '{{ file.path }}' '{{ backup_dir }}/{{ file.path | basename }}'"
          loop: "{{ file_results.files }}"
          loop_control:
            loop_var: file
          when: file_results.matched > 0