---
- name: Simple File Backup
  hosts: your_target_server
  vars:
    base_path: "/path/to/folders"
    folders: ["folder1", "folder2", "folder3", "folder4", "folder5"]

  tasks:
    - name: Create backup directories
      shell: |
        mkdir -p {{ base_path }}/{{ item }}_bkp
      loop: "{{ folders }}"

    - name: Move new files to backup
      shell: |
        find {{ base_path }}/{{ item }} -type f -mmin -30 -exec mv {} {{ base_path }}/{{ item }}_bkp \;
      loop: "{{ folders }}"
      args:
        warn: false  # Displays cleaner output