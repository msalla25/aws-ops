- name: Run API requests
  hosts: localhost
  vars:
    bearer_token: "your_bearer_token_here"  # Replace with your bearer token
  tasks:
    - name: Debug received extra_vars
      debug:
        var: extra_vars

    - name: Run API requests
      ansible.builtin.uri:
        url: "{{ item.url }}"
        method: "{{ item.method }}"
        headers:
          Content-Type: "application/json"
          Authorization: "Bearer {{ bearer_token }}"
        body: "{{ item.body | default(omit) }}"
        body_format: json
        status_code: 200
        validate_certs: no
      loop: "{{ extra_vars.requests }}"
      loop_control:
        label: "{{ item.name }}"
      register: api_results

    - name: Display API results
      debug:
        var: api_results