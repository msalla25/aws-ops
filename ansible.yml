---
- name: Move new files to backup folders
  hosts: your_target_server
  vars:
    base_path: "/path/to/your/folders"
    folder_names:
      - folder1
      - folder2
      - folder3
      - folder4
      - folder5
    max_file_age_minutes: 30

  tasks:
    # First find all new files in all folders
    - name: Find new files in all folders
      ansible.builtin.find:
        paths: "{{ base_path }}/{{ item }}"
        age: "-{{ max_file_age_minutes }}m"
        recurse: no
        file_type: file
      register: found_files
      loop: "{{ folder_names }}"
      loop_control:
        loop_var: current_folder
        label: "Checking {{ current_folder }}"

    # Then process the results to move files
    - name: Move new files to backup folders
      ansible.builtin.command: >
        mv "{{ item.0.path }}" "{{ base_path }}/{{ item.1 }}_bkp/{{ item.0.path | basename }}"
      loop: "{{ found_files.results | subelements('files') }}"
      when: item.0.path is defined
      loop_control:
        label: "Moving {{ item.0.path | basename }}"