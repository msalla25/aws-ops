---
- name: Move new files to backup folders
  hosts: your_target_server
  vars:
    base_path: "/path/to/your/folders"
    folder_names:
      - folder1
      - folder2
      - folder3
      - folder4
      - folder5
    max_file_age_minutes: 30

  tasks:
    - name: Find files younger than {{ max_file_age_minutes }} minutes
      find:
        paths: "{{ base_path }}/{{ item }}"
        age: "-{{ max_file_age_minutes }}m"
        recurse: no
        file_type: file
      register: new_files
      loop: "{{ folder_names }}"

    - name: Move new files to backup folders
      vars:
        current_folder: "{{ item.item }}"
      command: "mv {{ item.file.path }} {{ base_path }}/{{ current_folder }}_bkp/{{ item.file.path | basename }}"
      loop: "{{ new_files.results | selectattr('files', 'defined') | map(attribute='files') | flatten | products(folder_names) | map('combine', {'file': item[0], 'folder': item[1]}) | selectattr('file.matched', 'defined') }}"
      when: item.file.matched > 0