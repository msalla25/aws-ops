---
- name: Move New Files to Backup Folders
  hosts: your_target_server
  vars:
    base_path: "/path/to/your/folders"
    folders: 
      - folder1
      - folder2
      - folder3
      - folder4
      - folder5
    max_file_age_minutes: 30

  tasks:
    - name: Create backup directories
      ansible.builtin.file:
        path: "{{ base_path }}/{{ item }}_bkp"
        state: directory
        mode: '0755'
      loop: "{{ folders }}"

    - name: Process each folder's files
      ansible.builtin.find:
        paths: "{{ base_path }}/{{ item }}"
        age: "-{{ max_file_age_minutes }}m"
        file_type: file
        recurse: no
      register: find_results
      loop: "{{ folders }}"
      loop_control:
        loop_var: current_folder

    - name: Move found files to backup
      ansible.builtin.command: >
        mv "{{ item.0.path }}" 
        "{{ base_path }}/{{ item.1 }}_bkp/{{ item.0.path | basename }}"
      loop: "{{ find_results.results | subelements('files') | product(folders) | flatten(levels=1) }}"
      when: 
        - item.0.path is defined
        - item.0.path | basename in item.0.path