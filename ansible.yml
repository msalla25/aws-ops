---
- name: Move new files to backup folders
  hosts: your_target_server
  vars:
    base_path: "/path/to/your/folders"
    folder_names:
      - folder1
      - folder2
      - folder3
      - folder4
      - folder5
    max_file_age_minutes: 30

  tasks:
    - name: Process each folder to move new files to backup
      block:
        - name: Find new files in {{ current_folder }}
          ansible.builtin.find:
            paths: "{{ base_path }}/{{ current_folder }}"
            age: "-{{ max_file_age_minutes }}m"
            recurse: no
            file_type: file
          register: folder_files

        - name: Display files found (debug)
          ansible.builtin.debug:
            var: folder_files.files
          when: folder_files.matched > 0

        - name: Move new files to backup folder
          ansible.builtin.command: >
            mv "{{ item.path }}" "{{ base_path }}/{{ current_folder }}_bkp/{{ item.path | basename }}"
          loop: "{{ folder_files.files }}"
          when: folder_files.matched > 0
          loop_control:
            label: "{{ item.path | basename }}"

      loop: "{{ folder_names }}"
      loop_control:
        loop_var: current_folder
        label: "{{ current_folder }}"