import os
import winrm

# Read environment variables from GitLab CI
host = os.environ["WINRM_HOST"]
user = os.environ["WINRM_USER"]
python_path = os.environ["PYTHON_PATH"]
deploy_path = os.environ["DEPLOY_PATH"]
venv_path = os.environ["VENV_PATH"]
wheel_name = os.environ["WHEEL_NAME"]

# Establish WinRM session over HTTPS 5986 using Kerberos
session = winrm.Session(
    f"https://{host}:5986/wsman",
    auth=(user, None),           # password not needed if kinit ticket exists
    transport="kerberos",
    server_cert_validation="ignore"
)

# Powershell script to create venv and install wheel
ps_script = f"""
$ErrorActionPreference = 'Stop'

# Ensure deploy folder exists
if (-not (Test-Path "{deploy_path}")) {{
    New-Item -Path "{deploy_path}" -ItemType Directory -Force | Out-Null
}}

# Create venv if missing
if (-not (Test-Path (Join-Path "{venv_path}" 'Scripts\\python.exe'))) {{
    & "{python_path}" -m venv "{venv_path}"
}}

# Activate venv and install wheel
$activate = Join-Path "{venv_path}" 'Scripts\\Activate.ps1'
& $activate
pip install --upgrade pip
pip install (Join-Path "{deploy_path}" "{wheel_name}")
"""

res = session.run_ps(ps_script)

print("STDOUT:", res.std_out.decode())
print("STDERR:", res.std_err.decode())

if res.status_code != 0:
    raise Exception(f"Deployment failed with exit code {res.status_code}")
else:
    print("✅ Deployment completed successfully.")
